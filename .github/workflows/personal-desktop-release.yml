name: Personal Desktop Staging Candidate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BUILD_PERSONAL_STAGING_DESKTOP to create unsigned staging Actions artifacts"
        required: true
        type: string
      source_sha:
        description: "Exact owner-authorized relay/desktop source SHA (an ancestor of the protected verifier commit)"
        required: true
        type: string
      gate1_evidence_run_id:
        description: "Successful Personal Relay Gate 1 workflow run ID bound by the staging receipt"
        required: true
        type: string
      staging_deployment_receipt_sha256:
        description: "SHA-256 of the canonical owner-authorized staging deployment receipt"
        required: true
        type: string
      version:
        description: "Staging desktop semver"
        required: true
        type: string
      target:
        description: "macOS staging target"
        required: true
        default: aarch64-apple-darwin
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

concurrency:
  group: personal-desktop-staging-${{ github.sha }}-${{ inputs.target }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build unsigned staging candidate (${{ inputs.target }})
    if: github.repository == 'justinharkelroad/buzz'
    runs-on: macos-latest
    timeout-minutes: 120
    environment: personal-staging
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      GATE1_EVIDENCE_RUN_ID: ${{ inputs.gate1_evidence_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_AUTO_CONNECT_DEFAULT_RELAY: "true"
      STAGING_BUILD_CHANNEL: personal-staging
      STAGING_DEPLOYMENT_RECEIPT_JSON: ${{ vars.PERSONAL_STAGING_DEPLOYMENT_RECEIPT_JSON }}
      STAGING_DEPLOYMENT_RECEIPT_SHA256: ${{ inputs.staging_deployment_receipt_sha256 }}
      STAGING_URI_SCHEME: buzz-personal-staging
      TARGET: ${{ inputs.target }}
      VERSION: ${{ inputs.version }}
    outputs:
      auto_connect_default_relay: ${{ steps.build-contract.outputs.auto_connect_default_relay }}
      artifact_digest: ${{ steps.uploaded-artifact.outputs.digest }}
      artifact_expires_at: ${{ steps.uploaded-artifact.outputs.expires_at }}
      artifact_id: ${{ steps.uploaded-artifact.outputs.id }}
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      authorization_artifact_digest: ${{ steps.authorization-artifact.outputs.digest }}
      authorization_artifact_expires_at: ${{ steps.authorization-artifact.outputs.expires_at }}
      authorization_artifact_id: ${{ steps.authorization-artifact.outputs.id }}
      authorization_artifact_name: ${{ steps.authorization-name.outputs.name }}
      build_channel: ${{ steps.build-contract.outputs.build_channel }}
      build_contract_sha256: ${{ steps.build-contract.outputs.sha256 }}
      bundle_id: ${{ steps.build-contract.outputs.bundle_id }}
      deep_link_scheme: ${{ steps.build-contract.outputs.deep_link_scheme }}
      gate1_artifact_digest: ${{ steps.deployment.outputs.gate1_artifact_digest }}
      gate1_artifact_expires_at: ${{ steps.deployment.outputs.gate1_artifact_expires_at }}
      gate1_artifact_id: ${{ steps.deployment.outputs.gate1_artifact_id }}
      gate1_artifact_name: ${{ steps.deployment.outputs.gate1_artifact_name }}
      gate1_attestation_bundle_sha256: ${{ steps.deployment.outputs.gate1_bundle_sha }}
      gate1_receipt_sha256: ${{ steps.deployment.outputs.gate1_receipt_sha }}
      gate1_workflow_sha: ${{ steps.deployment.outputs.gate1_workflow_sha }}
      relay_digest: ${{ steps.gate1.outputs.digest }}
      relay_image: ${{ steps.gate1.outputs.image }}
      relay_image_ref: ${{ steps.gate1.outputs.image_ref }}
      relay_https: ${{ steps.build-contract.outputs.relay_https }}
      relay_wss: ${{ steps.build-contract.outputs.relay_wss }}
      product_name: ${{ steps.build-contract.outputs.product_name }}
      target: ${{ steps.build-contract.outputs.target }}
    steps:
      - name: Checkout protected desktop and Gate 1 verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 0
          persist-credentials: false

      - name: Validate protected main and personal-staging controls
        id: controls
        working-directory: verifier
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          RULESET_EVIDENCE_TOKEN: ${{ secrets.PERSONAL_RULESET_EVIDENCE_TOKEN }}
          STAGING_BUILD_CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$STAGING_BUILD_CONFIRMATION" == "BUILD_PERSONAL_STAGING_DESKTOP" ]] || {
            echo "::error::confirmation must be exactly BUILD_PERSONAL_STAGING_DESKTOP"
            exit 1
          }
          [[ "$GITHUB_ACTOR" == "justinharkelroad" && "$GITHUB_TRIGGERING_ACTOR" == "justinharkelroad" ]] || {
            echo "::error::only repository owner justinharkelroad may authorize a personal desktop staging build"
            exit 1
          }
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo "::error::desktop staging candidates require fresh run attempt 1"
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/main" && "$REF_PROTECTED" == true ]] || {
            echo "::error::desktop staging must run from a protected main ref"
            exit 1
          }
          [[ "$GITHUB_WORKFLOW_REF" == "justinharkelroad/buzz/.github/workflows/personal-desktop-release.yml@refs/heads/main" ]] || {
            echo "::error::desktop staging must execute the protected main workflow"
            exit 1
          }
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]]

          [[ -n "$RULESET_EVIDENCE_TOKEN" ]]
          set +e
          classic_reviews_headers=$(GH_TOKEN="$RULESET_EVIDENCE_TOKEN" gh api \
            --hostname github.com --include \
            "repos/$GITHUB_REPOSITORY/branches/main/protection/required_pull_request_reviews" \
            2>/dev/null)
          classic_reviews_exit=$?
          set -e
          classic_reviews_status=$(printf '%s\n' "$classic_reviews_headers" | awk 'NR == 1 {print $2}')
          case "$classic_reviews_status" in
            404) ;;
            200)
              echo "::error::classic main required pull-request reviews are configured"
              exit 1
              ;;
            *)
              echo "::error::classic main required pull-request review absence could not be proven (HTTP ${classic_reviews_status:-unknown}, gh exit $classic_reviews_exit)"
              exit 1
              ;;
          esac
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/branches/main" \
            | jq -S '{
                classic_required_pull_request_reviews: false,
                name,
                protected,
                commit: {sha: .commit.sha}
              }' \
            > /tmp/personal-desktop-main-branch.json
          jq -e --arg sha "$GITHUB_SHA" '
            keys == ["classic_required_pull_request_reviews", "commit", "name", "protected"]
            and (.commit | keys) == ["sha"]
            and .classic_required_pull_request_reviews == false
            and .name == "main"
            and .protected == true
            and .commit.sha == $sha
          ' /tmp/personal-desktop-main-branch.json >/dev/null
          gh api --hostname github.com --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" \
            > /tmp/personal-desktop-main-effective-rule-pages.json
          jq -S '
            def canonical:
              if type == "object" then
                to_entries | sort_by(.key) | map(.value |= canonical) | from_entries
              elif type == "array" then map(canonical)
              else . end;
            [.[][] | {
              type,
              parameters: (.parameters | canonical),
              ruleset_id,
              ruleset_source_type,
              ruleset_source
            }]
            | sort_by(.ruleset_id // 0, .type // "", (.parameters | tojson), .ruleset_source_type // "", .ruleset_source // "")
          ' /tmp/personal-desktop-main-effective-rule-pages.json \
            > /tmp/personal-desktop-main-effective-rules.json
          ruleset_ids=()
          while IFS= read -r ruleset_id; do
            ruleset_ids+=("$ruleset_id")
          done < <(
            jq -r '[.[] | .ruleset_id | select(type == "number" and . >= 1 and floor == .)] | unique | .[]' \
              /tmp/personal-desktop-main-effective-rules.json
          )
          ((${#ruleset_ids[@]} > 0))
          ruleset_dir=/tmp/personal-desktop-main-ruleset-details
          mkdir "$ruleset_dir"
          ruleset_details=()
          for ruleset_id in "${ruleset_ids[@]}"; do
            raw_ruleset="$ruleset_dir/${ruleset_id}.raw.json"
            ruleset_detail="$ruleset_dir/${ruleset_id}.json"
            [[ -n "$RULESET_EVIDENCE_TOKEN" ]]
            GH_TOKEN="$RULESET_EVIDENCE_TOKEN" gh api --hostname github.com \
              "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" > "$raw_ruleset"
            jq -e --argjson ruleset_id "$ruleset_id" '
              .id == $ruleset_id
              and has("bypass_actors")
              and (.bypass_actors | type == "array")
            ' "$raw_ruleset" >/dev/null
            jq -S '{
              id,
              name,
              target,
              source_type,
              source,
              enforcement,
              bypass_actors: (.bypass_actors | sort_by(.actor_type // "", .actor_id // 0, .bypass_mode // ""))
            }' \
              "$raw_ruleset" > "$ruleset_detail"
            ruleset_details+=("$ruleset_detail")
          done
          jq -sS 'sort_by(.id)' "${ruleset_details[@]}" \
            > /tmp/personal-desktop-main-rulesets.json
          bash ./deploy/personal-relay/validate-main-protection.sh \
            --branch-json /tmp/personal-desktop-main-branch.json \
            --rules-json /tmp/personal-desktop-main-effective-rules.json \
            --rulesets-json /tmp/personal-desktop-main-rulesets.json \
            --expected-sha "$GITHUB_SHA" \
            --expected-repository justinharkelroad/buzz

          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/environments/personal-staging" \
            > /tmp/personal-staging-environment.raw.json
          jq -S '{
              id,
              node_id,
              name,
              deployment_branch_policy: {
                protected_branches: .deployment_branch_policy.protected_branches,
                custom_branch_policies: .deployment_branch_policy.custom_branch_policies
              },
              protection_rules: [.protection_rules[]] | sort_by(.type)
            }' /tmp/personal-staging-environment.raw.json \
            > /tmp/personal-staging-environment.json
          gh api --hostname github.com --paginate \
            "repos/$GITHUB_REPOSITORY/environments/personal-staging/deployment-branch-policies?per_page=100" \
            | jq -s '{
                total_count: ([.[].branch_policies[]] | length),
                branch_policies: [.[].branch_policies[] | {id, node_id, name}] | sort_by(.id, .node_id, .name)
              }' \
            > /tmp/personal-staging-branch-policies.json
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1" \
            | jq -S '{
                id,
                run_attempt,
                head_branch,
                head_sha,
                event,
                path,
                repository: {full_name: .repository.full_name},
                actor: {login: .actor.login, id: .actor.id, node_id: .actor.node_id},
                triggering_actor: {login: .triggering_actor.login, id: .triggering_actor.id, node_id: .triggering_actor.node_id}
              }' > /tmp/personal-staging-run-identity.json

          jq -e '
            type == "object"
            and keys == ["deployment_branch_policy", "id", "name", "node_id", "protection_rules"]
            and .name == "personal-staging"
            and (.id | type == "number" and . >= 1 and floor == .)
            and (.node_id | type == "string" and length > 0)
            and .deployment_branch_policy.protected_branches == false
            and .deployment_branch_policy.custom_branch_policies == true
            and ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 0
          ' /tmp/personal-staging-environment.json >/dev/null || {
            echo "::error::personal-staging must be reviewer-free and allow only custom deployment branches"
            exit 1
          }
          jq -e '
            .total_count == 1
            and (.branch_policies | length) == 1
            and (.branch_policies[0] | keys | sort) == ["id", "name", "node_id"]
            and (.branch_policies[0].id | type == "number" and . >= 1 and floor == .)
            and (.branch_policies[0].node_id | type == "string" and length > 0)
            and .branch_policies[0].name == "main"
          ' /tmp/personal-staging-branch-policies.json >/dev/null || {
            echo "::error::personal-staging must have exactly one deployment branch policy for main"
            exit 1
          }
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" '
              .id == $run_id
              and .run_attempt == 1
              and .head_branch == "main"
              and .head_sha == $sha
              and .event == "workflow_dispatch"
              and .path == ".github/workflows/personal-desktop-release.yml"
              and .repository.full_name == $repository
              and .actor.login == "justinharkelroad"
              and (.actor.id | type == "number" and . >= 1 and floor == .)
              and (.actor.node_id | type == "string" and length > 0)
              and .triggering_actor.login == "justinharkelroad"
              and (.triggering_actor.id | type == "number" and . >= 1 and floor == .)
              and (.triggering_actor.node_id | type == "string" and length > 0)
            ' /tmp/personal-staging-run-identity.json >/dev/null

          evaluated_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "branch_policies_sha256=$(shasum -a 256 /tmp/personal-staging-branch-policies.json | awk '{print $1}')"
            echo "environment_sha256=$(shasum -a 256 /tmp/personal-staging-environment.json | awk '{print $1}')"
            echo "evaluated_at=$evaluated_at"
            echo "main_branch_sha256=$(shasum -a 256 /tmp/personal-desktop-main-branch.json | awk '{print $1}')"
            echo "main_rules_sha256=$(shasum -a 256 /tmp/personal-desktop-main-effective-rules.json | awk '{print $1}')"
            echo "main_rulesets_sha256=$(shasum -a 256 /tmp/personal-desktop-main-rulesets.json | awk '{print $1}')"
            echo "run_identity_sha256=$(shasum -a 256 /tmp/personal-staging-run-identity.json | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Validate owner-authorized staging deployment receipt
        id: deployment
        working-directory: verifier
        env:
          EVALUATED_AT: ${{ steps.controls.outputs.evaluated_at }}
        run: |
          set -euo pipefail
          [[ "$STAGING_DEPLOYMENT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::staging_deployment_receipt_sha256 must be 64 lowercase hexadecimal characters"
            exit 1
          }
          [[ -n "$STAGING_DEPLOYMENT_RECEIPT_JSON" ]] || {
            echo "::error::PERSONAL_STAGING_DEPLOYMENT_RECEIPT_JSON is required in personal-staging"
            exit 1
          }
          canonical_receipt=$(jq -ceS . <<<"$STAGING_DEPLOYMENT_RECEIPT_JSON") || {
            echo "::error::staging deployment receipt is not valid JSON"
            exit 1
          }
          computed_sha=$(printf '%s' "$STAGING_DEPLOYMENT_RECEIPT_JSON" \
            | bash ./deploy/personal-relay/canonical-json-sha256.sh)
          [[ "$computed_sha" == "$STAGING_DEPLOYMENT_RECEIPT_SHA256" ]] || {
            echo "::error::staging deployment receipt does not match the owner-authorized SHA-256"
            exit 1
          }
          jq -e \
            --arg evaluated_at "$EVALUATED_AT" \
            --slurpfile run_identity /tmp/personal-staging-run-identity.json '
            . as $receipt
            | ($receipt | keys | sort) == [
                "authorized_at",
                "authorized_by",
                "deployed_relay_image_ref",
                "environment",
                "evidence_reference",
                "forbidden_origins",
                "gate1_attestation_bundle_sha256",
                "gate1_evidence_artifact_digest",
                "gate1_evidence_artifact_id",
                "gate1_evidence_artifact_name",
                "gate1_evidence_expires_at",
                "gate1_evidence_run_attempt",
                "gate1_evidence_run_id",
                "gate1_receipt_sha256",
                "gate1_workflow_sha",
                "hosted_https_origin",
                "https_origin",
                "personal_production_https_origin",
                "relay_pubkey",
                "relay_source_sha",
                "smoke_approval_record_sha256",
                "smoke_completed_at",
                "smoke_passed",
                "wss_origin"
              ]
            and $receipt.environment == "personal-staging"
            and ($receipt.https_origin | type == "string" and length > 0)
            and ($receipt.wss_origin | type == "string" and length > 0)
            and ($receipt.hosted_https_origin | type == "string" and length > 0)
            and ($receipt.personal_production_https_origin | type == "string" and length > 0)
            and ($receipt.forbidden_origins | type == "array" and length >= 2)
            and all($receipt.forbidden_origins[]; type == "string" and length > 0)
            and ($receipt.forbidden_origins | index($receipt.hosted_https_origin) != null)
            and ($receipt.forbidden_origins | index($receipt.personal_production_https_origin) != null)
            and ($receipt.deployed_relay_image_ref | test("^ghcr\\.io/justinharkelroad/[a-z0-9._-]+@sha256:[0-9a-f]{64}$"))
            and ($receipt.relay_source_sha | test("^[0-9a-f]{40}$"))
            and ($receipt.gate1_workflow_sha | test("^[0-9a-f]{40}$"))
            and ($receipt.gate1_evidence_run_id | type == "number" and . >= 1 and floor == .)
            and $receipt.gate1_evidence_run_attempt == 1
            and ($receipt.gate1_evidence_artifact_id | type == "number" and . >= 1 and floor == .)
            and ($receipt.gate1_evidence_artifact_name | type == "string" and test("^[A-Za-z0-9._-]+$"))
            and ($receipt.gate1_evidence_artifact_digest | test("^sha256:[0-9a-f]{64}$"))
            and ($receipt.gate1_evidence_expires_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and ($receipt.gate1_receipt_sha256 | test("^[0-9a-f]{64}$"))
            and ($receipt.gate1_attestation_bundle_sha256 | test("^[0-9a-f]{64}$"))
            and ($receipt.relay_pubkey | test("^[0-9a-f]{64}$"))
            and ($receipt.smoke_approval_record_sha256 | test("^[0-9a-f]{64}$"))
            and $receipt.smoke_passed == true
            and ($receipt.smoke_completed_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and ($receipt.authorized_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and ($evaluated_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and (($receipt.smoke_completed_at | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%SZ")) == $receipt.smoke_completed_at)
            and (($receipt.authorized_at | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%SZ")) == $receipt.authorized_at)
            and (($evaluated_at | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%SZ")) == $evaluated_at)
            and (($receipt.smoke_completed_at | fromdateiso8601) <= ($receipt.authorized_at | fromdateiso8601))
            and (($receipt.authorized_at | fromdateiso8601) <= ($evaluated_at | fromdateiso8601))
            and ($receipt.authorized_by | type == "object")
            and (($receipt.authorized_by | keys | sort) == ["id", "login", "node_id"])
            and $receipt.authorized_by.login == "justinharkelroad"
            and ($receipt.authorized_by.id | type == "number" and . >= 1 and floor == .)
            and ($receipt.authorized_by.node_id | type == "string" and length > 0)
            and $receipt.authorized_by == $run_identity[0].actor
            and $receipt.authorized_by == $run_identity[0].triggering_actor
            and ($receipt.evidence_reference | type == "string" and test("^[A-Za-z0-9._:/-]+$"))
          ' <<<"$canonical_receipt" >/dev/null || {
            echo "::error::staging deployment receipt is incomplete or invalid"
            exit 1
          }
          node --input-type=module - "$canonical_receipt" <<'NODE'
          const receipt = JSON.parse(process.argv[2]);
          const parseHttpsOrigin = (value) => {
            const url = new URL(value);
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash || value !== url.origin) {
              throw new Error("invalid HTTPS origin");
            }
            return url;
          };
          const stagingHttps = parseHttpsOrigin(receipt.https_origin);
          const hostedHttps = parseHttpsOrigin(receipt.hosted_https_origin);
          const productionHttps = parseHttpsOrigin(receipt.personal_production_https_origin);
          const stagingWss = new URL(receipt.wss_origin);
          if (stagingWss.protocol !== "wss:" || stagingWss.username || stagingWss.password || stagingWss.pathname !== "/" || stagingWss.search || stagingWss.hash || receipt.wss_origin !== stagingWss.origin) {
            throw new Error("invalid WSS origin");
          }
          if (stagingWss.host !== stagingHttps.host || stagingHttps.origin === hostedHttps.origin || stagingHttps.origin === productionHttps.origin || hostedHttps.origin === productionHttps.origin) {
            throw new Error("staging, hosted, and production origins are not isolated");
          }
          const forbidden = new Set(receipt.forbidden_origins.map((origin) => parseHttpsOrigin(origin).origin));
          if (forbidden.size !== receipt.forbidden_origins.length || !forbidden.has(hostedHttps.origin) || !forbidden.has(productionHttps.origin) || forbidden.has(stagingHttps.origin)) {
            throw new Error("forbidden-origin receipt does not protect staging");
          }
          NODE
          printf '%s\n' "$canonical_receipt" \
            > /tmp/personal-staging-deployment-receipt.json
          relay_https=$(jq -r .https_origin <<<"$canonical_receipt")
          relay_wss=$(jq -r .wss_origin <<<"$canonical_receipt")
          {
            echo "authorized_at=$(jq -r .authorized_at <<<"$canonical_receipt")"
            echo "authorized_by=$(jq -c .authorized_by <<<"$canonical_receipt")"
            echo "evidence_reference=$(jq -r .evidence_reference <<<"$canonical_receipt")"
            echo "image_ref=$(jq -r .deployed_relay_image_ref <<<"$canonical_receipt")"
            echo "receipt_sha=$computed_sha"
            echo "relay_https=$relay_https"
            echo "relay_wss=$relay_wss"
            echo "hosted_https=$(jq -r .hosted_https_origin <<<"$canonical_receipt")"
            echo "personal_production_https=$(jq -r .personal_production_https_origin <<<"$canonical_receipt")"
            echo "relay_pubkey=$(jq -r .relay_pubkey <<<"$canonical_receipt")"
            echo "smoke_record_sha=$(jq -r .smoke_approval_record_sha256 <<<"$canonical_receipt")"
            echo "gate1_workflow_sha=$(jq -r .gate1_workflow_sha <<<"$canonical_receipt")"
            echo "gate1_run_id=$(jq -r .gate1_evidence_run_id <<<"$canonical_receipt")"
            echo "gate1_run_attempt=$(jq -r .gate1_evidence_run_attempt <<<"$canonical_receipt")"
            echo "gate1_artifact_id=$(jq -r .gate1_evidence_artifact_id <<<"$canonical_receipt")"
            echo "gate1_artifact_name=$(jq -r .gate1_evidence_artifact_name <<<"$canonical_receipt")"
            echo "gate1_artifact_digest=$(jq -r .gate1_evidence_artifact_digest <<<"$canonical_receipt")"
            echo "gate1_artifact_expires_at=$(jq -r .gate1_evidence_expires_at <<<"$canonical_receipt")"
            echo "gate1_receipt_sha=$(jq -r .gate1_receipt_sha256 <<<"$canonical_receipt")"
            echo "gate1_bundle_sha=$(jq -r .gate1_attestation_bundle_sha256 <<<"$canonical_receipt")"
            echo "smoke_completed_at=$(jq -r .smoke_completed_at <<<"$canonical_receipt")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify protected verifier, source ancestry, configuration, and Gate 1 run
        working-directory: verifier
        env:
          DEPLOYED_RELAY_IMAGE_REF: ${{ steps.deployment.outputs.image_ref }}
          GATE1_ARTIFACT_NAME: ${{ steps.deployment.outputs.gate1_artifact_name }}
          GATE1_RUN_ATTEMPT: ${{ steps.deployment.outputs.gate1_run_attempt }}
          GATE1_WORKFLOW_SHA: ${{ steps.deployment.outputs.gate1_workflow_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY_HTTPS: ${{ steps.deployment.outputs.relay_https }}
          RELAY_WSS: ${{ steps.deployment.outputs.relay_wss }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA" || {
            echo "::error::owner-authorized source is not an ancestor of the protected desktop verifier"
            exit 1
          }
          [[ "$GATE1_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GATE1_EVIDENCE_RUN_ID" == "${{ steps.deployment.outputs.gate1_run_id }}" ]]
          [[ "$GATE1_RUN_ATTEMPT" == 1 ]]
          [[ "$GATE1_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          digest_hex=${DEPLOYED_RELAY_IMAGE_REF##*@sha256:}
          [[ "$GATE1_ARTIFACT_NAME" == "personal-relay-gate1-receipt-${SOURCE_SHA}-${digest_hex}-${GATE1_EVIDENCE_RUN_ID}-1" ]]
          jq -e --arg source_sha "$SOURCE_SHA" '.relay_source_sha == $source_sha' \
            <<<"$STAGING_DEPLOYMENT_RECEIPT_JSON" >/dev/null
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          node --input-type=module <<'NODE'
          const wss = new URL(process.env.RELAY_WSS);
          const https = new URL(process.env.RELAY_HTTPS);
          const cleanOrigin = (url, scheme) =>
            url.protocol === scheme &&
            !url.username && !url.password &&
            (url.pathname === "/" || url.pathname === "") &&
            !url.search && !url.hash;
          if (!cleanOrigin(wss, "wss:") || !cleanOrigin(https, "https:") || wss.host !== https.host) {
            console.error("staging relay URLs must be matching, credential-free WSS and HTTPS origins");
            process.exit(1);
          }
          NODE

          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/runs/$GATE1_EVIDENCE_RUN_ID/attempts/1" \
            > /tmp/personal-relay-gate1-workflow-run.json
          jq -e \
            --argjson run_id "$GATE1_EVIDENCE_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_sha "$GATE1_WORKFLOW_SHA" '
              .id == $run_id
              and .run_attempt == 1
              and .head_sha == $workflow_sha
              and .head_branch == "main"
              and .repository.full_name == $repository
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/personal-relay-gate1.yml"
            ' /tmp/personal-relay-gate1-workflow-run.json >/dev/null
          jq -S '{
              id,
              run_attempt,
              head_sha,
              head_branch,
              event,
              status,
              conclusion,
              path,
              repository: {full_name: .repository.full_name}
            }' /tmp/personal-relay-gate1-workflow-run.json \
            > /tmp/personal-relay-gate1-workflow-run-sanitized.json

      - name: Download exact Gate 1 evidence artifact
        working-directory: verifier
        env:
          GATE1_ARTIFACT_DIGEST: ${{ steps.deployment.outputs.gate1_artifact_digest }}
          GATE1_ARTIFACT_EXPIRES_AT: ${{ steps.deployment.outputs.gate1_artifact_expires_at }}
          GATE1_ARTIFACT_ID: ${{ steps.deployment.outputs.gate1_artifact_id }}
          GATE1_ARTIFACT_NAME: ${{ steps.deployment.outputs.gate1_artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$GATE1_ARTIFACT_ID" \
            --run-id "$GATE1_EVIDENCE_RUN_ID" \
            --name "$GATE1_ARTIFACT_NAME" \
            --digest "$GATE1_ARTIFACT_DIGEST" \
            --expires-at "$GATE1_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-relay-gate1-evidence \
            --metadata-output /tmp/personal-relay-gate1-artifact.json \
            --archive-output /tmp/personal-relay-gate1-evidence.zip

      - name: Validate and independently verify exact Gate 1 receipt
        id: gate1
        working-directory: verifier
        env:
          DEPLOYED_RELAY_IMAGE_REF: ${{ steps.deployment.outputs.image_ref }}
          GATE1_ATTESTATION_BUNDLE_SHA256: ${{ steps.deployment.outputs.gate1_bundle_sha }}
          GATE1_RECEIPT_SHA256: ${{ steps.deployment.outputs.gate1_receipt_sha }}
          GATE1_WORKFLOW_SHA: ${{ steps.deployment.outputs.gate1_workflow_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          evidence=/tmp/personal-relay-gate1-evidence
          receipt="$evidence/personal-relay-gate1-receipt.json"
          bundle="$evidence/personal-relay-gate1-attestation-bundle.json"
          test -s "$receipt"
          test -s "$bundle"
          test -s "$evidence/personal-relay-main-branch.json"
          test -s "$evidence/personal-relay-main-effective-rules.json"
          test -s "$evidence/personal-relay-gate1-main-rulesets.json"
          [[ "$(bash ./deploy/personal-relay/canonical-json-sha256.sh "$receipt")" == "$GATE1_RECEIPT_SHA256" ]]
          [[ "$(shasum -a 256 "$bundle" | awk '{print $1}')" == "$GATE1_ATTESTATION_BUNDLE_SHA256" ]]
          gate1_main_branch_sha=$(shasum -a 256 "$evidence/personal-relay-main-branch.json" | awk '{print $1}')
          gate1_main_rules_sha=$(shasum -a 256 "$evidence/personal-relay-main-effective-rules.json" | awk '{print $1}')
          gate1_main_rulesets_sha=$(shasum -a 256 "$evidence/personal-relay-gate1-main-rulesets.json" | awk '{print $1}')
          bash ./deploy/personal-relay/validate-main-protection.sh \
            --branch-json "$evidence/personal-relay-main-branch.json" \
            --rules-json "$evidence/personal-relay-main-effective-rules.json" \
            --rulesets-json "$evidence/personal-relay-gate1-main-rulesets.json" \
            --expected-sha "$GATE1_WORKFLOW_SHA" \
            --expected-repository justinharkelroad/buzz
          now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            --arg deployment_ref "$DEPLOYED_RELAY_IMAGE_REF" \
            --arg gate1_main_branch_sha "$gate1_main_branch_sha" \
            --arg gate1_main_rules_sha "$gate1_main_rules_sha" \
            --arg gate1_main_rulesets_sha "$gate1_main_rulesets_sha" \
            --arg workflow_sha "$GATE1_WORKFLOW_SHA" \
            --arg workflow_run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GATE1_EVIDENCE_RUN_ID" \
            --arg now "$now" \
            --slurpfile gate1_run /tmp/personal-relay-gate1-workflow-run.json '
              .gate1_workflow.authorized_owner as $authorized_owner
              | .schema_version == 2
              and .receipt_type == "personal-relay-gate1"
              and ($authorized_owner | type == "object")
              and (($authorized_owner | keys | sort) == ["id", "login", "node_id"])
              and $authorized_owner.login == "justinharkelroad"
              and ($authorized_owner.id | type == "number" and . >= 1 and floor == .)
              and ($authorized_owner.node_id | type == "string" and length > 0)
              and ($gate1_run | length) == 1
              and $authorized_owner == ($gate1_run[0].actor | {login, id, node_id})
              and $authorized_owner == ($gate1_run[0].triggering_actor | {login, id, node_id})
              and .release_evidence.release_authorization.authorized_owner == "justinharkelroad"
              and .repository == "justinharkelroad/buzz"
              and .source_sha == $source_sha
              and .deployment_ref == $deployment_ref
              and .deployment_ref == (.image + "@" + .image_digest)
              and .gate1_workflow.sha == $workflow_sha
              and .gate1_workflow.ref == "justinharkelroad/buzz/.github/workflows/personal-relay-gate1.yml@refs/heads/main"
              and .gate1_workflow.run == $workflow_run
              and .gate1_workflow.run_attempt == 1
              and .main_protection.branch == "main"
              and .main_protection.commit_sha == $workflow_sha
              and .main_protection.ref_protected == true
              and .main_protection.branch_metadata_sha256 == $gate1_main_branch_sha
              and .main_protection.effective_rules_sha256 == $gate1_main_rules_sha
              and .main_protection.rulesets_sha256 == $gate1_main_rulesets_sha
              and .findings.complete == true
              and .deployment_eligible == true
              and (.eligibility_expires_at | fromdateiso8601) > ($now | fromdateiso8601)
              and (.release_evidence.expires_at | fromdateiso8601) > ($now | fromdateiso8601)
              and (.eligibility_expires_at | fromdateiso8601) <= (.release_evidence.expires_at | fromdateiso8601)
              and .non_effects.actions_evidence_artifacts_published == true
              and .non_effects.registry_package_published == false
              and .non_effects.registry_package_mutated == false
              and .non_effects.candidate_tag_mutated == false
              and .non_effects.infrastructure_deployed == false
              and .non_effects.desktop_installed == false
              and .non_effects.hosted_buzz_changed == false
              and .non_effects.production_cutover_authorized == false
            ' "$receipt" >/dev/null
          image=$(jq -r .image "$receipt")
          digest=$(jq -r .image_digest "$receipt")
          export DOCKER_CONFIG=/tmp/personal-desktop-gate1-docker-config
          mkdir -p "$DOCKER_CONFIG"
          registry_auth=$(printf '%s' "${GITHUB_ACTOR}:${GH_TOKEN}" | base64 | tr -d '\n')
          jq -n --arg auth "$registry_auth" '{auths: {"ghcr.io": {auth: $auth}}}' \
            > "$DOCKER_CONFIG/config.json"
          gh attestation verify "oci://${DEPLOYED_RELAY_IMAGE_REF}" \
            --hostname github.com \
            --bundle "$bundle" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://github.com/justinharkelroad/buzz/attestations/personal-relay-gate1/v1 \
            --source-digest "$GATE1_WORKFLOW_SHA" \
            --source-ref refs/heads/main \
            --signer-workflow github.com/justinharkelroad/buzz/.github/workflows/personal-relay-gate1.yml \
            --signer-digest "$GATE1_WORKFLOW_SHA" \
            --deny-self-hosted-runners \
            --format json > /tmp/personal-relay-gate1-desktop-verification.json
          jq -e \
            --arg image "$image" \
            --arg digest "${digest#sha256:}" \
            --slurpfile receipt "$receipt" '
              length == 1
              and all(.[].verificationResult.statement;
                .predicateType == "https://github.com/justinharkelroad/buzz/attestations/personal-relay-gate1/v1"
                and any(.subject[]?; .name == $image and .digest.sha256 == $digest)
                and .predicate == $receipt[0]
              )
            ' /tmp/personal-relay-gate1-desktop-verification.json >/dev/null
          rm -f "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG"
          {
            echo "digest=$digest"
            echo "eligibility_expires_at=$(jq -r .eligibility_expires_at "$receipt")"
            echo "image=$image"
            echo "image_ref=$DEPLOYED_RELAY_IMAGE_REF"
            echo "main_branch_sha256=$gate1_main_branch_sha"
            echo "main_rules_sha256=$gate1_main_rules_sha"
            echo "main_rulesets_sha256=$gate1_main_rulesets_sha"
            echo "release_evidence_expires_at=$(jq -r .release_evidence.expires_at "$receipt")"
          } >> "$GITHUB_OUTPUT"

      - name: Create immutable desktop build contract
        id: build-contract
        working-directory: verifier
        env:
          BASE_BUNDLE_ID: ${{ vars.PERSONAL_DESKTOP_BUNDLE_ID }}
          BASE_PRODUCT_NAME: ${{ vars.PERSONAL_DESKTOP_PRODUCT_NAME }}
          RELAY_HTTPS: ${{ steps.deployment.outputs.relay_https }}
          RELAY_WSS: ${{ steps.deployment.outputs.relay_wss }}
          RECEIPT_SHA256: ${{ steps.deployment.outputs.receipt_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_PRODUCT_NAME" =~ ^[A-Za-z0-9]([A-Za-z0-9._\ -]{0,62}[A-Za-z0-9])?$ ]] || {
            echo "::error::PERSONAL_DESKTOP_PRODUCT_NAME must be 1-64 safe filename characters with alphanumeric ends"
            exit 1
          }
          [[ "$BASE_BUNDLE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9.-]+[A-Za-z0-9]$ ]] || {
            echo "::error::PERSONAL_DESKTOP_BUNDLE_ID must be a safe reverse-DNS identifier"
            exit 1
          }
          [[ "$STAGING_AUTO_CONNECT_DEFAULT_RELAY" == true ]]
          [[ "$STAGING_BUILD_CHANNEL" == personal-staging ]]
          [[ "$STAGING_URI_SCHEME" =~ ^[a-z][a-z0-9+.-]*$ && "$STAGING_URI_SCHEME" != buzz ]]
          product_name="$BASE_PRODUCT_NAME Staging"
          bundle_id="$BASE_BUNDLE_ID.staging"
          jq -nS \
            --argjson auto_connect_default_relay "$STAGING_AUTO_CONNECT_DEFAULT_RELAY" \
            --arg build_channel "$STAGING_BUILD_CHANNEL" \
            --arg bundle_id "$bundle_id" \
            --arg deep_link_scheme "$STAGING_URI_SCHEME" \
            --arg product_name "$product_name" \
            --arg receipt_sha256 "$RECEIPT_SHA256" \
            --arg relay_https "$RELAY_HTTPS" \
            --arg relay_wss "$RELAY_WSS" \
            --arg source_sha "$SOURCE_SHA" \
            --arg target "$TARGET" \
            --arg version "$VERSION" \
            '{
              auto_connect_default_relay: $auto_connect_default_relay,
              build_channel: $build_channel,
              bundle_id: $bundle_id,
              deep_link_scheme: $deep_link_scheme,
              product_name: $product_name,
              receipt_sha256: $receipt_sha256,
              relay_https: $relay_https,
              relay_wss: $relay_wss,
              source_sha: $source_sha,
              target: $target,
              version: $version
            }' > /tmp/personal-desktop-build-contract.json
          jq -e \
            --argjson auto_connect_default_relay "$STAGING_AUTO_CONNECT_DEFAULT_RELAY" \
            --arg build_channel "$STAGING_BUILD_CHANNEL" \
            --arg bundle_id "$bundle_id" \
            --arg deep_link_scheme "$STAGING_URI_SCHEME" \
            --arg product_name "$product_name" \
            --arg receipt_sha256 "$RECEIPT_SHA256" \
            --arg relay_https "$RELAY_HTTPS" \
            --arg relay_wss "$RELAY_WSS" \
            --arg source_sha "$SOURCE_SHA" \
            --arg target "$TARGET" \
            --arg version "$VERSION" '
              (keys | sort) == [
                "auto_connect_default_relay", "build_channel", "bundle_id",
                "deep_link_scheme", "product_name", "receipt_sha256",
                "relay_https", "relay_wss", "source_sha", "target", "version"
              ]
              and .auto_connect_default_relay == $auto_connect_default_relay
              and .build_channel == $build_channel
              and .bundle_id == $bundle_id
              and .deep_link_scheme == $deep_link_scheme
              and .product_name == $product_name
              and .receipt_sha256 == $receipt_sha256
              and .relay_https == $relay_https
              and .relay_wss == $relay_wss
              and .source_sha == $source_sha
              and .target == $target
              and .version == $version
            ' /tmp/personal-desktop-build-contract.json >/dev/null
          contract_sha=$(shasum -a 256 /tmp/personal-desktop-build-contract.json | awk '{print $1}')
          {
            echo "auto_connect_default_relay=$STAGING_AUTO_CONNECT_DEFAULT_RELAY"
            echo "build_channel=$STAGING_BUILD_CHANNEL"
            echo "bundle_id=$bundle_id"
            echo "deep_link_scheme=$STAGING_URI_SCHEME"
            echo "product_name=$product_name"
            echo "receipt_sha256=$RECEIPT_SHA256"
            echo "relay_https=$RELAY_HTTPS"
            echo "relay_wss=$RELAY_WSS"
            echo "sha256=$contract_sha"
            echo "source_sha=$SOURCE_SHA"
            echo "target=$TARGET"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve authorization artifact name
        id: authorization-name
        working-directory: verifier
        run: echo "name=personal-desktop-authorization-${GITHUB_SHA}-${SOURCE_SHA}-${GITHUB_RUN_ID}-1" >> "$GITHUB_OUTPUT"

      - name: Seal pre-candidate authorization and control evidence
        working-directory: verifier
        run: |
          set -euo pipefail
          stage=/tmp/personal-desktop-authorization-evidence
          mkdir -p "$stage"
          cp /tmp/personal-desktop-main-branch.json "$stage/"
          cp /tmp/personal-desktop-main-effective-rules.json "$stage/"
          cp /tmp/personal-desktop-main-rulesets.json "$stage/"
          cp /tmp/personal-desktop-build-contract.json "$stage/"
          cp /tmp/personal-staging-environment.json "$stage/"
          cp /tmp/personal-staging-deployment-receipt.json "$stage/"
          cp /tmp/personal-staging-branch-policies.json "$stage/"
          cp /tmp/personal-staging-run-identity.json "$stage/"
          cp /tmp/personal-relay-gate1-artifact.json "$stage/"
          cp /tmp/personal-relay-gate1-workflow-run-sanitized.json \
            "$stage/personal-relay-gate1-workflow-run.json"
          cp /tmp/personal-relay-gate1-desktop-verification.json "$stage/"
          cp /tmp/personal-relay-gate1-evidence/personal-relay-gate1-receipt.json "$stage/"
          cp /tmp/personal-relay-gate1-evidence/personal-relay-gate1-attestation-bundle.json "$stage/"
          cp /tmp/personal-relay-gate1-evidence/personal-relay-main-branch.json "$stage/"
          cp /tmp/personal-relay-gate1-evidence/personal-relay-main-effective-rules.json "$stage/"
          cp /tmp/personal-relay-gate1-evidence/personal-relay-gate1-main-rulesets.json "$stage/"
          [[ "$(find "$stage" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 16 ]]
          [[ -z "$(find "$stage" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]

      - name: Upload sealed pre-candidate authorization evidence
        id: authorization-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.authorization-name.outputs.name }}
          path: /tmp/personal-desktop-authorization-evidence/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Bind sealed authorization artifact identity
        id: authorization-artifact
        working-directory: verifier
        env:
          ARTIFACT_ID: ${{ steps.authorization-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.authorization-name.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_DIGEST: ${{ steps.authorization-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          case "$UPLOAD_DIGEST" in
            sha256:*) artifact_digest=$UPLOAD_DIGEST ;;
            *) artifact_digest="sha256:$UPLOAD_DIGEST" ;;
          esac
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > /tmp/personal-desktop-authorization-artifact.json
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg digest "$artifact_digest" \
            --arg name "$ARTIFACT_NAME" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $run_id
              and (.expires_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' /tmp/personal-desktop-authorization-artifact.json >/dev/null
          {
            echo "digest=$artifact_digest"
            echo "expires_at=$(jq -r .expires_at /tmp/personal-desktop-authorization-artifact.json)"
            echo "id=$ARTIFACT_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact owner-authorized source for the desktop build
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact owner-authorized source checkout
        env:
          BASH_ENV: ""
          ENV: ""
          EXPECTED_SOURCE_SHA: ${{ steps.build-contract.outputs.source_sha }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]] || {
            echo "::error::desktop build checkout does not match the exact Gate 1 source"
            exit 1
          }

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        env:
          BASH_ENV: ""
          ENV: ""
        run: just desktop-install-ci

      - name: Add Rust target
        env:
          BASH_ENV: ""
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          ENV: ""
        run: rustup target add "$DESKTOP_TARGET"

      - name: Patch staging artifact version
        env:
          BASH_ENV: ""
          DESKTOP_VERSION: ${{ steps.build-contract.outputs.version }}
          ENV: ""
        run: |
          cd desktop
          node scripts/set-version-from-tag.mjs "$DESKTOP_VERSION"
          cd src-tauri
          cargo update --workspace

      - name: Generate staging-only Tauri configuration
        env:
          BASH_ENV: ""
          BUZZ_RELAY_HTTP: ${{ steps.build-contract.outputs.relay_https }}
          BUZZ_RELAY_URL: ${{ steps.build-contract.outputs.relay_wss }}
          ENV: ""
          EXPECTED_BUILD_CHANNEL: ${{ steps.build-contract.outputs.build_channel }}
          EXPECTED_BUNDLE_ID: ${{ steps.build-contract.outputs.bundle_id }}
          EXPECTED_PRODUCT_NAME: ${{ steps.build-contract.outputs.product_name }}
          EXPECTED_URI_SCHEME: ${{ steps.build-contract.outputs.deep_link_scheme }}
        run: |
          /bin/cp desktop/src-tauri/Info.plist \
            desktop/src-tauri/Info.personal-staging.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $EXPECTED_PRODUCT_NAME" \
            desktop/src-tauri/Info.personal-staging.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $EXPECTED_PRODUCT_NAME" \
            desktop/src-tauri/Info.personal-staging.plist
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const stagingUriScheme = process.env.EXPECTED_URI_SCHEME;
          if (
            !stagingUriScheme ||
            !/^[a-z][a-z0-9+.-]*$/.test(stagingUriScheme) ||
            stagingUriScheme === "buzz"
          ) {
            throw new Error("staging URI scheme must be valid and distinct from buzz");
          }
          if (process.env.EXPECTED_BUILD_CHANNEL !== "personal-staging") {
            throw new Error("staging build channel marker is missing");
          }

          const config = {
            productName: process.env.EXPECTED_PRODUCT_NAME,
            identifier: process.env.EXPECTED_BUNDLE_ID,
            bundle: {
              createUpdaterArtifacts: false,
              macOS: {
                infoPlist: "Info.personal-staging.plist",
                minimumSystemVersion: "10.15",
              },
            },
            plugins: {
              updater: { endpoints: [] },
              "deep-link": {
                desktop: { schemes: [stagingUriScheme] },
              },
            },
          };
          writeFileSync(
            "desktop/src-tauri/tauri.personal-staging.conf.json",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE

      - name: Build matching sidecars
        env:
          BASH_ENV: ""
          BUZZ_BUILD_SOURCE_SHA: ${{ steps.build-contract.outputs.source_sha }}
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          ENV: ""
        run: |
          cargo build --release --locked --target "$DESKTOP_TARGET" \
            -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp \
            -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$DESKTOP_TARGET"

      - name: Validate and build locked mesh native libraries
        if: inputs.target == 'aarch64-apple-darwin'
        env:
          BASH_ENV: ""
          ENV: ""
          EXPECTED_MESH_REMOTE: https://github.com/Mesh-LLM/mesh-llm.git
          EXPECTED_MESH_REV: e60b2fe43aa05271569fbeff2a457133aef456a1
          EXPECTED_MESH_TAG: v0.74.0
          EXPECTED_MESH_VERSION: 0.74.0
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MESH_REMOTE" == "https://github.com/Mesh-LLM/mesh-llm.git" ]]
          [[ "$EXPECTED_MESH_TAG" == "v0.74.0" ]]
          [[ "$EXPECTED_MESH_VERSION" == "0.74.0" ]]
          [[ "$EXPECTED_MESH_REV" =~ ^[0-9a-f]{40}$ ]]
          export EXPECTED_MESH_SOURCE="git+${EXPECTED_MESH_REMOTE}?tag=${EXPECTED_MESH_TAG}#${EXPECTED_MESH_REV}"
          python3 <<'PY'
          import os
          import tomllib

          remote = os.environ["EXPECTED_MESH_REMOTE"]
          tag = os.environ["EXPECTED_MESH_TAG"]
          version = os.environ["EXPECTED_MESH_VERSION"]
          source = os.environ["EXPECTED_MESH_SOURCE"]
          direct = (
              "mesh-llm-sdk",
              "mesh-llm-host-runtime",
              "mesh-llm-client",
              "mesh-llm-node",
              "mesh-llm-system",
              "mesh-llm-events",
          )
          with open("desktop/src-tauri/Cargo.toml", "rb") as manifest_file:
              manifest = tomllib.load(manifest_file)
          dependencies = manifest.get("dependencies", {})
          for name in direct:
              dependency = dependencies.get(name)
              if not isinstance(dependency, dict):
                  raise SystemExit(f"missing exact direct mesh dependency {name}")
              if dependency.get("git") != remote or dependency.get("tag") != tag:
                  raise SystemExit(f"unexpected direct mesh source selector for {name}")
              if dependency.get("package") != name:
                  raise SystemExit(f"unexpected direct mesh package mapping for {name}")
              if any(key in dependency for key in ("path", "branch", "rev", "registry", "version")):
                  raise SystemExit(f"alternate mesh source selector present for {name}")
          for lock_path in ("Cargo.lock", "desktop/src-tauri/Cargo.lock"):
              with open(lock_path, "rb") as lock_file:
                  lock = tomllib.load(lock_file)
              packages = lock.get("package", [])
              for name in direct:
                  matches = [package for package in packages if package.get("name") == name]
                  if len(matches) != 1 or matches[0].get("source") != source:
                      raise SystemExit(f"{lock_path}: non-exact or duplicate {name}")
              sdk = [package for package in packages if package.get("name") == "mesh-llm-sdk"]
              if sdk[0].get("version") != version:
                  raise SystemExit(f"{lock_path}: unexpected mesh-llm-sdk version")
              for package in packages:
                  package_source = package.get("source", "")
                  if package_source.startswith(f"git+{remote}") and package_source != source:
                      raise SystemExit(f"{lock_path}: mixed mesh source revisions")
          PY

          root_lock_before=$(shasum -a 256 Cargo.lock | awk '{print $1}')
          desktop_lock_before=$(shasum -a 256 desktop/src-tauri/Cargo.lock | awk '{print $1}')
          cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml \
            --target aarch64-apple-darwin
          [[ "$(shasum -a 256 Cargo.lock | awk '{print $1}')" == "$root_lock_before" ]]
          [[ "$(shasum -a 256 desktop/src-tauri/Cargo.lock | awk '{print $1}')" == "$desktop_lock_before" ]]
          metadata=$(mktemp /tmp/personal-desktop-mesh-metadata.XXXXXX)
          manifest_result=$(mktemp /tmp/personal-desktop-mesh-manifest.XXXXXX)
          trap 'rm -f "$metadata" "$manifest_result"' EXIT
          [[ -f "$metadata" && ! -L "$metadata" && -f "$manifest_result" && ! -L "$manifest_result" ]]
          cargo metadata --locked --offline --format-version 1 \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --features mesh-llm \
            --filter-platform aarch64-apple-darwin > "$metadata"
          python3 - "$metadata" > "$manifest_result" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          source = os.environ["EXPECTED_MESH_SOURCE"]
          version = os.environ["EXPECTED_MESH_VERSION"]
          packages = [
              package for package in metadata.get("packages", [])
              if package.get("name") == "mesh-llm-sdk"
              and package.get("version") == version
              and package.get("source") == source
          ]
          if len(packages) != 1:
              raise SystemExit("metadata did not resolve exactly one locked mesh-llm-sdk")
          resolve = metadata.get("resolve") or {}
          root = resolve.get("root")
          nodes = {node["id"]: node for node in resolve.get("nodes", [])}
          if not root or root not in nodes:
              raise SystemExit("metadata has no reachable root package")
          seen = set()
          pending = [root]
          while pending:
              package_id = pending.pop()
              if package_id in seen:
                  continue
              seen.add(package_id)
              node = nodes.get(package_id)
              if node is None:
                  raise SystemExit("metadata dependency graph is incomplete")
              pending.extend(dependency["pkg"] for dependency in node.get("deps", []))
          if packages[0]["id"] not in seen:
              raise SystemExit("mesh-llm-sdk is not reachable in the enabled build graph")
          manifest_path = packages[0].get("manifest_path", "")
          if not manifest_path or "\n" in manifest_path or "\r" in manifest_path:
              raise SystemExit("invalid mesh manifest path")
          print(manifest_path)
          PY
          mesh_manifest=$(cat "$manifest_result")
          [[ -f "$mesh_manifest" && ! -L "$mesh_manifest" ]]
          mesh_root=$(GIT_NO_REPLACE_OBJECTS=1 git -C "$(dirname "$mesh_manifest")" rev-parse --show-toplevel)
          checkout_base="${CARGO_HOME:-$HOME/.cargo}/git/checkouts"
          checkout_base_real=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$checkout_base")
          mesh_root_real=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$mesh_root")
          [[ -d "$checkout_base_real" && ! -L "$checkout_base_real" ]]
          case "$mesh_root_real" in
            "$checkout_base_real"/*) ;;
            *) echo "::error::resolved mesh package is outside Cargo git checkouts"; exit 1 ;;
          esac
          [[ -e "$mesh_root/.git" && ! -L "$mesh_root/.git" ]]

          verify_mesh_script() {
            script_path=$1
            [[ -f "$mesh_root/$script_path" && ! -L "$mesh_root/$script_path" && -x "$mesh_root/$script_path" ]]
            tree_entry=$(GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" ls-tree "$EXPECTED_MESH_REV" -- "$script_path")
            tree_mode=$(printf '%s\n' "$tree_entry" | awk '{print $1}')
            tree_type=$(printf '%s\n' "$tree_entry" | awk '{print $2}')
            [[ "$tree_mode" == 100755 && "$tree_type" == blob ]]
            expected_blob=$(GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" rev-parse "$EXPECTED_MESH_REV:$script_path")
            actual_blob=$(GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" hash-object --no-filters "$mesh_root/$script_path")
            [[ "$actual_blob" == "$expected_blob" ]]
          }
          verify_mesh_identity() {
            [[ "$(GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" rev-parse --verify 'HEAD^{commit}')" == "$EXPECTED_MESH_REV" ]]
            GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" cat-file -e "${EXPECTED_MESH_REV}^{commit}"
            GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" diff --no-ext-diff --quiet "$EXPECTED_MESH_REV" --
            GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" diff --cached --no-ext-diff --quiet "$EXPECTED_MESH_REV" --
            unexpected_untracked=$( {
              GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" ls-files --others --exclude-standard
              GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" ls-files --others --ignored --exclude-standard
            } | LC_ALL=C sort -u | grep -v '^\.cargo-ok$' || true )
            [[ -z "$unexpected_untracked" ]]
            if [[ -e "$mesh_root/.cargo-ok" || -L "$mesh_root/.cargo-ok" ]]; then
              [[ -f "$mesh_root/.cargo-ok" && ! -L "$mesh_root/.cargo-ok" ]]
            fi
            verify_mesh_script scripts/prepare-llama.sh
            verify_mesh_script scripts/build-llama.sh
          }
          verify_mesh_identity
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          /bin/bash "$mesh_root/scripts/prepare-llama.sh" pinned
          [[ "$(GIT_NO_REPLACE_OBJECTS=1 git -C "$mesh_root" rev-parse --verify 'HEAD^{commit}')" == "$EXPECTED_MESH_REV" ]]
          verify_mesh_script scripts/prepare-llama.sh
          verify_mesh_script scripts/build-llama.sh
          /bin/bash "$mesh_root/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build unsigned staging binary and unpacked app
        env:
          BASH_ENV: ""
          BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY: ${{ steps.build-contract.outputs.auto_connect_default_relay }}
          BUZZ_BUILD_CHANNEL: ${{ steps.build-contract.outputs.build_channel }}
          BUZZ_BUILD_DEEP_LINK_SCHEME: ${{ steps.build-contract.outputs.deep_link_scheme }}
          BUZZ_RELAY_HTTP: ${{ steps.build-contract.outputs.relay_https }}
          BUZZ_RELAY_URL: ${{ steps.build-contract.outputs.relay_wss }}
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          ENV: ""
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          VITE_BUZZ_BUILD_CHANNEL: ${{ steps.build-contract.outputs.build_channel }}
          VITE_BUZZ_DEEP_LINK_SCHEME: ${{ steps.build-contract.outputs.deep_link_scheme }}
        run: |
          set -euo pipefail
          [[ "$BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY" == true ]]
          [[ "$BUZZ_BUILD_CHANNEL" == "$VITE_BUZZ_BUILD_CHANNEL" ]]
          [[ "$BUZZ_BUILD_CHANNEL" == personal-staging ]]
          [[ "$BUZZ_BUILD_DEEP_LINK_SCHEME" == "$VITE_BUZZ_DEEP_LINK_SCHEME" ]]
          [[ "$VITE_BUZZ_BUILD_CHANNEL" == personal-staging ]]
          cd desktop
          if [[ "$DESKTOP_TARGET" == "aarch64-apple-darwin" ]]; then
            pnpm tauri build --verbose --no-sign --target "$DESKTOP_TARGET" \
              --features mesh-llm --no-bundle \
              --config src-tauri/tauri.personal-staging.conf.json
            pnpm tauri bundle --verbose --no-sign --target "$DESKTOP_TARGET" \
              --features mesh-llm --bundles app \
              --config src-tauri/tauri.personal-staging.conf.json
          elif [[ "$DESKTOP_TARGET" == "x86_64-apple-darwin" ]]; then
            pnpm tauri build --verbose --no-sign --target "$DESKTOP_TARGET" \
              --no-bundle \
              --config src-tauri/tauri.personal-staging.conf.json
            pnpm tauri bundle --verbose --no-sign --target "$DESKTOP_TARGET" \
              --bundles app \
              --config src-tauri/tauri.personal-staging.conf.json
          else
            echo "::error::unsupported desktop target"
            exit 1
          fi

      - name: Snapshot exact unpacked app before DMG creation
        id: unpacked-app
        env:
          BASH_ENV: ""
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          bundle_dir="desktop/src-tauri/target/${DESKTOP_TARGET}/release/bundle/macos"
          app=$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d -print -quit)
          app_count=$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d '[:space:]')
          [[ "$app_count" == 1 && -n "$app" ]]
          # Emit an ABSOLUTE path: the DMG step runs its verification diff after cd desktop,
          # so a repo-root-relative path resolves to desktop/desktop/... and the diff fails.
          app="$(cd "$(dirname "$app")" && pwd)/$(basename "$app")"
          [[ -d "$app" ]]
          snapshot_root=$(/usr/bin/mktemp -d /tmp/personal-desktop-unpacked-app.XXXXXX)
          /usr/bin/ditto "$app" "$snapshot_root/$(basename "$app")"
          {
            echo "app=$app"
            echo "snapshot=$snapshot_root"
          } >> "$GITHUB_OUTPUT"

      - name: Create DMG from the exact snapshotted unpacked app
        env:
          BASH_ENV: ""
          BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY: ${{ steps.build-contract.outputs.auto_connect_default_relay }}
          BUZZ_BUILD_CHANNEL: ${{ steps.build-contract.outputs.build_channel }}
          BUZZ_BUILD_DEEP_LINK_SCHEME: ${{ steps.build-contract.outputs.deep_link_scheme }}
          BUZZ_RELAY_HTTP: ${{ steps.build-contract.outputs.relay_https }}
          BUZZ_RELAY_URL: ${{ steps.build-contract.outputs.relay_wss }}
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          ENV: ""
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          UNPACKED_APP: ${{ steps.unpacked-app.outputs.app }}
          UNPACKED_SNAPSHOT: ${{ steps.unpacked-app.outputs.snapshot }}
          VITE_BUZZ_BUILD_CHANNEL: ${{ steps.build-contract.outputs.build_channel }}
          VITE_BUZZ_DEEP_LINK_SCHEME: ${{ steps.build-contract.outputs.deep_link_scheme }}
        run: |
          set -euo pipefail
          [[ "$BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY" == true ]]
          [[ "$BUZZ_BUILD_CHANNEL" == "$VITE_BUZZ_BUILD_CHANNEL" ]]
          [[ "$BUZZ_BUILD_CHANNEL" == personal-staging ]]
          [[ "$BUZZ_BUILD_DEEP_LINK_SCHEME" == "$VITE_BUZZ_DEEP_LINK_SCHEME" ]]
          [[ "$VITE_BUZZ_BUILD_CHANNEL" == personal-staging ]]
          cd desktop
          if [[ "$DESKTOP_TARGET" == "aarch64-apple-darwin" ]]; then
            pnpm tauri bundle --verbose --no-sign --target "$DESKTOP_TARGET" \
              --features mesh-llm --bundles dmg \
              --config src-tauri/tauri.personal-staging.conf.json
          elif [[ "$DESKTOP_TARGET" == "x86_64-apple-darwin" ]]; then
            pnpm tauri bundle --verbose --no-sign --target "$DESKTOP_TARGET" \
              --bundles dmg \
              --config src-tauri/tauri.personal-staging.conf.json
          else
            echo "::error::unsupported desktop target"
            exit 1
          fi
          # POST-BUILD DMG PARITY CHECK
          # The tauri dmg bundler consumes the unpacked .app, so the live path no longer
          # exists here. Prove the same property against the DMG payload: mount the freshly
          # built image read-only and diff the app it actually contains against the snapshot.
          snapshot_app="$UNPACKED_SNAPSHOT/$(basename "$UNPACKED_APP")"
          [[ -d "$snapshot_app" ]]
          dmg_dir="src-tauri/target/${DESKTOP_TARGET}/release/bundle/dmg"
          dmg=$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' -type f -print -quit)
          dmg_count=$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d '[:space:]')
          [[ "$dmg_count" == 1 && -n "$dmg" ]] || {
            echo "::error::expected exactly one built DMG"
            exit 1
          }
          mount_point=$(/usr/bin/mktemp -d /tmp/personal-desktop-dmg-verify.XXXXXX)
          cleanup_mount() { /usr/bin/hdiutil detach "$mount_point" -quiet >/dev/null 2>&1 || true; }
          trap cleanup_mount EXIT
          /usr/bin/hdiutil attach "$dmg" -readonly -nobrowse -noverify -noautoopen -mountpoint "$mount_point" >/dev/null
          mounted_app=$(find "$mount_point" -maxdepth 1 -name '*.app' -type d -print -quit)
          mounted_count=$(find "$mount_point" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d '[:space:]')
          [[ "$mounted_count" == 1 && -n "$mounted_app" ]] || {
            echo "::error::expected exactly one app bundle inside the built DMG"
            exit 1
          }
          [[ "$(basename "$mounted_app")" == "$(basename "$snapshot_app")" ]] || {
            echo "::error::DMG app bundle name does not match the snapshotted app"
            exit 1
          }
          /usr/bin/diff -qr "$snapshot_app" "$mounted_app" || {
            echo "::error::DMG payload differs from the snapshotted unpacked app"
            exit 1
          }
          cleanup_mount
          trap - EXIT

      - name: Verify package and exact sidecar parity
        id: artifacts
        env:
          BASH_ENV: ""
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          ENV: ""
          BUZZ_BUILD_CHANNEL: ${{ steps.build-contract.outputs.build_channel }}
          EXPECTED_BANNER_ARTIFACT: BUZZ_PERSONAL_STAGING_BANNER_RENDERED_V1
          EXPECTED_BUNDLE_ID: ${{ steps.build-contract.outputs.bundle_id }}
          EXPECTED_PRODUCT_NAME: ${{ steps.build-contract.outputs.product_name }}
          EXPECTED_URI_SCHEME: ${{ steps.build-contract.outputs.deep_link_scheme }}
          FORBIDDEN_BANNER_ARTIFACT: BUZZ_PERSONAL_STAGING_BANNER_ABSENT_V1
          HOSTED_HTTPS: ${{ steps.deployment.outputs.hosted_https }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          PERSONAL_PRODUCTION_HTTPS: ${{ steps.deployment.outputs.personal_production_https }}
          RELAY_HTTPS: ${{ steps.build-contract.outputs.relay_https }}
          RELAY_WSS: ${{ steps.build-contract.outputs.relay_wss }}
        run: |
          set -euo pipefail
          bundle_dir="desktop/src-tauri/target/${DESKTOP_TARGET}/release/bundle"
          dmg=$(find "$bundle_dir/dmg" -name '*.dmg' -type f -print -quit)
          app=$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -type d -print -quit)
          dmg_count=$(find "$bundle_dir/dmg" -name '*.dmg' -type f | wc -l | tr -d '[:space:]')
          app_count=$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d '[:space:]')
          [[ "$dmg_count" -eq 1 && "$app_count" -eq 1 ]] || {
            echo "::error::expected exactly one DMG and one app bundle"
            exit 1
          }
          info_plist="$app/Contents/Info.plist"
          test -f "$info_plist"
          plist_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")
          plist_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$info_plist")
          plist_display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info_plist")
          plist_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")
          [[ "$plist_bundle_id" == "$EXPECTED_BUNDLE_ID" ]]
          [[ "$plist_name" == "$EXPECTED_PRODUCT_NAME" ]]
          [[ "$plist_display_name" == "$EXPECTED_PRODUCT_NAME" ]]
          python3 - "$info_plist" "$EXPECTED_URI_SCHEME" <<'PY'
          import plistlib
          import sys

          info_plist, expected_scheme = sys.argv[1:]
          if expected_scheme.casefold() == "buzz":
              raise SystemExit("staging URI scheme must not be buzz")
          with open(info_plist, "rb") as plist_file:
              plist = plistlib.load(plist_file)
          schemes = [
              scheme
              for url_type in plist.get("CFBundleURLTypes", [])
              for scheme in url_type.get("CFBundleURLSchemes", [])
          ]
          if any(scheme.casefold() == "buzz" for scheme in schemes):
              raise SystemExit("staging app registers the hosted buzz URI scheme")
          if schemes != [expected_scheme]:
              raise SystemExit(
                  f"staging URI schemes must be exactly [{expected_scheme!r}], got {schemes!r}"
              )
          PY
          [[ "$plist_executable" =~ ^[A-Za-z0-9._-]+$ ]]
          main_executable="$app/Contents/MacOS/$plist_executable"
          [[ -f "$main_executable" && -x "$main_executable" && ! -L "$main_executable" ]]
          # Banner evidence lives in the compiled frontend, which tauri embeds in a
          # compressed form: the markers are not plaintext anywhere inside the .app,
          # so grepping the executable can never pass and its companion negative check
          # passes vacuously. Verify the surface the markers actually exist on, using
          # the repository's purpose-built verifier over the exact frontend build output
          # that this same job embedded into the app.
          frontend_dist="desktop/dist"
          [[ -d "$frontend_dist" && ! -L "$frontend_dist" ]] || {
            echo "::error::frontend build output is missing for banner verification"
            exit 1
          }
          VITE_BUZZ_BUILD_CHANNEL="$BUZZ_BUILD_CHANNEL" \
            node desktop/scripts/verify-personal-staging-banner-build.mjs "$frontend_dist" || {
            echo "::error::staging frontend does not satisfy the banner build contract"
            exit 1
          }
          /usr/bin/grep -rlaF -- "$EXPECTED_BANNER_ARTIFACT" "$frontend_dist" >/dev/null || {
            echo "::error::staging frontend does not contain the rendered banner evidence"
            exit 1
          }
          if /usr/bin/grep -rlaF -- "$FORBIDDEN_BANNER_ARTIFACT" "$frontend_dist" >/dev/null 2>&1; then
            echo "::error::staging frontend contains the production banner-absent evidence"
            exit 1
          fi
          case "$DESKTOP_TARGET" in
            aarch64-apple-darwin) expected_arch=arm64 ;;
            x86_64-apple-darwin) expected_arch=x86_64 ;;
            *) echo "::error::unsupported desktop target for architecture verification"; exit 1 ;;
          esac
          [[ "$(/usr/bin/lipo -archs "$main_executable")" == "$expected_arch" ]] || {
            echo "::error::desktop executable architecture does not match the requested target"
            exit 1
          }
          /usr/bin/grep -aFq -- "$RELAY_WSS" "$main_executable"
          /usr/bin/grep -aFq -- "$RELAY_HTTPS" "$main_executable"
          for forbidden in \
            "$HOSTED_HTTPS" "${HOSTED_HTTPS/https:/wss:}" \
            "$PERSONAL_PRODUCTION_HTTPS" "${PERSONAL_PRODUCTION_HTTPS/https:/wss:}"; do
            if /usr/bin/grep -aFq -- "$forbidden" "$main_executable"; then
              echo "::error::desktop executable contains a forbidden relay origin"
              exit 1
            fi
          done
          sidecar_names=(
            buzz-acp
            buzz-agent
            buzz-backend-kubernetes
            buzz-dev-mcp
            git-credential-nostr
            buzz
          )
          sidecar_entries=/tmp/personal-desktop-sidecar-entries.ndjson
          /usr/bin/install -m 0600 /dev/null "$sidecar_entries"
          source_acp=""
          source_acp_sha=""
          for sidecar_name in "${sidecar_names[@]}"; do
            source_sidecar="desktop/src-tauri/binaries/${sidecar_name}-${DESKTOP_TARGET}"
            embedded_sidecar="$app/Contents/MacOS/$sidecar_name"
            [[ -f "$source_sidecar" && ! -L "$source_sidecar" && -x "$source_sidecar" ]]
            [[ -f "$embedded_sidecar" && ! -L "$embedded_sidecar" && -x "$embedded_sidecar" ]]
            [[ "$(/usr/bin/lipo -archs "$source_sidecar")" == "$expected_arch" ]] || {
              echo "::error::source sidecar architecture mismatch: $sidecar_name"
              exit 1
            }
            [[ "$(/usr/bin/lipo -archs "$embedded_sidecar")" == "$expected_arch" ]] || {
              echo "::error::embedded sidecar architecture mismatch: $sidecar_name"
              exit 1
            }
            source_sha=$(shasum -a 256 "$source_sidecar" | awk '{print $1}')
            embedded_sha=$(shasum -a 256 "$embedded_sidecar" | awk '{print $1}')
            [[ "$source_sha" == "$embedded_sha" ]] || {
              echo "::error::embedded sidecar does not match source build: $sidecar_name"
              exit 1
            }
            jq -cnS \
              --arg name "$sidecar_name" \
              --arg candidate_name "${sidecar_name}-${DESKTOP_TARGET}" \
              --arg source_sha256 "$source_sha" \
              --arg embedded_relative_path "Contents/MacOS/$sidecar_name" \
              --arg embedded_sha256 "$embedded_sha" \
              --arg architecture "$expected_arch" '
                {
                  name: $name,
                  candidate_name: $candidate_name,
                  source_sha256: $source_sha256,
                  embedded_relative_path: $embedded_relative_path,
                  embedded_sha256: $embedded_sha256,
                  architecture: $architecture,
                  executable: true
                }
              ' >> "$sidecar_entries"
            if [[ "$sidecar_name" == "buzz-acp" ]]; then
              source_acp=$source_sidecar
              source_acp_sha=$source_sha
            fi
          done
          [[ -n "$source_acp" && "$source_acp_sha" =~ ^[0-9a-f]{64}$ ]]
          jq -sS \
            --arg target "$DESKTOP_TARGET" \
            --arg architecture "$expected_arch" '
              {
                schema: "personal-desktop-sidecars/v1",
                target: $target,
                architecture: $architecture,
                entries: sort_by(.name)
              }
            ' "$sidecar_entries" > personal-desktop-sidecars.json
          jq -e \
            --arg target "$DESKTOP_TARGET" \
            --arg architecture "$expected_arch" '
              keys == ["architecture", "entries", "schema", "target"]
              and .schema == "personal-desktop-sidecars/v1"
              and .target == $target
              and .architecture == $architecture
              and ([.entries[].name] == [
                "buzz", "buzz-acp", "buzz-agent", "buzz-backend-kubernetes",
                "buzz-dev-mcp", "git-credential-nostr"
              ])
              and (.entries | length) == 6
              and all(.entries[];
                (keys | sort) == [
                  "architecture", "candidate_name", "embedded_relative_path",
                  "embedded_sha256", "executable", "name", "source_sha256"
                ]
                and .candidate_name == (.name + "-" + $target)
                and .embedded_relative_path == ("Contents/MacOS/" + .name)
                and .architecture == $architecture
                and .executable == true
                and .source_sha256 == .embedded_sha256
                and (.source_sha256 | test("^[0-9a-f]{64}$"))
              )
            ' personal-desktop-sidecars.json >/dev/null
          sidecar_manifest_sha=$(shasum -a 256 personal-desktop-sidecars.json | awk '{print $1}')
          dmg_sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          {
            printf '%s  %s\n' "$dmg_sha" "$(basename "$dmg")"
            jq -r '.entries[] | "\(.source_sha256)  \(.candidate_name)"' \
              personal-desktop-sidecars.json
          } > personal-desktop-checksums.txt
          {
            echo "acp=$source_acp"
            echo "acp_sha=$source_acp_sha"
            echo "dmg=$dmg"
            echo "dmg_sha=$dmg_sha"
            echo "sidecar_manifest=$GITHUB_WORKSPACE/personal-desktop-sidecars.json"
            echo "sidecar_manifest_sha=$sidecar_manifest_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Write non-secret staging ledger
        env:
          ACP_SHA: ${{ steps.artifacts.outputs.acp_sha }}
          APPROVED_SOURCE_SHA: ${{ steps.build-contract.outputs.source_sha }}
          AUTHORIZATION_ARTIFACT_DIGEST: ${{ steps.authorization-artifact.outputs.digest }}
          AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ steps.authorization-artifact.outputs.expires_at }}
          AUTHORIZATION_ARTIFACT_ID: ${{ steps.authorization-artifact.outputs.id }}
          AUTHORIZATION_ARTIFACT_NAME: ${{ steps.authorization-name.outputs.name }}
          BASH_ENV: ""
          BUILD_CONTRACT_SHA: ${{ steps.build-contract.outputs.sha256 }}
          BUNDLE_ID: ${{ steps.build-contract.outputs.bundle_id }}
          DESKTOP_MAIN_BRANCH_SHA: ${{ steps.controls.outputs.main_branch_sha256 }}
          DESKTOP_MAIN_RULES_SHA: ${{ steps.controls.outputs.main_rules_sha256 }}
          DESKTOP_MAIN_RULESETS_SHA: ${{ steps.controls.outputs.main_rulesets_sha256 }}
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          DESKTOP_VERSION: ${{ steps.build-contract.outputs.version }}
          DMG_SHA: ${{ steps.artifacts.outputs.dmg_sha }}
          ENV: ""
          GATE1_ARTIFACT_DIGEST: ${{ steps.deployment.outputs.gate1_artifact_digest }}
          GATE1_ARTIFACT_EXPIRES_AT: ${{ steps.deployment.outputs.gate1_artifact_expires_at }}
          GATE1_ARTIFACT_ID: ${{ steps.deployment.outputs.gate1_artifact_id }}
          GATE1_ARTIFACT_NAME: ${{ steps.deployment.outputs.gate1_artifact_name }}
          GATE1_ATTESTATION_BUNDLE_SHA: ${{ steps.deployment.outputs.gate1_bundle_sha }}
          GATE1_ELIGIBILITY_EXPIRES_AT: ${{ steps.gate1.outputs.eligibility_expires_at }}
          GATE1_EVIDENCE_RUN_ID: ${{ steps.deployment.outputs.gate1_run_id }}
          GATE1_RECEIPT_SHA: ${{ steps.deployment.outputs.gate1_receipt_sha }}
          GATE1_RELEASE_EVIDENCE_EXPIRES_AT: ${{ steps.gate1.outputs.release_evidence_expires_at }}
          GATE1_RUN_ATTEMPT: ${{ steps.deployment.outputs.gate1_run_attempt }}
          GATE1_MAIN_BRANCH_SHA: ${{ steps.gate1.outputs.main_branch_sha256 }}
          GATE1_MAIN_RULES_SHA: ${{ steps.gate1.outputs.main_rules_sha256 }}
          GATE1_MAIN_RULESETS_SHA: ${{ steps.gate1.outputs.main_rulesets_sha256 }}
          GATE1_WORKFLOW_SHA: ${{ steps.deployment.outputs.gate1_workflow_sha }}
          RELAY_DIGEST: ${{ steps.gate1.outputs.digest }}
          RELAY_IMAGE: ${{ steps.gate1.outputs.image }}
          RELAY_IMAGE_REF: ${{ steps.gate1.outputs.image_ref }}
          RELAY_HTTPS: ${{ steps.build-contract.outputs.relay_https }}
          RELAY_PUBKEY: ${{ steps.deployment.outputs.relay_pubkey }}
          RELAY_WSS: ${{ steps.build-contract.outputs.relay_wss }}
          SIDECAR_MANIFEST_PATH: ${{ steps.artifacts.outputs.sidecar_manifest }}
          SIDECAR_MANIFEST_SHA: ${{ steps.artifacts.outputs.sidecar_manifest_sha }}
          SMOKE_APPROVAL_RECORD_SHA: ${{ steps.deployment.outputs.smoke_record_sha }}
          STAGING_DEPLOYMENT_EVIDENCE_REFERENCE: ${{ steps.deployment.outputs.evidence_reference }}
          STAGING_DEPLOYMENT_RECEIPT_SHA: ${{ steps.deployment.outputs.receipt_sha }}
          STAGING_AUTHORIZED_BY: ${{ steps.deployment.outputs.authorized_by }}
          STAGING_BRANCH_POLICIES_SHA: ${{ steps.controls.outputs.branch_policies_sha256 }}
          STAGING_BUILD_CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_ENVIRONMENT_SHA: ${{ steps.controls.outputs.environment_sha256 }}
          STAGING_RUN_IDENTITY_SHA: ${{ steps.controls.outputs.run_identity_sha256 }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          PRODUCT_NAME: ${{ steps.build-contract.outputs.product_name }}
        run: |
          set -euo pipefail
          now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          for deadline in \
            "$AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            "$GATE1_ARTIFACT_EXPIRES_AT" \
            "$GATE1_ELIGIBILITY_EXPIRES_AT" \
            "$GATE1_RELEASE_EVIDENCE_EXPIRES_AT"; do
            jq -ner --arg deadline "$deadline" --arg now "$now" \
              '($deadline | fromdateiso8601) > ($now | fromdateiso8601)' >/dev/null || {
              echo "::error::Gate 1 eligibility or retained evidence expired during the desktop build"
              exit 1
            }
          done
          gate1_receipt=/tmp/personal-relay-gate1-evidence/personal-relay-gate1-receipt.json
          [[ "$(jq -r .eligibility_expires_at "$gate1_receipt")" == "$GATE1_ELIGIBILITY_EXPIRES_AT" ]]
          [[ "$(jq -r .release_evidence.expires_at "$gate1_receipt")" == "$GATE1_RELEASE_EVIDENCE_EXPIRES_AT" ]]
          [[ "$(shasum -a 256 /tmp/personal-desktop-build-contract.json | awk '{print $1}')" == "$BUILD_CONTRACT_SHA" ]]
          [[ -s "$SIDECAR_MANIFEST_PATH" && ! -L "$SIDECAR_MANIFEST_PATH" ]]
          [[ "$(shasum -a 256 "$SIDECAR_MANIFEST_PATH" | awk '{print $1}')" == "$SIDECAR_MANIFEST_SHA" ]]
          jq -n \
            --slurpfile sidecars "$SIDECAR_MANIFEST_PATH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$APPROVED_SOURCE_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_SHA" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg version "$DESKTOP_VERSION" \
            --arg target "$DESKTOP_TARGET" \
            --arg dispatch_confirmation "$STAGING_BUILD_CONFIRMATION" \
            --argjson authorization_artifact_id "$AUTHORIZATION_ARTIFACT_ID" \
            --arg authorization_artifact_name "$AUTHORIZATION_ARTIFACT_NAME" \
            --arg authorization_artifact_digest "$AUTHORIZATION_ARTIFACT_DIGEST" \
            --arg authorization_artifact_expires_at "$AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --arg relay_wss "$RELAY_WSS" \
            --arg relay_https "$RELAY_HTTPS" \
            --arg build_contract_sha256 "$BUILD_CONTRACT_SHA" \
            --arg bundle_id "$BUNDLE_ID" \
            --arg product_name "$PRODUCT_NAME" \
            --argjson gate1_evidence_run_id "$GATE1_EVIDENCE_RUN_ID" \
            --argjson gate1_evidence_run_attempt "$GATE1_RUN_ATTEMPT" \
            --arg gate1_workflow_sha "$GATE1_WORKFLOW_SHA" \
            --argjson gate1_artifact_id "$GATE1_ARTIFACT_ID" \
            --arg gate1_artifact_name "$GATE1_ARTIFACT_NAME" \
            --arg gate1_artifact_digest "$GATE1_ARTIFACT_DIGEST" \
            --arg gate1_artifact_expires_at "$GATE1_ARTIFACT_EXPIRES_AT" \
            --arg gate1_receipt_sha256 "$GATE1_RECEIPT_SHA" \
            --arg gate1_attestation_bundle_sha256 "$GATE1_ATTESTATION_BUNDLE_SHA" \
            --arg gate1_eligibility_expires_at "$GATE1_ELIGIBILITY_EXPIRES_AT" \
            --arg gate1_release_evidence_expires_at "$GATE1_RELEASE_EVIDENCE_EXPIRES_AT" \
            --arg gate1_main_branch_sha256 "$GATE1_MAIN_BRANCH_SHA" \
            --arg gate1_main_rules_sha256 "$GATE1_MAIN_RULES_SHA" \
            --arg gate1_main_rulesets_sha256 "$GATE1_MAIN_RULESETS_SHA" \
            --arg relay_image "$RELAY_IMAGE" \
            --arg relay_digest "$RELAY_DIGEST" \
            --arg relay_image_ref "$RELAY_IMAGE_REF" \
            --arg relay_pubkey "$RELAY_PUBKEY" \
            --arg staging_deployment_receipt_sha256 "$STAGING_DEPLOYMENT_RECEIPT_SHA" \
            --arg staging_deployment_evidence_reference "$STAGING_DEPLOYMENT_EVIDENCE_REFERENCE" \
            --arg smoke_approval_record_sha256 "$SMOKE_APPROVAL_RECORD_SHA" \
            --arg staging_environment_sha256 "$STAGING_ENVIRONMENT_SHA" \
            --arg staging_branch_policies_sha256 "$STAGING_BRANCH_POLICIES_SHA" \
            --arg staging_run_identity_sha256 "$STAGING_RUN_IDENTITY_SHA" \
            --argjson staging_authorized_owner "$STAGING_AUTHORIZED_BY" \
            --arg desktop_main_branch_sha256 "$DESKTOP_MAIN_BRANCH_SHA" \
            --arg desktop_main_rules_sha256 "$DESKTOP_MAIN_RULES_SHA" \
            --arg desktop_main_rulesets_sha256 "$DESKTOP_MAIN_RULESETS_SHA" \
            --arg dmg_sha "$DMG_SHA" \
            --arg acp_sha "$ACP_SHA" \
            --arg sidecar_manifest_sha "$SIDECAR_MANIFEST_SHA" \
            --arg workflow_run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schema: "personal-desktop-staging/v2",
              repository: $repository,
              source_sha: $source_sha,
              workflow_ref: $workflow_ref,
              workflow_sha: $workflow_sha,
              workflow_run: $workflow_run,
              workflow_run_attempt: $workflow_run_attempt,
              main_protection: {
                branch: "main",
                commit_sha: $workflow_sha,
                ref_protected: true,
                branch_metadata_sha256: $desktop_main_branch_sha256,
                effective_rules_sha256: $desktop_main_rules_sha256,
                rulesets_sha256: $desktop_main_rulesets_sha256
              },
              version: $version,
              channel: "staging-only",
              target: $target,
              dispatch_confirmation: $dispatch_confirmation,
              build_contract_sha256: $build_contract_sha256,
              bundle_id: $bundle_id,
              product_name: $product_name,
              authorization_artifact: {
                id: $authorization_artifact_id,
                name: $authorization_artifact_name,
                digest: $authorization_artifact_digest,
                expires_at: $authorization_artifact_expires_at
              },
              relay_wss: $relay_wss,
              relay_https: $relay_https,
              gate1_evidence_run_id: $gate1_evidence_run_id,
              gate1_evidence_run_attempt: $gate1_evidence_run_attempt,
              gate1_workflow_sha: $gate1_workflow_sha,
              gate1_artifact: {id: $gate1_artifact_id, name: $gate1_artifact_name, digest: $gate1_artifact_digest, expires_at: $gate1_artifact_expires_at},
              gate1_receipt_sha256: $gate1_receipt_sha256,
              gate1_attestation_bundle_sha256: $gate1_attestation_bundle_sha256,
              gate1_eligibility_expires_at: $gate1_eligibility_expires_at,
              gate1_release_evidence_expires_at: $gate1_release_evidence_expires_at,
              gate1_main_protection: {
                branch: "main",
                commit_sha: $gate1_workflow_sha,
                ref_protected: true,
                branch_metadata_sha256: $gate1_main_branch_sha256,
                effective_rules_sha256: $gate1_main_rules_sha256,
                rulesets_sha256: $gate1_main_rulesets_sha256
              },
              relay_image: $relay_image,
              relay_digest: $relay_digest,
              relay_image_ref: $relay_image_ref,
              relay_pubkey: $relay_pubkey,
              staging_deployment_receipt_sha256: $staging_deployment_receipt_sha256,
              staging_deployment_evidence_reference: $staging_deployment_evidence_reference,
              smoke_approval_record_sha256: $smoke_approval_record_sha256,
              staging_controls: {
                environment: "personal-staging",
                environment_configuration_sha256: $staging_environment_sha256,
                deployment_branch_policies_sha256: $staging_branch_policies_sha256,
                run_identity_sha256: $staging_run_identity_sha256,
                deployment_branch: "main",
                authorized_owner: $staging_authorized_owner
              },
              dmg_sha256: $dmg_sha,
              buzz_acp_sha256: $acp_sha,
              sidecar_manifest_sha256: $sidecar_manifest_sha,
              sidecars: $sidecars[0],
              unsigned: true,
              updater_enabled: false,
              production_eligible: false,
              installed: false,
              actions_evidence_artifacts_published: true,
              registry_package_published: false,
              updater_feed_published: false
            }' \
            > personal-desktop-staging.json
          jq -e \
            --arg acp_sha "$ACP_SHA" \
            --arg manifest_sha "$SIDECAR_MANIFEST_SHA" \
            --slurpfile sidecars "$SIDECAR_MANIFEST_PATH" '
              .schema == "personal-desktop-staging/v2"
              and .sidecar_manifest_sha256 == $manifest_sha
              and .sidecars == $sidecars[0]
              and .buzz_acp_sha256 == $acp_sha
              and ([.sidecars.entries[] | select(.name == "buzz-acp") | .source_sha256]
                == [$acp_sha])
            ' personal-desktop-staging.json >/dev/null

      - name: Resolve staging artifact name
        id: artifact-name
        env:
          BASH_ENV: ""
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          ENV: ""
          EXPECTED_SOURCE_SHA: ${{ steps.build-contract.outputs.source_sha }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: echo "name=personal-desktop-staging-${DESKTOP_TARGET}-${EXPECTED_SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Stage unsigned package and exact evidence
        id: staged-candidate
        env:
          ACP_PATH: ${{ steps.artifacts.outputs.acp }}
          BASH_ENV: ""
          DESKTOP_TARGET: ${{ steps.build-contract.outputs.target }}
          DMG_PATH: ${{ steps.artifacts.outputs.dmg }}
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          stage=$(/usr/bin/mktemp -d /tmp/personal-desktop-staging-evidence.XXXXXX)
          /bin/cp "$DMG_PATH" "$stage/"
          sidecar_names=(
            buzz-acp
            buzz-agent
            buzz-backend-kubernetes
            buzz-dev-mcp
            git-credential-nostr
            buzz
          )
          for sidecar_name in "${sidecar_names[@]}"; do
            sidecar="desktop/src-tauri/binaries/${sidecar_name}-${DESKTOP_TARGET}"
            [[ -f "$sidecar" && ! -L "$sidecar" && -x "$sidecar" ]]
            /bin/cp "$sidecar" "$stage/"
          done
          [[ "$ACP_PATH" == "desktop/src-tauri/binaries/buzz-acp-${DESKTOP_TARGET}" ]]
          /bin/cp personal-desktop-checksums.txt personal-desktop-sidecars.json \
            personal-desktop-staging.json "$stage/"
          [[ "$(/usr/bin/find "$stage" -mindepth 1 -maxdepth 1 -type f | /usr/bin/wc -l | /usr/bin/tr -d '[:space:]')" == 10 ]]
          [[ -z "$(/usr/bin/find "$stage" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          echo "path=$stage" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned staging package and evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ steps.staged-candidate.outputs.path }}/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Bind uploaded artifact identity and expiration
        id: uploaded-artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.name }}
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          case "$UPLOAD_DIGEST" in
            sha256:*) artifact_digest=$UPLOAD_DIGEST ;;
            *) artifact_digest="sha256:$UPLOAD_DIGEST" ;;
          esac
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > /tmp/personal-desktop-staging-artifact.json
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg digest "$artifact_digest" \
            --arg name "$ARTIFACT_NAME" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $run_id
              and (.expires_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' /tmp/personal-desktop-staging-artifact.json >/dev/null
          {
            echo "digest=$artifact_digest"
            echo "expires_at=$(jq -r .expires_at /tmp/personal-desktop-staging-artifact.json)"
            echo "id=$ARTIFACT_ID"
          } >> "$GITHUB_OUTPUT"

  inspect:
    name: Inspect unsigned staging candidate (${{ inputs.target }})
    if: github.repository == 'justinharkelroad/buzz'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      artifact_digest: ${{ steps.uploaded-inspection.outputs.digest }}
      artifact_expires_at: ${{ steps.uploaded-inspection.outputs.expires_at }}
      artifact_id: ${{ steps.uploaded-inspection.outputs.id }}
      artifact_name: ${{ steps.inspection-artifact-name.outputs.name }}
      inventory_sha256: ${{ steps.inspection-receipt.outputs.inventory_sha256 }}
      receipt_sha256: ${{ steps.inspection-receipt.outputs.receipt_sha256 }}
      staging_scan_sha256: ${{ steps.inspection-receipt.outputs.staging_scan_sha256 }}
      volume_scan_sha256: ${{ steps.inspection-receipt.outputs.volume_scan_sha256 }}
      volume_artifact_digest: ${{ steps.uploaded-volume.outputs.digest }}
      volume_artifact_expires_at: ${{ steps.uploaded-volume.outputs.expires_at }}
      volume_artifact_id: ${{ steps.uploaded-volume.outputs.id }}
      volume_artifact_name: ${{ steps.volume-artifact-name.outputs.name }}
      volume_attach_layout_sha256: ${{ steps.volume-record.outputs.attach_layout_sha256 }}
      volume_projection_manifest_sha256: ${{ steps.volume-record.outputs.projection_manifest_sha256 }}
      volume_record_sha256: ${{ steps.volume-record.outputs.record_sha256 }}
      volume_sidecar_manifest_sha256: ${{ steps.volume-record.outputs.sidecar_manifest_sha256 }}
    steps:
      - name: Checkout protected inspection verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact sealed desktop artifacts for inspection
        working-directory: verifier
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.build.outputs.authorization_artifact_digest }}
          AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.authorization_artifact_expires_at }}
          AUTHORIZATION_ARTIFACT_ID: ${{ needs.build.outputs.authorization_artifact_id }}
          AUTHORIZATION_ARTIFACT_NAME: ${{ needs.build.outputs.authorization_artifact_name }}
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == "refs/heads/main" && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_WORKFLOW_REF" == "justinharkelroad/buzz/.github/workflows/personal-desktop-release.yml@refs/heads/main" ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]]
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$ARTIFACT_NAME" \
            --digest "$ARTIFACT_DIGEST" \
            --expires-at "$ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-inspect-staging \
            --metadata-output /tmp/personal-desktop-inspect-staging-artifact.json \
            --archive-output /tmp/personal-desktop-inspect-staging.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$AUTHORIZATION_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$AUTHORIZATION_ARTIFACT_NAME" \
            --digest "$AUTHORIZATION_ARTIFACT_DIGEST" \
            --expires-at "$AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-inspect-authorization \
            --metadata-output /tmp/personal-desktop-inspect-authorization-artifact.json \
            --archive-output /tmp/personal-desktop-inspect-authorization.zip

      - name: Resolve immutable desktop inspection inputs
        id: inspection-inputs
        working-directory: verifier
        env:
          BASH_ENV: ""
          ENV: ""
          EXPECTED_AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.build.outputs.authorization_artifact_digest }}
          EXPECTED_AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.authorization_artifact_expires_at }}
          EXPECTED_AUTHORIZATION_ARTIFACT_ID: ${{ needs.build.outputs.authorization_artifact_id }}
          EXPECTED_AUTHORIZATION_ARTIFACT_NAME: ${{ needs.build.outputs.authorization_artifact_name }}
          EXPECTED_BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          EXPECTED_RELAY_HTTPS: ${{ needs.build.outputs.relay_https }}
          EXPECTED_RELAY_WSS: ${{ needs.build.outputs.relay_wss }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          stage=/tmp/personal-desktop-inspect-staging
          authorization=/tmp/personal-desktop-inspect-authorization
          [[ "$(find "$stage" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 10 ]]
          [[ -z "$(find "$stage" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          [[ "$(find "$authorization" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 16 ]]
          [[ -z "$(find "$authorization" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]

          ledger="$stage/personal-desktop-staging.json"
          checksums="$stage/personal-desktop-checksums.txt"
          sidecar_manifest="$stage/personal-desktop-sidecars.json"
          acp="$stage/buzz-acp-${EXPECTED_TARGET}"
          dmg_count=$(find "$stage" -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d '[:space:]')
          dmg=$(find "$stage" -maxdepth 1 -name '*.dmg' -type f -print -quit)
          [[ "$dmg_count" == 1 && -n "$dmg" ]]
          case "$EXPECTED_TARGET" in
            aarch64-apple-darwin) dmg_arch=aarch64 ;;
            x86_64-apple-darwin) dmg_arch=x64 ;;
            *) echo "::error::unsupported desktop target"; exit 1 ;;
          esac
          expected_dmg_name="${EXPECTED_PRODUCT_NAME}_${EXPECTED_VERSION}_${dmg_arch}.dmg"
          [[ "$(basename "$dmg")" == "$expected_dmg_name" ]]
          for input in "$ledger" "$sidecar_manifest" "$authorization/personal-staging-deployment-receipt.json"; do
            [[ -s "$input" && ! -L "$input" ]]
            jq -e -s 'length == 1' "$input" >/dev/null
          done
          [[ -s "$checksums" && ! -L "$checksums" ]]
          [[ -s "$acp" && ! -L "$acp" ]]

          dmg_sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          ledger_sha=$(shasum -a 256 "$ledger" | awk '{print $1}')
          sidecar_manifest_sha=$(shasum -a 256 "$sidecar_manifest" | awk '{print $1}')
          acp_sha=$(shasum -a 256 "$acp" | awk '{print $1}')
          case "$EXPECTED_TARGET" in
            aarch64-apple-darwin) expected_arch=arm64 ;;
            x86_64-apple-darwin) expected_arch=x86_64 ;;
          esac
          jq -e \
            --arg target "$EXPECTED_TARGET" \
            --arg architecture "$expected_arch" '
              keys == ["architecture", "entries", "schema", "target"]
              and .schema == "personal-desktop-sidecars/v1"
              and .target == $target
              and .architecture == $architecture
              and ([.entries[].name] == [
                "buzz", "buzz-acp", "buzz-agent", "buzz-backend-kubernetes",
                "buzz-dev-mcp", "git-credential-nostr"
              ])
              and (.entries | length) == 6
              and all(.entries[];
                .candidate_name == (.name + "-" + $target)
                and .embedded_relative_path == ("Contents/MacOS/" + .name)
                and .architecture == $architecture
                and .executable == true
                and .source_sha256 == .embedded_sha256
                and (.source_sha256 | test("^[0-9a-f]{64}$"))
              )
            ' "$sidecar_manifest" >/dev/null
          while IFS=$'\t' read -r candidate_name expected_sha; do
            candidate_sidecar="$stage/$candidate_name"
            [[ -s "$candidate_sidecar" && ! -L "$candidate_sidecar" ]]
            [[ "$(shasum -a 256 "$candidate_sidecar" | awk '{print $1}')" == "$expected_sha" ]]
            [[ "$(/usr/bin/lipo -archs "$candidate_sidecar")" == "$expected_arch" ]]
          done < <(jq -r '.entries[] | [.candidate_name, .source_sha256] | @tsv' "$sidecar_manifest")
          expected_checksums=/tmp/personal-desktop-expected-checksums.txt
          {
            printf '%s  %s\n' "$dmg_sha" "$(basename "$dmg")"
            jq -r '.entries[] | "\(.source_sha256)  \(.candidate_name)"' "$sidecar_manifest"
          } > "$expected_checksums"
          cmp -s "$checksums" "$expected_checksums"

          jq -e \
            --slurpfile sidecars "$sidecar_manifest" \
            --argjson authorization_artifact_id "$EXPECTED_AUTHORIZATION_ARTIFACT_ID" \
            --arg authorization_artifact_name "$EXPECTED_AUTHORIZATION_ARTIFACT_NAME" \
            --arg authorization_artifact_digest "$EXPECTED_AUTHORIZATION_ARTIFACT_DIGEST" \
            --arg authorization_artifact_expires_at "$EXPECTED_AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --arg bundle_id "$EXPECTED_BUNDLE_ID" \
            --arg dmg_sha "$dmg_sha" \
            --arg acp_sha "$acp_sha" \
            --arg sidecar_manifest_sha "$sidecar_manifest_sha" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg relay_https "$EXPECTED_RELAY_HTTPS" \
            --arg relay_wss "$EXPECTED_RELAY_WSS" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg target "$EXPECTED_TARGET" \
            --arg version "$EXPECTED_VERSION" '
              .schema == "personal-desktop-staging/v2"
              and .repository == "justinharkelroad/buzz"
              and .workflow_sha == env.GITHUB_SHA
              and .workflow_ref == env.GITHUB_WORKFLOW_REF
              and .workflow_run_attempt == 1
              and .source_sha == $source_sha
              and .target == $target
              and .version == $version
              and .bundle_id == $bundle_id
              and .product_name == $product_name
              and .relay_https == $relay_https
              and .relay_wss == $relay_wss
              and .dmg_sha256 == $dmg_sha
              and .buzz_acp_sha256 == $acp_sha
              and .sidecar_manifest_sha256 == $sidecar_manifest_sha
              and .sidecars == $sidecars[0]
              and .authorization_artifact == {
                id: $authorization_artifact_id,
                name: $authorization_artifact_name,
                digest: $authorization_artifact_digest,
                expires_at: $authorization_artifact_expires_at
              }
              and .unsigned == true
              and .updater_enabled == false
              and .production_eligible == false
              and .installed == false
            ' "$ledger" >/dev/null
          {
            echo "acp=$acp"
            echo "acp_sha256=$acp_sha"
            echo "dmg=$dmg"
            echo "dmg_name=$(basename "$dmg")"
            echo "dmg_sha256=$dmg_sha"
            echo "ledger=$ledger"
            echo "ledger_sha256=$ledger_sha"
            echo "sidecar_manifest=$sidecar_manifest"
            echo "sidecar_manifest_sha256=$sidecar_manifest_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Mount read-only DMG and project every volume file
        id: mounted-volume
        working-directory: verifier
        env:
          BASH_ENV: ""
          DMG_PATH: ${{ steps.inspection-inputs.outputs.dmg }}
          ENV: ""
          EXPECTED_BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          EXPECTED_RELAY_HTTPS: ${{ needs.build.outputs.relay_https }}
          EXPECTED_RELAY_WSS: ${{ needs.build.outputs.relay_wss }}
          EXPECTED_TARGET: ${{ needs.build.outputs.target }}
          EXPECTED_URI_SCHEME: ${{ needs.build.outputs.deep_link_scheme }}
          LEDGER_PATH: ${{ steps.inspection-inputs.outputs.ledger }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          STAGED_SIDECAR_DIR: /tmp/personal-desktop-inspect-staging
          STAGED_SIDECAR_MANIFEST: ${{ steps.inspection-inputs.outputs.sidecar_manifest }}
        run: |
          set -euo pipefail
          [[ "$(jq -r .schema "$LEDGER_PATH")" == "personal-desktop-staging/v2" ]]
          mount_root=$(/usr/bin/mktemp -d /tmp/personal-desktop-inspection-mount.XXXXXX)
          projection=$(/usr/bin/mktemp -d /tmp/personal-desktop-volume-projection.XXXXXX)
          /bin/chmod 0700 "$mount_root" "$projection"
          canonical_mount_root=$(/bin/realpath "$mount_root")
          [[ -d "$canonical_mount_root" && ! -L "$canonical_mount_root" ]]
          /usr/bin/printf '%s\n' "$mount_root" > /tmp/personal-desktop-inspection-mountpoint.txt
          attach_plist=/tmp/personal-desktop-inspection-hdiutil-attach.plist
          attach_json=/tmp/personal-desktop-dmg-attach-layout.json
          /usr/bin/hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount_root" -plist "$DMG_PATH" \
            > "$attach_plist"
          /usr/bin/plutil -convert json -o - "$attach_plist" | jq -S . > "$attach_json"
          jq -e --arg mountpoint "$canonical_mount_root" '
            .["system-entities"] as $entities
            | ($entities | type == "array")
            and ([$entities[] | select(has("mount-point"))] | length) == 1
            and ([$entities[] | select(."mount-point" == $mountpoint)] | length) == 1
            and all($entities[]; (."dev-entry" | test("^/dev/disk[0-9]+(s[0-9]+)?$")))
            and (
              (($entities | length) == 2
                and ([$entities[] | select(."content-hint" == "GUID_partition_scheme"
                  and ."potentially-mountable" == false and (has("mount-point") | not))] | length) == 1
                and ([$entities[] | select(."content-hint" == "Apple_HFS"
                  and ."unmapped-content-hint" == "48465300-0000-11AA-AA11-00306543ECAC"
                  and ."volume-kind" == "hfs" and ."potentially-mountable" == true
                  and ."mount-point" == $mountpoint)] | length) == 1)
              or
              (($entities | length) == 4
                and ([$entities[] | ."content-hint"] | sort) == [
                  "41504653-0000-11AA-AA11-00306543ECAC",
                  "Apple_APFS", "EF57347C-0000-11AA-AA11-00306543ECAC",
                  "GUID_partition_scheme"
                ]
                and ([$entities[] | select(."content-hint" == "41504653-0000-11AA-AA11-00306543ECAC"
                  and ."volume-kind" == "apfs" and ."potentially-mountable" == true
                  and ."mount-point" == $mountpoint)] | length) == 1
                and all($entities[] | select(."content-hint" != "41504653-0000-11AA-AA11-00306543ECAC");
                  ."potentially-mountable" == false and (has("mount-point") | not)))
            )
          ' "$attach_json" >/dev/null
          image_device=$(jq -r '."system-entities"[] | select(."content-hint" == "GUID_partition_scheme") | ."dev-entry"' "$attach_json")
          [[ "$image_device" =~ ^/dev/disk[0-9]+$ ]]
          /usr/bin/printf '%s\n' "$image_device" > /tmp/personal-desktop-inspection-device.txt
          mount_line=$(/sbin/mount | /usr/bin/grep -F " on $canonical_mount_root (")
          /usr/bin/grep -Fq 'read-only' <<<"$mount_line"
          /usr/bin/grep -Fq 'nobrowse' <<<"$mount_line"

          app="$mount_root/$EXPECTED_PRODUCT_NAME.app"
          applications="$mount_root/Applications"
          background="$mount_root/.background"
          [[ -d "$app" && ! -L "$app" ]]
          [[ -L "$applications" && "$(/usr/bin/readlink "$applications")" == /Applications ]]
          [[ -d "$background" && ! -L "$background" ]]
          [[ -f "$background/dmg-background.png" && ! -L "$background/dmg-background.png" ]]
          [[ -f "$mount_root/.DS_Store" && ! -L "$mount_root/.DS_Store" ]]
          [[ -f "$mount_root/.VolumeIcon.icns" && ! -L "$mount_root/.VolumeIcon.icns" ]]

          inventory_ndjson=/tmp/personal-desktop-mounted-volume-inventory.ndjson
          inventory=/tmp/personal-desktop-mounted-volume-inventory.json
          /usr/bin/install -m 0600 /dev/null "$inventory_ndjson"
          while IFS= read -r -d '' entry; do
            relative=${entry#"$mount_root"/}
            [[ -n "$relative" && "$relative" != /* ]]
            [[ "$relative" != *$'\n'* && "$relative" != *$'\r'* ]]
            if [[ -L "$entry" ]]; then
              target=$(/usr/bin/readlink "$entry")
              if [[ "$relative" == Applications ]]; then
                [[ "$target" == /Applications ]]
                jq -cn --arg path "$relative" --arg target "$target" \
                  '{path: $path, type: "symlink", target: $target}' >> "$inventory_ndjson"
              else
                [[ "$target" != /* ]]
                resolved=$(/bin/realpath "$entry")
                case "$resolved" in
                  "$canonical_mount_root"/*) resolved_relative=${resolved#"$canonical_mount_root"/} ;;
                  *) echo "::error::DMG contains an external symlink: $relative"; exit 1 ;;
                esac
                jq -cn --arg path "$relative" --arg target "$target" --arg resolved_path "$resolved_relative" \
                  '{path: $path, type: "symlink", target: $target, resolved_path: $resolved_path}' \
                  >> "$inventory_ndjson"
              fi
            elif [[ -d "$entry" ]]; then
              /bin/mkdir -p "$projection/$relative"
              jq -cn --arg path "$relative" '{path: $path, type: "directory"}' \
                >> "$inventory_ndjson"
            elif [[ -f "$entry" ]]; then
              size=$(/usr/bin/stat -f '%z' "$entry")
              sha=$(/usr/bin/shasum -a 256 "$entry" | /usr/bin/awk '{print $1}')
              /bin/mkdir -p "$projection/$(/usr/bin/dirname "$relative")"
              /bin/cp -p "$entry" "$projection/$relative"
              [[ "$(/usr/bin/shasum -a 256 "$projection/$relative" | /usr/bin/awk '{print $1}')" == "$sha" ]]
              jq -cn --arg path "$relative" --arg sha256 "$sha" --argjson size "$size" \
                '{path: $path, type: "file", size: $size, sha256: $sha256}' >> "$inventory_ndjson"
            else
              echo "::error::DMG contains an unsupported filesystem entry: $relative"
              exit 1
            fi
          done < <(/usr/bin/find "$mount_root" -mindepth 1 -print0)
          jq -sS 'sort_by(.path)' "$inventory_ndjson" > "$inventory"
          jq -e --arg app "$EXPECTED_PRODUCT_NAME.app" '
            ([.[] | select((.path | contains("/")) | not) | {
              path, type, target: (.target // null)
            }]) == [
              {path: ".DS_Store", type: "file", target: null},
              {path: ".VolumeIcon.icns", type: "file", target: null},
              {path: ".background", type: "directory", target: null},
              {path: "Applications", type: "symlink", target: "/Applications"},
              {path: $app, type: "directory", target: null}
            ]
            and ([.[] | select(.path == ".background" or (.path | startswith(".background/"))) | {
              path, type
            }]) == [
              {path: ".background", type: "directory"},
              {path: ".background/dmg-background.png", type: "file"}
            ]
            and all(.[];
              if .type == "file" then
                (keys | sort) == ["path", "sha256", "size", "type"]
                and (.sha256 | test("^[0-9a-f]{64}$"))
                and (.size | type == "number" and . >= 0 and floor == .)
              elif .type == "directory" then
                (keys | sort) == ["path", "type"]
              elif .type == "symlink" and .path == "Applications" then
                (keys | sort) == ["path", "target", "type"]
                and .target == "/Applications"
              elif .type == "symlink" then
                (keys | sort) == ["path", "resolved_path", "target", "type"]
                and (.target | startswith("/") | not)
                and (.resolved_path | type == "string" and length > 0)
              else false end
            )
          ' "$inventory" >/dev/null
          inventory_file_count=$(jq '[.[] | select(.type == "file")] | length' "$inventory")
          projection_file_count=$(/usr/bin/find "$projection" -type f | /usr/bin/wc -l | /usr/bin/tr -d '[:space:]')
          [[ "$projection_file_count" == "$inventory_file_count" ]]
          [[ -z "$(/usr/bin/find "$projection" -mindepth 1 ! -type d ! -type f -print -quit)" ]]
          projection_manifest=/tmp/personal-desktop-volume-projection-manifest.json
          projection_actual_ndjson=/tmp/personal-desktop-volume-projection-actual.ndjson
          /usr/bin/install -m 0600 /dev/null "$projection_actual_ndjson"
          while IFS= read -r -d '' projected_file; do
            projected_relative=${projected_file#"$projection"/}
            projected_size=$(/usr/bin/stat -f '%z' "$projected_file")
            projected_sha=$(/usr/bin/shasum -a 256 "$projected_file" | /usr/bin/awk '{print $1}')
            jq -cn --arg path "$projected_relative" --arg sha256 "$projected_sha" --argjson size "$projected_size" \
              '{path: $path, size: $size, sha256: $sha256}' >> "$projection_actual_ndjson"
          done < <(/usr/bin/find "$projection" -type f -print0)
          jq -sS 'sort_by(.path)' "$projection_actual_ndjson" > "$projection_manifest"
          jq -S '[.[] | select(.type == "file") | {path, size, sha256}] | sort_by(.path)' \
            "$inventory" > /tmp/personal-desktop-volume-projection-expected.json
          /usr/bin/cmp -s "$projection_manifest" /tmp/personal-desktop-volume-projection-expected.json

          info_plist="$app/Contents/Info.plist"
          [[ -f "$info_plist" && ! -L "$info_plist" ]]
          plist_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")
          plist_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$info_plist")
          plist_display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info_plist")
          plist_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")
          [[ "$plist_bundle_id" == "$EXPECTED_BUNDLE_ID" ]]
          [[ "$plist_name" == "$EXPECTED_PRODUCT_NAME" && "$plist_display_name" == "$EXPECTED_PRODUCT_NAME" ]]
          python3 - "$info_plist" "$EXPECTED_URI_SCHEME" <<'PY'
          import plistlib
          import sys

          info_plist, expected_scheme = sys.argv[1:]
          if expected_scheme.casefold() == "buzz":
              raise SystemExit("staging URI scheme must not be buzz")
          with open(info_plist, "rb") as plist_file:
              plist = plistlib.load(plist_file)
          schemes = [
              scheme
              for url_type in plist.get("CFBundleURLTypes", [])
              for scheme in url_type.get("CFBundleURLSchemes", [])
          ]
          if any(scheme.casefold() == "buzz" for scheme in schemes):
              raise SystemExit("staging app registers the hosted buzz URI scheme")
          if schemes != [expected_scheme]:
              raise SystemExit(
                  f"staging URI schemes must be exactly [{expected_scheme!r}], got {schemes!r}"
              )
          PY
          [[ "$plist_executable" =~ ^[A-Za-z0-9._-]+$ ]]
          main_executable="$app/Contents/MacOS/$plist_executable"
          [[ -f "$main_executable" && -x "$main_executable" && ! -L "$main_executable" ]]
          case "$EXPECTED_TARGET" in
            aarch64-apple-darwin) expected_arch=arm64 ;;
            x86_64-apple-darwin) expected_arch=x86_64 ;;
            *) echo "::error::unsupported desktop target"; exit 1 ;;
          esac
          [[ "$(/usr/bin/lipo -archs "$main_executable")" == "$expected_arch" ]]
          /usr/bin/grep -aFq -- "$EXPECTED_RELAY_WSS" "$main_executable"
          /usr/bin/grep -aFq -- "$EXPECTED_RELAY_HTTPS" "$main_executable"
          staging_receipt=/tmp/personal-desktop-inspect-authorization/personal-staging-deployment-receipt.json
          while IFS= read -r forbidden_https; do
            forbidden_wss=${forbidden_https/https:/wss:}
            for forbidden in "$forbidden_https" "$forbidden_wss"; do
              if /usr/bin/grep -aFq -- "$forbidden" "$main_executable"; then
                echo "::error::mounted desktop executable contains a forbidden relay origin"
                exit 1
              fi
            done
          done < <(jq -r '.forbidden_origins[]' "$staging_receipt")

          [[ -s "$STAGED_SIDECAR_MANIFEST" && ! -L "$STAGED_SIDECAR_MANIFEST" ]]
          mounted_sidecar_entries=/tmp/personal-desktop-mounted-sidecar-entries.ndjson
          /usr/bin/install -m 0600 /dev/null "$mounted_sidecar_entries"
          while IFS=$'\t' read -r sidecar_name candidate_name source_sha embedded_relative_path manifest_arch; do
            staged_sidecar="$STAGED_SIDECAR_DIR/$candidate_name"
            embedded_sidecar="$app/$embedded_relative_path"
            [[ -s "$staged_sidecar" && ! -L "$staged_sidecar" ]]
            [[ -f "$embedded_sidecar" && ! -L "$embedded_sidecar" && -x "$embedded_sidecar" ]]
            staged_sha=$(/usr/bin/shasum -a 256 "$staged_sidecar" | /usr/bin/awk '{print $1}')
            embedded_sha=$(/usr/bin/shasum -a 256 "$embedded_sidecar" | /usr/bin/awk '{print $1}')
            [[ "$manifest_arch" == "$expected_arch" ]]
            [[ "$staged_sha" == "$source_sha" && "$embedded_sha" == "$source_sha" ]]
            [[ "$(/usr/bin/lipo -archs "$staged_sidecar")" == "$expected_arch" ]]
            [[ "$(/usr/bin/lipo -archs "$embedded_sidecar")" == "$expected_arch" ]]
            jq -cnS \
              --arg name "$sidecar_name" \
              --arg candidate_name "$candidate_name" \
              --arg source_sha256 "$staged_sha" \
              --arg embedded_relative_path "$embedded_relative_path" \
              --arg embedded_sha256 "$embedded_sha" \
              --arg architecture "$expected_arch" '
                {
                  name: $name,
                  candidate_name: $candidate_name,
                  source_sha256: $source_sha256,
                  embedded_relative_path: $embedded_relative_path,
                  embedded_sha256: $embedded_sha256,
                  architecture: $architecture,
                  executable: true
                }
              ' >> "$mounted_sidecar_entries"
          done < <(jq -r '.entries[] | [
            .name, .candidate_name, .source_sha256,
            .embedded_relative_path, .architecture
          ] | @tsv' "$STAGED_SIDECAR_MANIFEST")
          mounted_sidecar_manifest=/tmp/personal-desktop-mounted-sidecars.json
          jq -sS \
            --arg target "$EXPECTED_TARGET" \
            --arg architecture "$expected_arch" '
              {
                schema: "personal-desktop-sidecars/v1",
                target: $target,
                architecture: $architecture,
                entries: sort_by(.name)
              }
            ' "$mounted_sidecar_entries" > "$mounted_sidecar_manifest"
          /usr/bin/cmp -s "$mounted_sidecar_manifest" "$STAGED_SIDECAR_MANIFEST"
          mounted_sidecar_manifest_sha=$(/usr/bin/shasum -a 256 "$mounted_sidecar_manifest" | /usr/bin/awk '{print $1}')
          [[ "$mounted_sidecar_manifest_sha" == "$(jq -r .sidecar_manifest_sha256 "$LEDGER_PATH")" ]]
          embedded_acp_sha=$(jq -r '.entries[] | select(.name == "buzz-acp") | .embedded_sha256' "$mounted_sidecar_manifest")
          [[ "$embedded_acp_sha" == "$(jq -r .buzz_acp_sha256 "$LEDGER_PATH")" ]]
          inventory_sha=$(/usr/bin/shasum -a 256 "$inventory" | /usr/bin/awk '{print $1}')
          main_executable_sha=$(/usr/bin/shasum -a 256 "$main_executable" | /usr/bin/awk '{print $1}')
          {
            echo "embedded_acp_sha256=$embedded_acp_sha"
            echo "attach_layout=$attach_json"
            echo "inventory=$inventory"
            echo "inventory_sha256=$inventory_sha"
            echo "main_executable_sha256=$main_executable_sha"
            echo "mountpoint=$mount_root"
            echo "projection=$projection"
            echo "projection_manifest=$projection_manifest"
            echo "sidecar_manifest=$mounted_sidecar_manifest"
            echo "sidecar_manifest_sha256=$mounted_sidecar_manifest_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Seal pre-scan mounted-volume identity
        id: volume-record
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          BASH_ENV: ""
          ENV: ""
          EXPECTED_BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          attach_layout="${{ steps.mounted-volume.outputs.attach_layout }}"
          inventory="${{ steps.mounted-volume.outputs.inventory }}"
          projection_manifest="${{ steps.mounted-volume.outputs.projection_manifest }}"
          sidecar_manifest="${{ steps.mounted-volume.outputs.sidecar_manifest }}"
          for evidence in "$attach_layout" "$inventory" "$projection_manifest" "$sidecar_manifest"; do
            [[ -s "$evidence" && ! -L "$evidence" ]]
            jq -e -s 'length == 1' "$evidence" >/dev/null
          done
          attach_layout_sha=$(shasum -a 256 "$attach_layout" | awk '{print $1}')
          inventory_sha=$(shasum -a 256 "$inventory" | awk '{print $1}')
          projection_manifest_sha=$(shasum -a 256 "$projection_manifest" | awk '{print $1}')
          sidecar_manifest_sha=$(shasum -a 256 "$sidecar_manifest" | awk '{print $1}')
          record=/tmp/personal-desktop-mounted-volume-record.json
          jq -nS \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg artifact_expires_at "$ARTIFACT_EXPIRES_AT" \
            --arg bundle_id "$EXPECTED_BUNDLE_ID" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg target "$EXPECTED_TARGET" \
            --arg version "$EXPECTED_VERSION" \
            --arg dmg_name "${{ steps.inspection-inputs.outputs.dmg_name }}" \
            --arg dmg_sha256 "${{ steps.inspection-inputs.outputs.dmg_sha256 }}" \
            --arg ledger_sha256 "${{ steps.inspection-inputs.outputs.ledger_sha256 }}" \
            --arg acp_sha256 "${{ steps.inspection-inputs.outputs.acp_sha256 }}" \
            --arg sidecar_manifest_sha256 "${{ steps.inspection-inputs.outputs.sidecar_manifest_sha256 }}" \
            --arg attach_layout_sha256 "$attach_layout_sha" \
            --arg inventory_sha256 "$inventory_sha" \
            --arg projection_manifest_sha256 "$projection_manifest_sha" \
            --arg mounted_sidecar_manifest_sha256 "$sidecar_manifest_sha" \
            --arg main_executable_sha256 "${{ steps.mounted-volume.outputs.main_executable_sha256 }}" \
            --arg embedded_acp_sha256 "${{ steps.mounted-volume.outputs.embedded_acp_sha256 }}" \
            --argjson run_id "$GITHUB_RUN_ID" '
              {
                schema: "personal-desktop-mounted-volume/v1",
                repository: "justinharkelroad/buzz",
                workflow_sha: env.GITHUB_SHA,
                workflow_ref: env.GITHUB_WORKFLOW_REF,
                workflow_run_id: $run_id,
                workflow_run_attempt: 1,
                source_sha: $source_sha,
                target: $target,
                version: $version,
                bundle_id: $bundle_id,
                product_name: $product_name,
                candidate_artifact: {
                  id: $artifact_id, name: $artifact_name,
                  digest: $artifact_digest, expires_at: $artifact_expires_at
                },
                candidate: {
                  dmg_name: $dmg_name, dmg_sha256: $dmg_sha256,
                  ledger_sha256: $ledger_sha256, buzz_acp_sha256: $acp_sha256,
                  sidecar_manifest_sha256: $sidecar_manifest_sha256
                },
                mounted_volume: {
                  attach_layout_sha256: $attach_layout_sha256,
                  inventory_sha256: $inventory_sha256,
                  projection_manifest_sha256: $projection_manifest_sha256,
                  sidecar_manifest_sha256: $mounted_sidecar_manifest_sha256,
                  main_executable_sha256: $main_executable_sha256,
                  embedded_buzz_acp_sha256: $embedded_acp_sha256,
                  root_layout: [
                    ".DS_Store", ".VolumeIcon.icns", ".background",
                    "Applications", ($product_name + ".app")
                  ]
                }
              }
            ' > "$record"
          jq -e '
            (keys | sort) == [
              "bundle_id", "candidate", "candidate_artifact", "mounted_volume",
              "product_name", "repository", "schema", "source_sha", "target",
              "version", "workflow_ref", "workflow_run_attempt", "workflow_run_id",
              "workflow_sha"
            ]
            and .schema == "personal-desktop-mounted-volume/v1"
            and .repository == "justinharkelroad/buzz"
            and .workflow_run_attempt == 1
            and .mounted_volume.embedded_buzz_acp_sha256 == .candidate.buzz_acp_sha256
            and .mounted_volume.sidecar_manifest_sha256 == .candidate.sidecar_manifest_sha256
            and all([
              .candidate.dmg_sha256, .candidate.ledger_sha256,
              .candidate.buzz_acp_sha256, .candidate.sidecar_manifest_sha256,
              .mounted_volume.attach_layout_sha256,
              .mounted_volume.inventory_sha256,
              .mounted_volume.projection_manifest_sha256,
              .mounted_volume.sidecar_manifest_sha256,
              .mounted_volume.main_executable_sha256,
              .mounted_volume.embedded_buzz_acp_sha256
            ][]; test("^[0-9a-f]{64}$"))
          ' "$record" >/dev/null
          chmod 0400 "$record"
          record_sha=$(shasum -a 256 "$record" | awk '{print $1}')
          {
            echo "attach_layout_sha256=$attach_layout_sha"
            echo "inventory_sha256=$inventory_sha"
            echo "projection_manifest_sha256=$projection_manifest_sha"
            echo "sidecar_manifest_sha256=$sidecar_manifest_sha"
            echo "record=$record"
            echo "record_sha256=$record_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Stage immutable mounted-volume projection
        id: volume-stage
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          stage=$(mktemp -d /tmp/personal-desktop-mounted-volume-evidence.XXXXXX)
          mkdir "$stage/projection"
          cp "${{ steps.volume-record.outputs.record }}" "$stage/personal-desktop-mounted-volume-record.json"
          cp "${{ steps.mounted-volume.outputs.attach_layout }}" "$stage/personal-desktop-dmg-attach-layout.json"
          cp "${{ steps.mounted-volume.outputs.inventory }}" "$stage/personal-desktop-mounted-volume-inventory.json"
          cp "${{ steps.mounted-volume.outputs.projection_manifest }}" "$stage/personal-desktop-volume-projection-manifest.json"
          cp "${{ steps.mounted-volume.outputs.sidecar_manifest }}" "$stage/personal-desktop-mounted-sidecars.json"
          cp -Rp "${{ steps.mounted-volume.outputs.projection }}/." "$stage/projection/"
          [[ -z "$(find "$stage/projection" -mindepth 1 ! -type d ! -type f -print -quit)" ]]
          actual_ndjson=/tmp/personal-desktop-staged-volume-actual.ndjson
          install -m 0600 /dev/null "$actual_ndjson"
          while IFS= read -r -d '' projected_file; do
            relative=${projected_file#"$stage/projection"/}
            size=$(stat -f '%z' "$projected_file")
            sha=$(shasum -a 256 "$projected_file" | awk '{print $1}')
            jq -cn --arg path "$relative" --arg sha256 "$sha" --argjson size "$size" \
              '{path: $path, size: $size, sha256: $sha256}' >> "$actual_ndjson"
          done < <(find "$stage/projection" -type f -print0)
          jq -sS 'sort_by(.path)' "$actual_ndjson" > /tmp/personal-desktop-staged-volume-actual.json
          cmp -s /tmp/personal-desktop-staged-volume-actual.json "$stage/personal-desktop-volume-projection-manifest.json"
          echo "path=$stage" >> "$GITHUB_OUTPUT"
          echo "projection=$stage/projection" >> "$GITHUB_OUTPUT"

      - name: Resolve mounted-volume artifact name
        id: volume-artifact-name
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == "aarch64-apple-darwin" || "$TARGET" == "x86_64-apple-darwin" ]]
          echo "name=personal-desktop-mounted-volume-${TARGET}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable pre-scan mounted-volume evidence
        id: volume-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.volume-artifact-name.outputs.name }}
          path: ${{ steps.volume-stage.outputs.path }}/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Bind pre-scan mounted-volume artifact identity
        id: uploaded-volume
        env:
          ARTIFACT_ID: ${{ steps.volume-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.volume-artifact-name.outputs.name }}
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          UPLOAD_DIGEST: ${{ steps.volume-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          case "$UPLOAD_DIGEST" in
            sha256:*) artifact_digest=$UPLOAD_DIGEST ;;
            *) artifact_digest="sha256:$UPLOAD_DIGEST" ;;
          esac
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > /tmp/personal-desktop-mounted-volume-artifact.json
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg digest "$artifact_digest" \
            --arg name "$ARTIFACT_NAME" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $run_id
              and (.expires_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' /tmp/personal-desktop-mounted-volume-artifact.json >/dev/null
          {
            echo "digest=$artifact_digest"
            echo "expires_at=$(jq -r .expires_at /tmp/personal-desktop-mounted-volume-artifact.json)"
            echo "id=$ARTIFACT_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Create trusted inspection secret-scan policy
        working-directory: verifier
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          policy_root=/tmp/personal-desktop-inspection-trivy-policy
          [[ ! -e "$policy_root" && ! -L "$policy_root" ]]
          [[ ! -e trivyignores && ! -L trivyignores ]]
          /usr/bin/install -d -m 0700 "$policy_root"
          /usr/bin/printf '{}\n' > "$policy_root/trivy.yaml"
          /usr/bin/install -m 0600 /dev/null "$policy_root/trivy.ignore"
          /usr/bin/printf '{}\n' > "$policy_root/secret.yaml"
          /bin/chmod 0400 "$policy_root/trivy.yaml" "$policy_root/trivy.ignore" "$policy_root/secret.yaml"

      - name: Scan exact downloaded staging artifact
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CONFIG: /tmp/personal-desktop-inspection-trivy-policy/trivy.yaml
          TRIVY_IGNOREFILE: /tmp/personal-desktop-inspection-trivy-policy/trivy.ignore
          TRIVY_SECRET_CONFIG: /tmp/personal-desktop-inspection-trivy-policy/secret.yaml
        with:
          scan-type: fs
          scan-ref: /tmp/personal-desktop-inspect-staging
          scanners: secret
          format: json
          output: /tmp/personal-desktop-inspection-staging-secret.json
          exit-code: "1"
          trivy-config: /tmp/personal-desktop-inspection-trivy-policy/trivy.yaml
          trivyignores: /tmp/personal-desktop-inspection-trivy-policy/trivy.ignore
          version: v0.70.0
          cache: false

      - name: Bind zero-secret staging inspection report
        working-directory: verifier
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          report=/tmp/personal-desktop-inspection-staging-secret.json
          bound=/tmp/personal-desktop-inspection-staging-secret-bound.json
          [[ -s "$report" && ! -L "$report" && ! -e "$bound" && ! -L "$bound" ]]
          jq '. + {Trivy: {Version: "0.70.0"}}' "$report" > "$bound"
          /usr/bin/install -m 0600 "$bound" "$report"
          jq -e '
            .SchemaVersion == 2
            and .ArtifactType == "filesystem"
            and .Trivy.Version == "0.70.0"
            and ([.Results[]? | .Secrets[]?] | length) == 0
          ' "$report" >/dev/null

      - name: Scan full mounted-volume projection
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CONFIG: /tmp/personal-desktop-inspection-trivy-policy/trivy.yaml
          TRIVY_IGNOREFILE: /tmp/personal-desktop-inspection-trivy-policy/trivy.ignore
          TRIVY_SECRET_CONFIG: /tmp/personal-desktop-inspection-trivy-policy/secret.yaml
        with:
          scan-type: fs
          scan-ref: ${{ steps.volume-stage.outputs.projection }}
          scanners: secret
          format: json
          output: /tmp/personal-desktop-inspection-volume-secret.json
          exit-code: "1"
          trivy-config: /tmp/personal-desktop-inspection-trivy-policy/trivy.yaml
          trivyignores: /tmp/personal-desktop-inspection-trivy-policy/trivy.ignore
          version: v0.70.0
          cache: false

      - name: Bind zero-secret full-volume inspection report
        working-directory: verifier
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          report=/tmp/personal-desktop-inspection-volume-secret.json
          bound=/tmp/personal-desktop-inspection-volume-secret-bound.json
          [[ -s "$report" && ! -L "$report" && ! -e "$bound" && ! -L "$bound" ]]
          jq '. + {Trivy: {Version: "0.70.0"}}' "$report" > "$bound"
          /usr/bin/install -m 0600 "$bound" "$report"
          jq -e '
            .SchemaVersion == 2
            and .ArtifactType == "filesystem"
            and .Trivy.Version == "0.70.0"
            and ([.Results[]? | .Secrets[]?] | length) == 0
          ' "$report" >/dev/null
          projection="${{ steps.volume-stage.outputs.projection }}"
          inventory="${{ steps.mounted-volume.outputs.inventory }}"
          expected_manifest="${{ steps.mounted-volume.outputs.projection_manifest }}"
          [[ -d "$projection" && ! -L "$projection" ]]
          [[ -f "$inventory" && ! -L "$inventory" ]]
          [[ -f "$expected_manifest" && ! -L "$expected_manifest" ]]
          [[ "$(shasum -a 256 "$inventory" | awk '{print $1}')" == "${{ steps.volume-record.outputs.inventory_sha256 }}" ]]
          [[ "$(shasum -a 256 "$expected_manifest" | awk '{print $1}')" == "${{ steps.volume-record.outputs.projection_manifest_sha256 }}" ]]
          [[ "$(find "$projection" -type f | wc -l | tr -d '[:space:]')" == "$(jq '[.[] | select(.type == "file")] | length' "$inventory")" ]]
          [[ -z "$(find "$projection" -mindepth 1 ! -type d ! -type f -print -quit)" ]]
          post_ndjson=/tmp/personal-desktop-volume-projection-post-scan.ndjson
          post_manifest=/tmp/personal-desktop-volume-projection-post-scan.json
          install -m 0600 /dev/null "$post_ndjson"
          while IFS= read -r -d '' projected_file; do
            projected_relative=${projected_file#"$projection"/}
            projected_size=$(stat -f '%z' "$projected_file")
            projected_sha=$(shasum -a 256 "$projected_file" | awk '{print $1}')
            jq -cn --arg path "$projected_relative" --arg sha256 "$projected_sha" --argjson size "$projected_size" \
              '{path: $path, size: $size, sha256: $sha256}' >> "$post_ndjson"
          done < <(find "$projection" -type f -print0)
          jq -sS 'sort_by(.path)' "$post_ndjson" > "$post_manifest"
          cmp -s "$post_manifest" "$expected_manifest"

      - name: Detach inspected staging DMG
        if: always()
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          mount_record=/tmp/personal-desktop-inspection-mountpoint.txt
          device_record=/tmp/personal-desktop-inspection-device.txt
          if [[ -f "$mount_record" && ! -L "$mount_record" ]]; then
            mount_root=$(/bin/cat "$mount_record")
            canonical_mount_root=$(/bin/realpath "$mount_root")
            case "$mount_root" in
              /tmp/personal-desktop-inspection-mount.*) ;;
              *) echo "::error::refusing to detach unexpected inspection mountpoint"; exit 1 ;;
            esac
            [[ -f "$device_record" && ! -L "$device_record" ]]
            image_device=$(/bin/cat "$device_record")
            [[ "$image_device" =~ ^/dev/disk[0-9]+$ ]]
            if /sbin/mount | /usr/bin/grep -Fq " on $canonical_mount_root ("; then
              /usr/bin/hdiutil detach "$image_device"
            fi
            ! /sbin/mount | /usr/bin/grep -Fq " on $canonical_mount_root ("
          fi

      - name: Create exact desktop inspection receipt
        id: inspection-receipt
        working-directory: verifier
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.build.outputs.authorization_artifact_digest }}
          AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.authorization_artifact_expires_at }}
          AUTHORIZATION_ARTIFACT_ID: ${{ needs.build.outputs.authorization_artifact_id }}
          AUTHORIZATION_ARTIFACT_NAME: ${{ needs.build.outputs.authorization_artifact_name }}
          BASH_ENV: ""
          ENV: ""
          EXPECTED_BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          VOLUME_ARTIFACT_DIGEST: ${{ steps.uploaded-volume.outputs.digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ steps.uploaded-volume.outputs.expires_at }}
          VOLUME_ARTIFACT_ID: ${{ steps.uploaded-volume.outputs.id }}
          VOLUME_ARTIFACT_NAME: ${{ steps.volume-artifact-name.outputs.name }}
        run: |
          set -euo pipefail
          receipt=/tmp/personal-desktop-inspection-receipt.json
          inventory="${{ steps.mounted-volume.outputs.inventory }}"
          staging_report=/tmp/personal-desktop-inspection-staging-secret.json
          volume_report=/tmp/personal-desktop-inspection-volume-secret.json
          inventory_sha=$(shasum -a 256 "$inventory" | awk '{print $1}')
          [[ "$inventory_sha" == "${{ steps.volume-record.outputs.inventory_sha256 }}" ]]
          staging_scan_sha=$(shasum -a 256 "$staging_report" | awk '{print $1}')
          volume_scan_sha=$(shasum -a 256 "$volume_report" | awk '{print $1}')
          staging_scan_artifact=$(jq -r .ArtifactName "$staging_report")
          volume_scan_artifact=$(jq -r .ArtifactName "$volume_report")
          inspected_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq -nS \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg artifact_expires_at "$ARTIFACT_EXPIRES_AT" \
            --argjson authorization_artifact_id "$AUTHORIZATION_ARTIFACT_ID" \
            --arg authorization_artifact_name "$AUTHORIZATION_ARTIFACT_NAME" \
            --arg authorization_artifact_digest "$AUTHORIZATION_ARTIFACT_DIGEST" \
            --arg authorization_artifact_expires_at "$AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --arg bundle_id "$EXPECTED_BUNDLE_ID" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg target "$EXPECTED_TARGET" \
            --arg version "$EXPECTED_VERSION" \
            --arg dmg_name "${{ steps.inspection-inputs.outputs.dmg_name }}" \
            --arg dmg_sha256 "${{ steps.inspection-inputs.outputs.dmg_sha256 }}" \
            --arg ledger_sha256 "${{ steps.inspection-inputs.outputs.ledger_sha256 }}" \
            --arg acp_sha256 "${{ steps.inspection-inputs.outputs.acp_sha256 }}" \
            --arg sidecar_manifest_sha256 "${{ steps.inspection-inputs.outputs.sidecar_manifest_sha256 }}" \
            --arg inventory_sha256 "$inventory_sha" \
            --arg attach_layout_sha256 "${{ steps.volume-record.outputs.attach_layout_sha256 }}" \
            --arg projection_manifest_sha256 "${{ steps.volume-record.outputs.projection_manifest_sha256 }}" \
            --arg record_sha256 "${{ steps.volume-record.outputs.record_sha256 }}" \
            --arg mounted_sidecar_manifest_sha256 "${{ steps.volume-record.outputs.sidecar_manifest_sha256 }}" \
            --arg main_executable_sha256 "${{ steps.mounted-volume.outputs.main_executable_sha256 }}" \
            --arg embedded_acp_sha256 "${{ steps.mounted-volume.outputs.embedded_acp_sha256 }}" \
            --arg staging_scan_sha256 "$staging_scan_sha" \
            --arg staging_scan_artifact "$staging_scan_artifact" \
            --arg volume_scan_sha256 "$volume_scan_sha" \
            --arg volume_scan_artifact "$volume_scan_artifact" \
            --arg inspected_at "$inspected_at" \
            --argjson volume_artifact_id "$VOLUME_ARTIFACT_ID" \
            --arg volume_artifact_name "$VOLUME_ARTIFACT_NAME" \
            --arg volume_artifact_digest "$VOLUME_ARTIFACT_DIGEST" \
            --arg volume_artifact_expires_at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --argjson run_id "$GITHUB_RUN_ID" '
              {
                schema: "personal-desktop-staging-inspection/v1",
                repository: "justinharkelroad/buzz",
                workflow_sha: env.GITHUB_SHA,
                workflow_ref: env.GITHUB_WORKFLOW_REF,
                workflow_run_id: $run_id,
                workflow_run_attempt: 1,
                source_sha: $source_sha,
                target: $target,
                version: $version,
                bundle_id: $bundle_id,
                product_name: $product_name,
                inspected_at: $inspected_at,
                candidate_artifact: {
                  id: $artifact_id, name: $artifact_name,
                  digest: $artifact_digest, expires_at: $artifact_expires_at
                },
                authorization_artifact: {
                  id: $authorization_artifact_id, name: $authorization_artifact_name,
                  digest: $authorization_artifact_digest,
                  expires_at: $authorization_artifact_expires_at
                },
                mounted_volume_artifact: {
                  id: $volume_artifact_id, name: $volume_artifact_name,
                  digest: $volume_artifact_digest,
                  expires_at: $volume_artifact_expires_at
                },
                candidate: {
                  dmg_name: $dmg_name,
                  dmg_sha256: $dmg_sha256,
                  ledger_sha256: $ledger_sha256,
                  buzz_acp_sha256: $acp_sha256,
                  sidecar_manifest_sha256: $sidecar_manifest_sha256
                },
                mounted_volume: {
                  attach_layout_sha256: $attach_layout_sha256,
                  inventory_sha256: $inventory_sha256,
                  projection_manifest_sha256: $projection_manifest_sha256,
                  record_sha256: $record_sha256,
                  sidecar_manifest_sha256: $mounted_sidecar_manifest_sha256,
                  main_executable_sha256: $main_executable_sha256,
                  embedded_buzz_acp_sha256: $embedded_acp_sha256,
                  root_layout: [
                    ".DS_Store", ".VolumeIcon.icns", ".background",
                    "Applications", ($product_name + ".app")
                  ]
                },
                scans: {
                  downloaded_artifact: {
                    artifact_name: $staging_scan_artifact,
                    trivy_version: "0.70.0",
                    report_sha256: $staging_scan_sha256
                  },
                  full_volume_projection: {
                    artifact_name: $volume_scan_artifact,
                    trivy_version: "0.70.0",
                    report_sha256: $volume_scan_sha256
                  }
                }
              }
            ' > "$receipt"
          jq -e '
            (keys | sort) == [
              "authorization_artifact", "bundle_id", "candidate", "candidate_artifact",
              "inspected_at", "mounted_volume", "mounted_volume_artifact",
              "product_name", "repository", "scans",
              "schema", "source_sha", "target", "version", "workflow_ref",
              "workflow_run_attempt", "workflow_run_id", "workflow_sha"
            ]
            and .schema == "personal-desktop-staging-inspection/v1"
            and .repository == "justinharkelroad/buzz"
            and .workflow_run_attempt == 1
            and (.workflow_run_id | type == "number" and . >= 1 and floor == .)
            and (.workflow_sha | test("^[0-9a-f]{40}$"))
            and (.source_sha | test("^[0-9a-f]{40}$"))
            and (.inspected_at | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%SZ")) == .inspected_at
            and all([
              .candidate.dmg_sha256, .candidate.ledger_sha256,
              .candidate.buzz_acp_sha256, .candidate.sidecar_manifest_sha256,
              .mounted_volume.attach_layout_sha256, .mounted_volume.inventory_sha256,
              .mounted_volume.projection_manifest_sha256, .mounted_volume.record_sha256,
              .mounted_volume.sidecar_manifest_sha256,
              .mounted_volume.main_executable_sha256,
              .mounted_volume.embedded_buzz_acp_sha256,
              .scans.downloaded_artifact.report_sha256,
              .scans.full_volume_projection.report_sha256
            ][]; test("^[0-9a-f]{64}$"))
            and .mounted_volume.embedded_buzz_acp_sha256 == .candidate.buzz_acp_sha256
            and .mounted_volume.sidecar_manifest_sha256 == .candidate.sidecar_manifest_sha256
            and (.mounted_volume_artifact.id | type == "number" and . >= 1 and floor == .)
            and (.mounted_volume_artifact.digest | test("^sha256:[0-9a-f]{64}$"))
            and .scans.downloaded_artifact.artifact_name == "/tmp/personal-desktop-inspect-staging"
            and (.scans.full_volume_projection.artifact_name
              | test("^/tmp/personal-desktop-mounted-volume-evidence\\.[A-Za-z0-9]+/projection$"))
          ' "$receipt" >/dev/null
          /bin/chmod 0400 "$receipt"
          receipt_sha=$(shasum -a 256 "$receipt" | awk '{print $1}')
          {
            echo "inventory_sha256=$inventory_sha"
            echo "receipt_sha256=$receipt_sha"
            echo "staging_scan_sha256=$staging_scan_sha"
            echo "volume_scan_sha256=$volume_scan_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Stage exact desktop inspection evidence
        id: inspection-stage
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          stage=$(/usr/bin/mktemp -d /tmp/personal-desktop-inspection-evidence.XXXXXX)
          /bin/cp /tmp/personal-desktop-inspection-receipt.json "$stage/"
          /bin/cp "${{ steps.mounted-volume.outputs.inventory }}" "$stage/personal-desktop-mounted-volume-inventory.json"
          /bin/cp /tmp/personal-desktop-inspection-staging-secret.json "$stage/"
          /bin/cp /tmp/personal-desktop-inspection-volume-secret.json "$stage/"
          [[ "$(find "$stage" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 4 ]]
          [[ -z "$(find "$stage" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          echo "path=$stage" >> "$GITHUB_OUTPUT"

      - name: Resolve inspection artifact name
        id: inspection-artifact-name
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == "aarch64-apple-darwin" || "$TARGET" == "x86_64-apple-darwin" ]]
          echo "name=personal-desktop-staging-inspection-${TARGET}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload exact desktop inspection evidence
        id: inspection-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.inspection-artifact-name.outputs.name }}
          path: ${{ steps.inspection-stage.outputs.path }}/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Bind inspection artifact identity and expiration
        id: uploaded-inspection
        env:
          ARTIFACT_ID: ${{ steps.inspection-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.inspection-artifact-name.outputs.name }}
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          UPLOAD_DIGEST: ${{ steps.inspection-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          case "$UPLOAD_DIGEST" in
            sha256:*) artifact_digest=$UPLOAD_DIGEST ;;
            *) artifact_digest="sha256:$UPLOAD_DIGEST" ;;
          esac
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > /tmp/personal-desktop-inspection-artifact.json
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg digest "$artifact_digest" \
            --arg name "$ARTIFACT_NAME" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $run_id
              and (.expires_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' /tmp/personal-desktop-inspection-artifact.json >/dev/null
          {
            echo "digest=$artifact_digest"
            echo "expires_at=$(jq -r .expires_at /tmp/personal-desktop-inspection-artifact.json)"
            echo "id=$ARTIFACT_ID"
          } >> "$GITHUB_OUTPUT"

  remount:
    name: Independently remount exact staging DMG
    if: github.repository == 'justinharkelroad/buzz'
    needs:
      - build
      - inspect
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.uploaded-remount.outputs.digest }}
      artifact_expires_at: ${{ steps.uploaded-remount.outputs.expires_at }}
      artifact_id: ${{ steps.uploaded-remount.outputs.id }}
      artifact_name: ${{ steps.remount-artifact-name.outputs.name }}
      receipt_sha256: ${{ steps.remount-evidence.outputs.receipt_sha256 }}
    steps:
      - name: Checkout protected remount verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact candidate and pre-scan volume artifacts
        working-directory: verifier
        env:
          BASH_ENV: ""
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          REF_PROTECTED: ${{ github.ref_protected }}
          VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == "refs/heads/main" && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_WORKFLOW_REF" == "justinharkelroad/buzz/.github/workflows/personal-desktop-release.yml@refs/heads/main" ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]]
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$CANDIDATE_ARTIFACT_NAME" \
            --digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --expires-at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-remount-candidate \
            --metadata-output /tmp/personal-desktop-remount-candidate-artifact.json \
            --archive-output /tmp/personal-desktop-remount-candidate.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$VOLUME_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$VOLUME_ARTIFACT_NAME" \
            --digest "$VOLUME_ARTIFACT_DIGEST" \
            --expires-at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-remount-volume \
            --metadata-output /tmp/personal-desktop-remount-volume-artifact.json \
            --archive-output /tmp/personal-desktop-remount-volume.zip

      - name: Freshly remount and seal independent volume evidence
        id: remount-evidence
        working-directory: verifier
        env:
          BASH_ENV: ""
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ENV: ""
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
          VOLUME_ATTACH_LAYOUT_SHA256: ${{ needs.inspect.outputs.volume_attach_layout_sha256 }}
          VOLUME_PROJECTION_MANIFEST_SHA256: ${{ needs.inspect.outputs.volume_projection_manifest_sha256 }}
          VOLUME_RECORD_SHA256: ${{ needs.inspect.outputs.volume_record_sha256 }}
          VOLUME_SIDECAR_MANIFEST_SHA256: ${{ needs.inspect.outputs.volume_sidecar_manifest_sha256 }}
        run: |
          set -euo pipefail
          candidate=/tmp/personal-desktop-remount-candidate
          volume=/tmp/personal-desktop-remount-volume
          case "$EXPECTED_TARGET" in
            aarch64-apple-darwin) dmg_arch=aarch64 ;;
            x86_64-apple-darwin) dmg_arch=x64 ;;
            *) echo "::error::unsupported remount target"; exit 1 ;;
          esac
          dmg_name="${EXPECTED_PRODUCT_NAME}_${EXPECTED_VERSION}_${dmg_arch}.dmg"
          dmg="$candidate/$dmg_name"
          ledger="$candidate/personal-desktop-staging.json"
          sidecars="$candidate/personal-desktop-sidecars.json"
          record="$volume/personal-desktop-mounted-volume-record.json"
          attach_layout="$volume/personal-desktop-dmg-attach-layout.json"
          inventory="$volume/personal-desktop-mounted-volume-inventory.json"
          projection_manifest="$volume/personal-desktop-volume-projection-manifest.json"
          mounted_sidecars="$volume/personal-desktop-mounted-sidecars.json"
          expected_candidate_names=$(printf '%s\n' \
            "$dmg_name" \
            "buzz-$EXPECTED_TARGET" \
            "buzz-acp-$EXPECTED_TARGET" \
            "buzz-agent-$EXPECTED_TARGET" \
            "buzz-backend-kubernetes-$EXPECTED_TARGET" \
            "buzz-dev-mcp-$EXPECTED_TARGET" \
            "git-credential-nostr-$EXPECTED_TARGET" \
            personal-desktop-checksums.txt \
            personal-desktop-sidecars.json \
            personal-desktop-staging.json | LC_ALL=C sort)
          observed_candidate_names=$(find "$candidate" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
          [[ "$observed_candidate_names" == "$expected_candidate_names" ]]
          [[ -z "$(find "$candidate" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          expected_volume_names=$(printf '%s\n' \
            personal-desktop-dmg-attach-layout.json \
            personal-desktop-mounted-sidecars.json \
            personal-desktop-mounted-volume-inventory.json \
            personal-desktop-mounted-volume-record.json \
            personal-desktop-volume-projection-manifest.json \
            projection | LC_ALL=C sort)
          observed_volume_names=$(find "$volume" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
          [[ "$observed_volume_names" == "$expected_volume_names" ]]
          [[ -z "$(find "$volume" -type l -print -quit)" ]]
          [[ -z "$(find "$volume" -mindepth 1 ! -type d ! -type f -print -quit)" ]]
          for evidence in "$ledger" "$sidecars" "$record" "$attach_layout" "$inventory" "$projection_manifest" "$mounted_sidecars"; do
            [[ -s "$evidence" && ! -L "$evidence" ]]
            jq -e -s 'length == 1' "$evidence" >/dev/null
          done
          [[ -f "$dmg" && ! -L "$dmg" ]]
          dmg_sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          ledger_sha=$(shasum -a 256 "$ledger" | awk '{print $1}')
          sidecar_manifest_sha=$(shasum -a 256 "$sidecars" | awk '{print $1}')
          record_sha=$(shasum -a 256 "$record" | awk '{print $1}')
          attach_layout_sha=$(shasum -a 256 "$attach_layout" | awk '{print $1}')
          inventory_sha=$(shasum -a 256 "$inventory" | awk '{print $1}')
          projection_manifest_sha=$(shasum -a 256 "$projection_manifest" | awk '{print $1}')
          mounted_sidecar_manifest_sha=$(shasum -a 256 "$mounted_sidecars" | awk '{print $1}')
          [[ "$(jq -r .schema "$ledger")" == "personal-desktop-staging/v2" ]]
          [[ "$dmg_sha" == "$(jq -r .dmg_sha256 "$ledger")" ]]
          [[ "$sidecar_manifest_sha" == "$(jq -r .sidecar_manifest_sha256 "$ledger")" ]]
          [[ "$record_sha" == "$VOLUME_RECORD_SHA256" ]]
          [[ "$attach_layout_sha" == "$VOLUME_ATTACH_LAYOUT_SHA256" ]]
          [[ "$projection_manifest_sha" == "$VOLUME_PROJECTION_MANIFEST_SHA256" ]]
          [[ "$mounted_sidecar_manifest_sha" == "$VOLUME_SIDECAR_MANIFEST_SHA256" ]]
          cmp -s "$sidecars" "$mounted_sidecars"
          while IFS=$'\t' read -r candidate_name expected_sha; do
            candidate_sidecar="$candidate/$candidate_name"
            [[ -f "$candidate_sidecar" && ! -L "$candidate_sidecar" ]]
            [[ "$(shasum -a 256 "$candidate_sidecar" | awk '{print $1}')" == "$expected_sha" ]]
          done < <(jq -r '.entries[] | [.candidate_name, .source_sha256] | @tsv' "$sidecars")
          bash ./deploy/personal-relay/verify-desktop-dmg-volume.sh \
            --dmg "$dmg" \
            --ledger "$ledger" \
            --sidecar-manifest "$sidecars" \
            --volume-dir "$volume" \
            --product-name "$EXPECTED_PRODUCT_NAME" \
            --target "$EXPECTED_TARGET"

          receipt=/tmp/personal-desktop-independent-remount-receipt.json
          remounted_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq -nS \
            --argjson candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidate_artifact_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg candidate_artifact_expires_at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --argjson volume_artifact_id "$VOLUME_ARTIFACT_ID" \
            --arg volume_artifact_name "$VOLUME_ARTIFACT_NAME" \
            --arg volume_artifact_digest "$VOLUME_ARTIFACT_DIGEST" \
            --arg volume_artifact_expires_at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg target "$EXPECTED_TARGET" \
            --arg version "$EXPECTED_VERSION" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg dmg_name "$dmg_name" \
            --arg dmg_sha "$dmg_sha" \
            --arg ledger_sha "$ledger_sha" \
            --arg sidecar_manifest_sha "$sidecar_manifest_sha" \
            --arg record_sha "$record_sha" \
            --arg attach_layout_sha "$attach_layout_sha" \
            --arg inventory_sha "$inventory_sha" \
            --arg projection_manifest_sha "$projection_manifest_sha" \
            --arg mounted_sidecar_manifest_sha "$mounted_sidecar_manifest_sha" \
            --arg main_executable_sha "$(jq -r .mounted_volume.main_executable_sha256 "$record")" \
            --arg remounted_at "$remounted_at" \
            --argjson run_id "$GITHUB_RUN_ID" '
              {
                schema: "personal-desktop-independent-remount/v1",
                repository: "justinharkelroad/buzz",
                workflow_sha: env.GITHUB_SHA,
                workflow_ref: env.GITHUB_WORKFLOW_REF,
                workflow_run_id: $run_id,
                workflow_run_attempt: 1,
                source_sha: $source_sha,
                target: $target,
                version: $version,
                product_name: $product_name,
                remounted_at: $remounted_at,
                candidate_artifact: {
                  id: $candidate_artifact_id, name: $candidate_artifact_name,
                  digest: $candidate_artifact_digest, expires_at: $candidate_artifact_expires_at
                },
                mounted_volume_artifact: {
                  id: $volume_artifact_id, name: $volume_artifact_name,
                  digest: $volume_artifact_digest, expires_at: $volume_artifact_expires_at
                },
                candidate: {
                  dmg_name: $dmg_name, dmg_sha256: $dmg_sha,
                  ledger_sha256: $ledger_sha,
                  sidecar_manifest_sha256: $sidecar_manifest_sha
                },
                mounted_volume: {
                  record_sha256: $record_sha,
                  attach_layout_sha256: $attach_layout_sha,
                  inventory_sha256: $inventory_sha,
                  projection_manifest_sha256: $projection_manifest_sha,
                  sidecar_manifest_sha256: $mounted_sidecar_manifest_sha,
                  main_executable_sha256: $main_executable_sha
                },
                verification: {
                  fresh_runner: true,
                  mounted_read_only: true,
                  mounted_nobrowse: true,
                  inventory_equal: true,
                  projection_hashes_equal: true,
                  sidecars_equal: true,
                  candidate_executed: false
                }
              }
            ' > "$receipt"
          jq -e '
            .schema == "personal-desktop-independent-remount/v1"
            and .repository == "justinharkelroad/buzz"
            and .workflow_run_attempt == 1
            and (.remounted_at | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%SZ")) == .remounted_at
            and .verification == {
              fresh_runner: true, mounted_read_only: true, mounted_nobrowse: true,
              inventory_equal: true, projection_hashes_equal: true,
              sidecars_equal: true, candidate_executed: false
            }
            and all([
              .candidate.dmg_sha256, .candidate.ledger_sha256,
              .candidate.sidecar_manifest_sha256, .mounted_volume.record_sha256,
              .mounted_volume.attach_layout_sha256, .mounted_volume.inventory_sha256,
              .mounted_volume.projection_manifest_sha256,
              .mounted_volume.sidecar_manifest_sha256,
              .mounted_volume.main_executable_sha256
            ][]; test("^[0-9a-f]{64}$"))
          ' "$receipt" >/dev/null
          chmod 0400 "$receipt"
          echo "receipt_sha256=$(shasum -a 256 "$receipt" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Resolve independent remount artifact name
        id: remount-artifact-name
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          TARGET: ${{ inputs.target }}
        run: echo "name=personal-desktop-independent-remount-${TARGET}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload exact independent remount receipt
        id: remount-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.remount-artifact-name.outputs.name }}
          path: /tmp/personal-desktop-independent-remount-receipt.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Bind independent remount artifact identity
        id: uploaded-remount
        env:
          ARTIFACT_ID: ${{ steps.remount-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.remount-artifact-name.outputs.name }}
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          UPLOAD_DIGEST: ${{ steps.remount-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          case "$UPLOAD_DIGEST" in
            sha256:*) artifact_digest=$UPLOAD_DIGEST ;;
            *) artifact_digest="sha256:$UPLOAD_DIGEST" ;;
          esac
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > /tmp/personal-desktop-independent-remount-artifact.json
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg digest "$artifact_digest" \
            --arg name "$ARTIFACT_NAME" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $run_id
              and (.expires_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' /tmp/personal-desktop-independent-remount-artifact.json >/dev/null
          {
            echo "digest=$artifact_digest"
            echo "expires_at=$(jq -r .expires_at /tmp/personal-desktop-independent-remount-artifact.json)"
            echo "id=$ARTIFACT_ID"
          } >> "$GITHUB_OUTPUT"

  attest:
    name: Attest unsigned staging candidate
    if: github.repository == 'justinharkelroad/buzz'
    needs:
      - build
      - inspect
      - remount
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read
    outputs:
      artifact_digest: ${{ steps.uploaded-attestation.outputs.digest }}
      artifact_expires_at: ${{ steps.uploaded-attestation.outputs.expires_at }}
      artifact_id: ${{ steps.uploaded-attestation.outputs.id }}
      artifact_name: personal-desktop-staging-attestation-${{ inputs.target }}-${{ github.sha }}
    steps:
      - name: Checkout protected receipt verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact sealed desktop artifact
        working-directory: verifier
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.build.outputs.authorization_artifact_digest }}
          AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.authorization_artifact_expires_at }}
          AUTHORIZATION_ARTIFACT_ID: ${{ needs.build.outputs.authorization_artifact_id }}
          AUTHORIZATION_ARTIFACT_NAME: ${{ needs.build.outputs.authorization_artifact_name }}
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPECTION_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.artifact_digest }}
          INSPECTION_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.artifact_expires_at }}
          INSPECTION_ARTIFACT_ID: ${{ needs.inspect.outputs.artifact_id }}
          INSPECTION_ARTIFACT_NAME: ${{ needs.inspect.outputs.artifact_name }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          REF_PROTECTED: ${{ github.ref_protected }}
          REMOUNT_ARTIFACT_DIGEST: ${{ needs.remount.outputs.artifact_digest }}
          REMOUNT_ARTIFACT_EXPIRES_AT: ${{ needs.remount.outputs.artifact_expires_at }}
          REMOUNT_ARTIFACT_ID: ${{ needs.remount.outputs.artifact_id }}
          REMOUNT_ARTIFACT_NAME: ${{ needs.remount.outputs.artifact_name }}
          VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo "::error::desktop attestation requires fresh run attempt 1"
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/main" && "$REF_PROTECTED" == true ]] || {
            echo "::error::desktop attestation requires the protected main ref"
            exit 1
          }
          [[ "$GITHUB_WORKFLOW_REF" == "justinharkelroad/buzz/.github/workflows/personal-desktop-release.yml@refs/heads/main" ]] || {
            echo "::error::desktop attestation requires the protected main workflow"
            exit 1
          }
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]]
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$ARTIFACT_NAME" \
            --digest "$ARTIFACT_DIGEST" \
            --expires-at "$ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-staging \
            --metadata-output /tmp/personal-desktop-staging-artifact.json \
            --archive-output /tmp/personal-desktop-staging.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$AUTHORIZATION_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$AUTHORIZATION_ARTIFACT_NAME" \
            --digest "$AUTHORIZATION_ARTIFACT_DIGEST" \
            --expires-at "$AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-authorization \
            --metadata-output /tmp/personal-desktop-authorization-artifact.json \
            --archive-output /tmp/personal-desktop-authorization.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$INSPECTION_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$INSPECTION_ARTIFACT_NAME" \
            --digest "$INSPECTION_ARTIFACT_DIGEST" \
            --expires-at "$INSPECTION_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-inspection \
            --metadata-output /tmp/personal-desktop-inspection-artifact.json \
            --archive-output /tmp/personal-desktop-inspection.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$VOLUME_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$VOLUME_ARTIFACT_NAME" \
            --digest "$VOLUME_ARTIFACT_DIGEST" \
            --expires-at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-mounted-volume \
            --metadata-output /tmp/personal-desktop-mounted-volume-artifact.json \
            --archive-output /tmp/personal-desktop-mounted-volume.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$REMOUNT_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$REMOUNT_ARTIFACT_NAME" \
            --digest "$REMOUNT_ARTIFACT_DIGEST" \
            --expires-at "$REMOUNT_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-independent-remount \
            --metadata-output /tmp/personal-desktop-independent-remount-artifact.json \
            --archive-output /tmp/personal-desktop-independent-remount.zip

      - name: Resolve and verify sealed desktop ledger
        id: dmg
        working-directory: verifier
        env:
          BASH_ENV: ""
          ENV: ""
          EXPECTED_AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.build.outputs.authorization_artifact_digest }}
          EXPECTED_AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.authorization_artifact_expires_at }}
          EXPECTED_AUTHORIZATION_ARTIFACT_ID: ${{ needs.build.outputs.authorization_artifact_id }}
          EXPECTED_AUTHORIZATION_ARTIFACT_NAME: ${{ needs.build.outputs.authorization_artifact_name }}
          EXPECTED_AUTO_CONNECT_DEFAULT_RELAY: ${{ needs.build.outputs.auto_connect_default_relay }}
          EXPECTED_BUILD_CHANNEL: ${{ needs.build.outputs.build_channel }}
          EXPECTED_BUILD_CONTRACT_SHA256: ${{ needs.build.outputs.build_contract_sha256 }}
          EXPECTED_BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          EXPECTED_DEEP_LINK_SCHEME: ${{ needs.build.outputs.deep_link_scheme }}
          EXPECTED_GATE1_ARTIFACT_DIGEST: ${{ needs.build.outputs.gate1_artifact_digest }}
          EXPECTED_GATE1_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.gate1_artifact_expires_at }}
          EXPECTED_GATE1_ARTIFACT_ID: ${{ needs.build.outputs.gate1_artifact_id }}
          EXPECTED_GATE1_ARTIFACT_NAME: ${{ needs.build.outputs.gate1_artifact_name }}
          EXPECTED_GATE1_ATTESTATION_BUNDLE_SHA256: ${{ needs.build.outputs.gate1_attestation_bundle_sha256 }}
          EXPECTED_GATE1_RECEIPT_SHA256: ${{ needs.build.outputs.gate1_receipt_sha256 }}
          EXPECTED_GATE1_WORKFLOW_SHA: ${{ needs.build.outputs.gate1_workflow_sha }}
          EXPECTED_RELAY_DIGEST: ${{ needs.build.outputs.relay_digest }}
          EXPECTED_RELAY_IMAGE: ${{ needs.build.outputs.relay_image }}
          EXPECTED_RELAY_IMAGE_REF: ${{ needs.build.outputs.relay_image_ref }}
          EXPECTED_RELAY_HTTPS: ${{ needs.build.outputs.relay_https }}
          EXPECTED_RELAY_WSS: ${{ needs.build.outputs.relay_wss }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_STAGING_RECEIPT_SHA256: ${{ inputs.staging_deployment_receipt_sha256 }}
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          GATE1_EVIDENCE_RUN_ID: ${{ inputs.gate1_evidence_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          stage=/tmp/personal-desktop-staging
          authorization=/tmp/personal-desktop-authorization
          ledger="$stage/personal-desktop-staging.json"
          test -s "$ledger"
          [[ "$(find "$stage" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 10 ]]
          [[ -z "$(find "$stage" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          [[ "$(find "$authorization" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 16 ]]
          [[ -z "$(find "$authorization" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]

          bash ./deploy/personal-relay/validate-main-protection.sh \
            --branch-json "$authorization/personal-desktop-main-branch.json" \
            --rules-json "$authorization/personal-desktop-main-effective-rules.json" \
            --rulesets-json "$authorization/personal-desktop-main-rulesets.json" \
            --expected-sha "$GITHUB_SHA" \
            --expected-repository justinharkelroad/buzz
          bash ./deploy/personal-relay/validate-main-protection.sh \
            --branch-json "$authorization/personal-relay-main-branch.json" \
            --rules-json "$authorization/personal-relay-main-effective-rules.json" \
            --rulesets-json "$authorization/personal-relay-gate1-main-rulesets.json" \
            --expected-sha "$EXPECTED_GATE1_WORKFLOW_SHA" \
            --expected-repository justinharkelroad/buzz

          dmg_count=$(find "$stage" -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d '[:space:]')
          dmg=$(find "$stage" -maxdepth 1 -name '*.dmg' -type f -print -quit)
          [[ "$dmg_count" == 1 && -n "$dmg" ]] || {
            echo "::error::expected exactly one staging DMG"
            exit 1
          }
          case "$EXPECTED_TARGET" in
            aarch64-apple-darwin) dmg_arch=aarch64 ;;
            x86_64-apple-darwin) dmg_arch=x64 ;;
            *) echo "::error::unsupported desktop target"; exit 1 ;;
          esac
          expected_dmg_name="${EXPECTED_PRODUCT_NAME}_${EXPECTED_VERSION}_${dmg_arch}.dmg"
          [[ "$(basename "$dmg")" == "$expected_dmg_name" ]]
          acp="$stage/buzz-acp-${EXPECTED_TARGET}"
          checksums="$stage/personal-desktop-checksums.txt"
          sidecar_manifest="$stage/personal-desktop-sidecars.json"
          staging_receipt="$authorization/personal-staging-deployment-receipt.json"
          build_contract="$authorization/personal-desktop-build-contract.json"
          test -s "$acp"
          test -s "$checksums"
          [[ -s "$sidecar_manifest" && ! -L "$sidecar_manifest" ]]
          test -s "$staging_receipt"
          test -s "$build_contract"
          [[ "$(bash ./deploy/personal-relay/canonical-json-sha256.sh "$staging_receipt")" == "$EXPECTED_STAGING_RECEIPT_SHA256" ]]
          [[ "$(shasum -a 256 "$build_contract" | awk '{print $1}')" == "$EXPECTED_BUILD_CONTRACT_SHA256" ]]
          dmg_sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          acp_sha=$(shasum -a 256 "$acp" | awk '{print $1}')
          sidecar_manifest_sha=$(shasum -a 256 "$sidecar_manifest" | awk '{print $1}')
          case "$EXPECTED_TARGET" in
            aarch64-apple-darwin) expected_arch=arm64 ;;
            x86_64-apple-darwin) expected_arch=x86_64 ;;
          esac
          jq -e \
            --arg target "$EXPECTED_TARGET" \
            --arg architecture "$expected_arch" '
              .schema == "personal-desktop-sidecars/v1"
              and .target == $target
              and .architecture == $architecture
              and ([.entries[].name] == [
                "buzz", "buzz-acp", "buzz-agent", "buzz-backend-kubernetes",
                "buzz-dev-mcp", "git-credential-nostr"
              ])
              and (.entries | length) == 6
              and all(.entries[];
                .candidate_name == (.name + "-" + $target)
                and .embedded_relative_path == ("Contents/MacOS/" + .name)
                and .architecture == $architecture
                and .executable == true
                and .source_sha256 == .embedded_sha256
                and (.source_sha256 | test("^[0-9a-f]{64}$"))
              )
            ' "$sidecar_manifest" >/dev/null
          while IFS=$'\t' read -r candidate_name expected_sha; do
            candidate_sidecar="$stage/$candidate_name"
            [[ -s "$candidate_sidecar" && ! -L "$candidate_sidecar" ]]
            [[ "$(shasum -a 256 "$candidate_sidecar" | awk '{print $1}')" == "$expected_sha" ]]
            [[ "$(/usr/bin/lipo -archs "$candidate_sidecar")" == "$expected_arch" ]]
          done < <(jq -r '.entries[] | [.candidate_name, .source_sha256] | @tsv' "$sidecar_manifest")
          expected_checksums=/tmp/personal-desktop-attest-expected-checksums.txt
          {
            printf '%s  %s\n' "$dmg_sha" "$(basename "$dmg")"
            jq -r '.entries[] | "\(.source_sha256)  \(.candidate_name)"' "$sidecar_manifest"
          } > "$expected_checksums"
          cmp -s "$checksums" "$expected_checksums" || {
            echo "::error::desktop checksum manifest does not exactly match the sealed DMG and sidecars"
            exit 1
          }
          jq -e \
            --argjson auto_connect_default_relay "$EXPECTED_AUTO_CONNECT_DEFAULT_RELAY" \
            --arg build_channel "$EXPECTED_BUILD_CHANNEL" \
            --arg bundle_id "$EXPECTED_BUNDLE_ID" \
            --arg deep_link_scheme "$EXPECTED_DEEP_LINK_SCHEME" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg receipt_sha256 "$EXPECTED_STAGING_RECEIPT_SHA256" \
            --arg relay_https "$EXPECTED_RELAY_HTTPS" \
            --arg relay_wss "$EXPECTED_RELAY_WSS" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg target "$EXPECTED_TARGET" \
            --arg version "$EXPECTED_VERSION" \
            --slurpfile receipt "$staging_receipt" '
              (keys | sort) == [
                "auto_connect_default_relay", "build_channel", "bundle_id",
                "deep_link_scheme", "product_name", "receipt_sha256",
                "relay_https", "relay_wss", "source_sha", "target", "version"
              ]
              and .auto_connect_default_relay == $auto_connect_default_relay
              and .build_channel == $build_channel
              and .bundle_id == $bundle_id
              and .deep_link_scheme == $deep_link_scheme
              and .product_name == $product_name
              and .receipt_sha256 == $receipt_sha256
              and .relay_https == $relay_https
              and .relay_wss == $relay_wss
              and .source_sha == $source_sha
              and .target == $target
              and .version == $version
              and .relay_https == $receipt[0].https_origin
              and .relay_wss == $receipt[0].wss_origin
            ' "$build_contract" >/dev/null
          jq -e '
            (keys | sort) == [
              "authorized_at", "authorized_by",
              "deployed_relay_image_ref", "environment", "evidence_reference",
              "forbidden_origins", "gate1_attestation_bundle_sha256",
              "gate1_evidence_artifact_digest", "gate1_evidence_artifact_id",
              "gate1_evidence_artifact_name", "gate1_evidence_expires_at",
              "gate1_evidence_run_attempt", "gate1_evidence_run_id",
              "gate1_receipt_sha256", "gate1_workflow_sha", "hosted_https_origin",
              "https_origin", "personal_production_https_origin", "relay_pubkey",
              "relay_source_sha", "smoke_approval_record_sha256", "smoke_completed_at",
              "smoke_passed", "wss_origin"
            ]
            and .authorized_by.login == "justinharkelroad"
          ' "$staging_receipt" >/dev/null

          desktop_main_branch_sha=$(shasum -a 256 "$authorization/personal-desktop-main-branch.json" | awk '{print $1}')
          desktop_main_rules_sha=$(shasum -a 256 "$authorization/personal-desktop-main-effective-rules.json" | awk '{print $1}')
          desktop_main_rulesets_sha=$(shasum -a 256 "$authorization/personal-desktop-main-rulesets.json" | awk '{print $1}')
          gate1_main_branch_sha=$(shasum -a 256 "$authorization/personal-relay-main-branch.json" | awk '{print $1}')
          gate1_main_rules_sha=$(shasum -a 256 "$authorization/personal-relay-main-effective-rules.json" | awk '{print $1}')
          gate1_main_rulesets_sha=$(shasum -a 256 "$authorization/personal-relay-gate1-main-rulesets.json" | awk '{print $1}')
          staging_environment_sha=$(shasum -a 256 "$authorization/personal-staging-environment.json" | awk '{print $1}')
          staging_branch_policies_sha=$(shasum -a 256 "$authorization/personal-staging-branch-policies.json" | awk '{print $1}')
          staging_run_identity_sha=$(shasum -a 256 "$authorization/personal-staging-run-identity.json" | awk '{print $1}')
          gate1_receipt="$authorization/personal-relay-gate1-receipt.json"
          gate1_bundle="$authorization/personal-relay-gate1-attestation-bundle.json"
          test -s "$gate1_receipt"
          test -s "$gate1_bundle"
          [[ "$(bash ./deploy/personal-relay/canonical-json-sha256.sh "$gate1_receipt")" == "$EXPECTED_GATE1_RECEIPT_SHA256" ]]
          [[ "$(shasum -a 256 "$gate1_bundle" | awk '{print $1}')" == "$EXPECTED_GATE1_ATTESTATION_BUNDLE_SHA256" ]]
          gate1_eligibility_expires_at=$(jq -r .eligibility_expires_at "$gate1_receipt")
          gate1_release_evidence_expires_at=$(jq -r .release_evidence.expires_at "$gate1_receipt")

          now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq -e \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg deployment_ref "$EXPECTED_RELAY_IMAGE_REF" \
            --arg workflow_sha "$EXPECTED_GATE1_WORKFLOW_SHA" \
            --arg workflow_run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GATE1_EVIDENCE_RUN_ID" \
            --arg gate1_main_branch_sha "$gate1_main_branch_sha" \
            --arg gate1_main_rules_sha "$gate1_main_rules_sha" \
            --arg gate1_main_rulesets_sha "$gate1_main_rulesets_sha" \
            --arg now "$now" '
              .gate1_workflow.authorized_owner as $authorized_owner
              | .schema_version == 2
              and .receipt_type == "personal-relay-gate1"
              and ($authorized_owner | type == "object")
              and (($authorized_owner | keys | sort) == ["id", "login", "node_id"])
              and $authorized_owner.login == "justinharkelroad"
              and ($authorized_owner.id | type == "number" and . >= 1 and floor == .)
              and ($authorized_owner.node_id | type == "string" and length > 0)
              and .release_evidence.release_authorization.authorized_owner == "justinharkelroad"
              and .repository == "justinharkelroad/buzz"
              and .source_sha == $source_sha
              and .deployment_ref == $deployment_ref
              and .deployment_ref == (.image + "@" + .image_digest)
              and .gate1_workflow.sha == $workflow_sha
              and .gate1_workflow.ref == "justinharkelroad/buzz/.github/workflows/personal-relay-gate1.yml@refs/heads/main"
              and .gate1_workflow.run == $workflow_run
              and .gate1_workflow.run_attempt == 1
              and .main_protection == {
                branch: "main",
                commit_sha: $workflow_sha,
                ref_protected: true,
                branch_metadata_sha256: $gate1_main_branch_sha,
                effective_rules_sha256: $gate1_main_rules_sha,
                rulesets_sha256: $gate1_main_rulesets_sha
              }
              and .findings.complete == true
              and .deployment_eligible == true
              and (.eligibility_expires_at | fromdateiso8601) > ($now | fromdateiso8601)
              and (.release_evidence.expires_at | fromdateiso8601) > ($now | fromdateiso8601)
              and (.eligibility_expires_at | fromdateiso8601) <= (.release_evidence.expires_at | fromdateiso8601)
              and .non_effects.actions_evidence_artifacts_published == true
              and .non_effects.registry_package_published == false
              and .non_effects.registry_package_mutated == false
              and .non_effects.candidate_tag_mutated == false
              and .non_effects.infrastructure_deployed == false
              and .non_effects.desktop_installed == false
              and .non_effects.hosted_buzz_changed == false
              and .non_effects.production_cutover_authorized == false
            ' "$gate1_receipt" >/dev/null
          jq -e \
            --argjson artifact_id "$EXPECTED_GATE1_ARTIFACT_ID" \
            --argjson run_id "$GATE1_EVIDENCE_RUN_ID" \
            --arg name "$EXPECTED_GATE1_ARTIFACT_NAME" \
            --arg digest "$EXPECTED_GATE1_ARTIFACT_DIGEST" \
            --arg expires_at "$EXPECTED_GATE1_ARTIFACT_EXPIRES_AT" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expires_at == $expires_at
              and .expired == false
              and .workflow_run.id == $run_id
            ' "$authorization/personal-relay-gate1-artifact.json" >/dev/null
          jq -e \
            --argjson run_id "$GATE1_EVIDENCE_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_sha "$EXPECTED_GATE1_WORKFLOW_SHA" '
              .id == $run_id
              and .run_attempt == 1
              and .head_sha == $workflow_sha
              and .head_branch == "main"
              and .repository.full_name == $repository
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/personal-relay-gate1.yml"
            ' "$authorization/personal-relay-gate1-workflow-run.json" >/dev/null
          export DOCKER_CONFIG=/tmp/personal-desktop-attest-gate1-docker-config
          mkdir -p "$DOCKER_CONFIG"
          registry_auth=$(printf '%s' "${GITHUB_ACTOR}:${GH_TOKEN}" | base64 | tr -d '\n')
          jq -n --arg auth "$registry_auth" '{auths: {"ghcr.io": {auth: $auth}}}' \
            > "$DOCKER_CONFIG/config.json"
          gh attestation verify "oci://${EXPECTED_RELAY_IMAGE_REF}" \
            --hostname github.com \
            --bundle "$gate1_bundle" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://github.com/justinharkelroad/buzz/attestations/personal-relay-gate1/v1 \
            --source-digest "$EXPECTED_GATE1_WORKFLOW_SHA" \
            --source-ref refs/heads/main \
            --signer-workflow github.com/justinharkelroad/buzz/.github/workflows/personal-relay-gate1.yml \
            --signer-digest "$EXPECTED_GATE1_WORKFLOW_SHA" \
            --deny-self-hosted-runners \
            --format json > /tmp/personal-desktop-attest-gate1-verification.json
          for verification in \
            "$authorization/personal-relay-gate1-desktop-verification.json" \
            /tmp/personal-desktop-attest-gate1-verification.json; do
            jq -e \
              --arg image "$EXPECTED_RELAY_IMAGE" \
              --arg digest "${EXPECTED_RELAY_DIGEST#sha256:}" \
              --slurpfile receipt "$gate1_receipt" '
                length == 1
                and all(.[].verificationResult.statement;
                  .predicateType == "https://github.com/justinharkelroad/buzz/attestations/personal-relay-gate1/v1"
                  and any(.subject[]?; .name == $image and .digest.sha256 == $digest)
                  and .predicate == $receipt[0]
                )
              ' "$verification" >/dev/null
          done
          rm -f "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG"

          jq -e '
            type == "object"
            and keys == ["deployment_branch_policy", "id", "name", "node_id", "protection_rules"]
            and .name == "personal-staging"
            and (.id | type == "number" and . >= 1 and floor == .)
            and (.node_id | type == "string" and length > 0)
            and .deployment_branch_policy.protected_branches == false
            and .deployment_branch_policy.custom_branch_policies == true
            and ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 0
          ' "$authorization/personal-staging-environment.json" >/dev/null
          jq -e '
            .total_count == 1
            and (.branch_policies | length) == 1
            and (.branch_policies[0] | keys | sort) == ["id", "name", "node_id"]
            and (.branch_policies[0].id | type == "number" and . >= 1 and floor == .)
            and (.branch_policies[0].node_id | type == "string" and length > 0)
            and .branch_policies[0].name == "main"
          ' "$authorization/personal-staging-branch-policies.json" >/dev/null

          jq -e \
            --slurpfile sidecars "$sidecar_manifest" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg workflow_run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg version "$EXPECTED_VERSION" \
            --arg target "$EXPECTED_TARGET" \
            --arg dispatch_confirmation "$EXPECTED_CONFIRMATION" \
            --arg build_contract_sha "$EXPECTED_BUILD_CONTRACT_SHA256" \
            --arg bundle_id "$EXPECTED_BUNDLE_ID" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg relay_https "$EXPECTED_RELAY_HTTPS" \
            --arg relay_wss "$EXPECTED_RELAY_WSS" \
            --argjson authorization_artifact_id "$EXPECTED_AUTHORIZATION_ARTIFACT_ID" \
            --arg authorization_artifact_name "$EXPECTED_AUTHORIZATION_ARTIFACT_NAME" \
            --arg authorization_artifact_digest "$EXPECTED_AUTHORIZATION_ARTIFACT_DIGEST" \
            --arg authorization_artifact_expires_at "$EXPECTED_AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --argjson gate1_run_id "$GATE1_EVIDENCE_RUN_ID" \
            --arg gate1_workflow_sha "$EXPECTED_GATE1_WORKFLOW_SHA" \
            --argjson gate1_artifact_id "$EXPECTED_GATE1_ARTIFACT_ID" \
            --arg gate1_artifact_name "$EXPECTED_GATE1_ARTIFACT_NAME" \
            --arg gate1_artifact_digest "$EXPECTED_GATE1_ARTIFACT_DIGEST" \
            --arg gate1_artifact_expires_at "$EXPECTED_GATE1_ARTIFACT_EXPIRES_AT" \
            --arg gate1_receipt_sha "$EXPECTED_GATE1_RECEIPT_SHA256" \
            --arg gate1_bundle_sha "$EXPECTED_GATE1_ATTESTATION_BUNDLE_SHA256" \
            --arg gate1_eligibility_expires_at "$gate1_eligibility_expires_at" \
            --arg gate1_release_evidence_expires_at "$gate1_release_evidence_expires_at" \
            --arg relay_image "$EXPECTED_RELAY_IMAGE" \
            --arg relay_digest "$EXPECTED_RELAY_DIGEST" \
            --arg relay_image_ref "$EXPECTED_RELAY_IMAGE_REF" \
            --arg staging_receipt_sha "$EXPECTED_STAGING_RECEIPT_SHA256" \
            --arg desktop_main_branch_sha "$desktop_main_branch_sha" \
            --arg desktop_main_rules_sha "$desktop_main_rules_sha" \
            --arg desktop_main_rulesets_sha "$desktop_main_rulesets_sha" \
            --arg gate1_main_branch_sha "$gate1_main_branch_sha" \
            --arg gate1_main_rules_sha "$gate1_main_rules_sha" \
            --arg gate1_main_rulesets_sha "$gate1_main_rulesets_sha" \
            --arg staging_environment_sha "$staging_environment_sha" \
            --arg staging_branch_policies_sha "$staging_branch_policies_sha" \
            --arg staging_run_identity_sha "$staging_run_identity_sha" \
            --arg dmg_sha "$dmg_sha" \
            --arg acp_sha "$acp_sha" \
            --arg sidecar_manifest_sha "$sidecar_manifest_sha" \
            --arg now "$now" '
            (keys | sort) == [
              "actions_evidence_artifacts_published",
              "authorization_artifact", "build_contract_sha256", "bundle_id",
              "buzz_acp_sha256", "channel", "dispatch_confirmation", "dmg_sha256",
              "gate1_artifact", "gate1_attestation_bundle_sha256",
              "gate1_eligibility_expires_at", "gate1_evidence_run_attempt",
              "gate1_evidence_run_id", "gate1_main_protection", "gate1_receipt_sha256",
              "gate1_release_evidence_expires_at", "gate1_workflow_sha", "installed",
              "main_protection", "product_name", "production_eligible",
              "registry_package_published", "relay_digest", "relay_https", "relay_image",
              "relay_image_ref", "relay_pubkey", "relay_wss", "repository",
              "schema", "sidecar_manifest_sha256", "sidecars",
              "smoke_approval_record_sha256", "source_sha", "staging_controls",
              "staging_deployment_evidence_reference", "staging_deployment_receipt_sha256",
              "target", "unsigned", "updater_enabled", "updater_feed_published", "version",
              "workflow_ref", "workflow_run", "workflow_run_attempt", "workflow_sha"
            ]
            and (.main_protection | keys | sort) == [
              "branch", "branch_metadata_sha256", "commit_sha", "effective_rules_sha256",
              "ref_protected", "rulesets_sha256"
            ]
            and (.authorization_artifact | keys | sort) == ["digest", "expires_at", "id", "name"]
            and (.gate1_artifact | keys | sort) == ["digest", "expires_at", "id", "name"]
            and (.gate1_main_protection | keys | sort) == [
              "branch", "branch_metadata_sha256", "commit_sha", "effective_rules_sha256",
              "ref_protected", "rulesets_sha256"
            ]
            and (.staging_controls | keys | sort) == [
              "authorized_owner", "deployment_branch", "deployment_branch_policies_sha256",
              "environment", "environment_configuration_sha256", "run_identity_sha256"
            ]
            and .schema == "personal-desktop-staging/v2"
            and .repository == $repository
            and .source_sha == $source_sha
            and .workflow_ref == $workflow_ref
            and .workflow_sha == $workflow_sha
            and .workflow_run == $workflow_run
            and .workflow_run_attempt == 1
            and .main_protection == {
              branch: "main",
              commit_sha: $workflow_sha,
              ref_protected: true,
              branch_metadata_sha256: $desktop_main_branch_sha,
              effective_rules_sha256: $desktop_main_rules_sha,
              rulesets_sha256: $desktop_main_rulesets_sha
            }
            and .version == $version
            and .channel == "staging-only"
            and .target == $target
            and .dispatch_confirmation == "BUILD_PERSONAL_STAGING_DESKTOP"
            and .dispatch_confirmation == $dispatch_confirmation
            and .build_contract_sha256 == $build_contract_sha
            and .bundle_id == $bundle_id
            and .product_name == $product_name
            and .relay_https == $relay_https
            and .relay_wss == $relay_wss
            and .authorization_artifact == {
              id: $authorization_artifact_id,
              name: $authorization_artifact_name,
              digest: $authorization_artifact_digest,
              expires_at: $authorization_artifact_expires_at
            }
            and .gate1_evidence_run_id == $gate1_run_id
            and .gate1_evidence_run_attempt == 1
            and .gate1_workflow_sha == $gate1_workflow_sha
            and .gate1_artifact == {
              id: $gate1_artifact_id,
              name: $gate1_artifact_name,
              digest: $gate1_artifact_digest,
              expires_at: $gate1_artifact_expires_at
            }
            and .gate1_receipt_sha256 == $gate1_receipt_sha
            and .gate1_attestation_bundle_sha256 == $gate1_bundle_sha
            and .gate1_eligibility_expires_at == $gate1_eligibility_expires_at
            and .gate1_release_evidence_expires_at == $gate1_release_evidence_expires_at
            and .gate1_main_protection == {
              branch: "main",
              commit_sha: $gate1_workflow_sha,
              ref_protected: true,
              branch_metadata_sha256: $gate1_main_branch_sha,
              effective_rules_sha256: $gate1_main_rules_sha,
              rulesets_sha256: $gate1_main_rulesets_sha
            }
            and .relay_image == $relay_image
            and .relay_digest == $relay_digest
            and .relay_image_ref == $relay_image_ref
            and .relay_image_ref == (.relay_image + "@" + .relay_digest)
            and .staging_deployment_receipt_sha256 == $staging_receipt_sha
            and .staging_controls.environment == "personal-staging"
            and .staging_controls.environment_configuration_sha256 == $staging_environment_sha
            and .staging_controls.deployment_branch_policies_sha256 == $staging_branch_policies_sha
            and .staging_controls.run_identity_sha256 == $staging_run_identity_sha
            and .staging_controls.deployment_branch == "main"
            and .staging_controls.authorized_owner.login == "justinharkelroad"
            and .dmg_sha256 == $dmg_sha
            and .buzz_acp_sha256 == $acp_sha
            and .sidecar_manifest_sha256 == $sidecar_manifest_sha
            and .sidecars == $sidecars[0]
            and ([.sidecars.entries[] | select(.name == "buzz-acp") | .source_sha256]
              == [$acp_sha])
            and .unsigned == true
            and .updater_enabled == false
            and .production_eligible == false
            and .installed == false
            and .actions_evidence_artifacts_published == true
            and .registry_package_published == false
            and .updater_feed_published == false
            and (.authorization_artifact.expires_at | fromdateiso8601) > ($now | fromdateiso8601)
            and (.gate1_eligibility_expires_at | fromdateiso8601) > ($now | fromdateiso8601)
            and (.gate1_release_evidence_expires_at | fromdateiso8601) > ($now | fromdateiso8601)
            and (.gate1_artifact.expires_at | fromdateiso8601) > ($now | fromdateiso8601)
          ' "$ledger" >/dev/null || {
            echo "::error::Gate 1 receipt or retained evidence expired before desktop attestation"
            exit 1
          }

          jq -e \
            --arg build_contract_sha "$EXPECTED_BUILD_CONTRACT_SHA256" \
            --arg build_channel "$EXPECTED_BUILD_CHANNEL" \
            --arg deep_link_scheme "$EXPECTED_DEEP_LINK_SCHEME" \
            --slurpfile build_contract "$build_contract" \
            --slurpfile receipt "$staging_receipt" \
            --slurpfile run_identity "$authorization/personal-staging-run-identity.json" '
              .staging_controls.authorized_owner as $owner
              | .schema == "personal-desktop-staging/v2"
              and ($owner | type == "object")
              and (($owner | keys | sort) == ["id", "login", "node_id"])
              and $owner.login == "justinharkelroad"
              and $owner == $run_identity[0].actor
              and $owner == $run_identity[0].triggering_actor
              and $owner == $receipt[0].authorized_by
              and .source_sha == $receipt[0].relay_source_sha
              and .gate1_workflow_sha == $receipt[0].gate1_workflow_sha
              and .gate1_evidence_run_id == $receipt[0].gate1_evidence_run_id
              and .gate1_evidence_run_attempt == $receipt[0].gate1_evidence_run_attempt
              and .gate1_artifact.id == $receipt[0].gate1_evidence_artifact_id
              and .gate1_artifact.name == $receipt[0].gate1_evidence_artifact_name
              and .gate1_artifact.digest == $receipt[0].gate1_evidence_artifact_digest
              and .gate1_artifact.expires_at == $receipt[0].gate1_evidence_expires_at
              and .gate1_receipt_sha256 == $receipt[0].gate1_receipt_sha256
              and .gate1_attestation_bundle_sha256 == $receipt[0].gate1_attestation_bundle_sha256
              and .relay_image_ref == $receipt[0].deployed_relay_image_ref
              and .relay_pubkey == $receipt[0].relay_pubkey
              and .smoke_approval_record_sha256 == $receipt[0].smoke_approval_record_sha256
              and .staging_deployment_evidence_reference == $receipt[0].evidence_reference
              and .build_contract_sha256 == $build_contract_sha
              and .bundle_id == $build_contract[0].bundle_id
              and .product_name == $build_contract[0].product_name
              and .relay_https == $build_contract[0].relay_https
              and .relay_wss == $build_contract[0].relay_wss
              and $build_contract[0].auto_connect_default_relay == true
              and $build_contract[0].build_channel == $build_channel
              and $build_contract[0].deep_link_scheme == $deep_link_scheme
              and .relay_https == $receipt[0].https_origin
              and .relay_wss == $receipt[0].wss_origin
              and .staging_deployment_receipt_sha256 == $build_contract[0].receipt_sha256
            ' "$ledger" >/dev/null || {
              echo "::error::staging authorization is not bound to repository owner justinharkelroad"
              exit 1
            }
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" '
              .id == $run_id
              and .run_attempt == 1
              and .head_branch == "main"
              and .head_sha == $sha
              and .event == "workflow_dispatch"
              and .path == ".github/workflows/personal-desktop-release.yml"
              and .repository.full_name == $repository
              and .actor.login == "justinharkelroad"
              and .triggering_actor.login == "justinharkelroad"
              and .actor == .triggering_actor
            ' "$authorization/personal-staging-run-identity.json" >/dev/null
          echo "acp_path=$acp" >> "$GITHUB_OUTPUT"
          echo "ledger_path=$ledger" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "sha256=$dmg_sha" >> "$GITHUB_OUTPUT"

      - name: Validate immutable pre-scan mounted-volume evidence
        id: volume-evidence
        working-directory: verifier
        env:
          BASH_ENV: ""
          ENV: ""
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          EXPECTED_BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          EXPECTED_VOLUME_RECORD_SHA256: ${{ needs.inspect.outputs.volume_record_sha256 }}
          LEDGER_PATH: ${{ steps.dmg.outputs.ledger_path }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          root=/tmp/personal-desktop-mounted-volume
          record="$root/personal-desktop-mounted-volume-record.json"
          attach_layout="$root/personal-desktop-dmg-attach-layout.json"
          inventory="$root/personal-desktop-mounted-volume-inventory.json"
          projection_manifest="$root/personal-desktop-volume-projection-manifest.json"
          sidecar_manifest="$root/personal-desktop-mounted-sidecars.json"
          projection="$root/projection"
          expected_names=$(printf '%s\n' \
            personal-desktop-dmg-attach-layout.json \
            personal-desktop-mounted-sidecars.json \
            personal-desktop-mounted-volume-inventory.json \
            personal-desktop-mounted-volume-record.json \
            personal-desktop-volume-projection-manifest.json \
            projection)
          observed_names=$(find "$root" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
          [[ "$observed_names" == "$expected_names" ]]
          [[ -d "$projection" && ! -L "$projection" ]]
          [[ -z "$(find "$root" -type l -print -quit)" ]]
          [[ -z "$(find "$root" -mindepth 1 ! -type d ! -type f -print -quit)" ]]
          for evidence in "$record" "$attach_layout" "$inventory" "$projection_manifest" "$sidecar_manifest"; do
            [[ -s "$evidence" && ! -L "$evidence" ]]
            jq -e -s 'length == 1' "$evidence" >/dev/null
          done
          record_sha=$(shasum -a 256 "$record" | awk '{print $1}')
          attach_layout_sha=$(shasum -a 256 "$attach_layout" | awk '{print $1}')
          inventory_sha=$(shasum -a 256 "$inventory" | awk '{print $1}')
          projection_manifest_sha=$(shasum -a 256 "$projection_manifest" | awk '{print $1}')
          sidecar_manifest_sha=$(shasum -a 256 "$sidecar_manifest" | awk '{print $1}')
          ledger_sha=$(shasum -a 256 "$LEDGER_PATH" | awk '{print $1}')
          [[ "$(jq -r .schema "$LEDGER_PATH")" == "personal-desktop-staging/v2" ]]
          [[ "$record_sha" == "$EXPECTED_VOLUME_RECORD_SHA256" ]]
          [[ "$sidecar_manifest_sha" == "$(jq -r .sidecar_manifest_sha256 "$LEDGER_PATH")" ]]
          cmp -s "$sidecar_manifest" /tmp/personal-desktop-staging/personal-desktop-sidecars.json

          actual_ndjson=$(mktemp /tmp/personal-desktop-attest-volume-actual.XXXXXX)
          actual_manifest=$(mktemp /tmp/personal-desktop-attest-volume-manifest.XXXXXX)
          trap 'rm -f "$actual_ndjson" "$actual_manifest"' EXIT
          : > "$actual_ndjson"
          while IFS= read -r -d '' projected_file; do
            relative=${projected_file#"$projection"/}
            [[ -n "$relative" && "$relative" != /* && "$relative" != *$'\n'* && "$relative" != *$'\r'* ]]
            size=$(stat -f '%z' "$projected_file")
            sha=$(shasum -a 256 "$projected_file" | awk '{print $1}')
            jq -cn --arg path "$relative" --arg sha256 "$sha" --argjson size "$size" \
              '{path: $path, size: $size, sha256: $sha256}' >> "$actual_ndjson"
          done < <(find "$projection" -type f -print0)
          jq -sS 'sort_by(.path)' "$actual_ndjson" > "$actual_manifest"
          cmp -s "$actual_manifest" "$projection_manifest"
          jq -S '[.[] | select(.type == "file") | {path, size, sha256}] | sort_by(.path)' \
            "$inventory" > /tmp/personal-desktop-attest-volume-inventory-files.json
          cmp -s /tmp/personal-desktop-attest-volume-inventory-files.json "$projection_manifest"

          minimum_valid_until=$(( $(date -u '+%s') + 2100 ))
          [[ "$(date -juf '%Y-%m-%dT%H:%M:%SZ' "$EXPECTED_VOLUME_ARTIFACT_EXPIRES_AT" '+%s')" -gt "$minimum_valid_until" ]]
          jq -e \
            --argjson artifact_id "$EXPECTED_ARTIFACT_ID" \
            --arg artifact_name "$EXPECTED_ARTIFACT_NAME" \
            --arg artifact_digest "$EXPECTED_ARTIFACT_DIGEST" \
            --arg artifact_expires_at "$EXPECTED_ARTIFACT_EXPIRES_AT" \
            --arg bundle_id "$EXPECTED_BUNDLE_ID" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg target "$EXPECTED_TARGET" \
            --arg version "$EXPECTED_VERSION" \
            --arg dmg_name "${{ steps.dmg.outputs.name }}" \
            --arg dmg_sha256 "${{ steps.dmg.outputs.sha256 }}" \
            --arg ledger_sha256 "$ledger_sha" \
            --arg acp_sha256 "$(jq -r .buzz_acp_sha256 "$LEDGER_PATH")" \
            --arg sidecar_manifest_sha256 "$sidecar_manifest_sha" \
            --arg attach_layout_sha256 "$attach_layout_sha" \
            --arg inventory_sha256 "$inventory_sha" \
            --arg projection_manifest_sha256 "$projection_manifest_sha" \
            --argjson run_id "$GITHUB_RUN_ID" '
              .schema == "personal-desktop-mounted-volume/v1"
              and .repository == "justinharkelroad/buzz"
              and .workflow_sha == env.GITHUB_SHA
              and .workflow_ref == env.GITHUB_WORKFLOW_REF
              and .workflow_run_id == $run_id
              and .workflow_run_attempt == 1
              and .source_sha == $source_sha
              and .target == $target
              and .version == $version
              and .bundle_id == $bundle_id
              and .product_name == $product_name
              and .candidate_artifact == {
                id: $artifact_id, name: $artifact_name,
                digest: $artifact_digest, expires_at: $artifact_expires_at
              }
              and .candidate == {
                dmg_name: $dmg_name, dmg_sha256: $dmg_sha256,
                ledger_sha256: $ledger_sha256, buzz_acp_sha256: $acp_sha256,
                sidecar_manifest_sha256: $sidecar_manifest_sha256
              }
              and .mounted_volume.attach_layout_sha256 == $attach_layout_sha256
              and .mounted_volume.inventory_sha256 == $inventory_sha256
              and .mounted_volume.projection_manifest_sha256 == $projection_manifest_sha256
              and .mounted_volume.sidecar_manifest_sha256 == $sidecar_manifest_sha256
              and .mounted_volume.embedded_buzz_acp_sha256 == $acp_sha256
              and (.mounted_volume.main_executable_sha256 | test("^[0-9a-f]{64}$"))
              and .mounted_volume.root_layout == [
                ".DS_Store", ".VolumeIcon.icns", ".background",
                "Applications", ($product_name + ".app")
              ]
            ' "$record" >/dev/null
          {
            echo "attach_layout_sha256=$attach_layout_sha"
            echo "inventory_sha256=$inventory_sha"
            echo "projection_manifest_sha256=$projection_manifest_sha"
            echo "record_sha256=$record_sha"
            echo "sidecar_manifest_sha256=$sidecar_manifest_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Validate exact no-OIDC desktop inspection evidence
        id: inspection
        working-directory: verifier
        env:
          BASH_ENV: ""
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          ENV: ""
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          EXPECTED_AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.build.outputs.authorization_artifact_digest }}
          EXPECTED_AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.authorization_artifact_expires_at }}
          EXPECTED_AUTHORIZATION_ARTIFACT_ID: ${{ needs.build.outputs.authorization_artifact_id }}
          EXPECTED_AUTHORIZATION_ARTIFACT_NAME: ${{ needs.build.outputs.authorization_artifact_name }}
          EXPECTED_BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          EXPECTED_INSPECTION_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.artifact_digest }}
          EXPECTED_INSPECTION_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.artifact_expires_at }}
          EXPECTED_INSPECTION_ARTIFACT_ID: ${{ needs.inspect.outputs.artifact_id }}
          EXPECTED_INSPECTION_ARTIFACT_NAME: ${{ needs.inspect.outputs.artifact_name }}
          EXPECTED_INSPECTION_INVENTORY_SHA256: ${{ needs.inspect.outputs.inventory_sha256 }}
          EXPECTED_INSPECTION_RECEIPT_SHA256: ${{ needs.inspect.outputs.receipt_sha256 }}
          EXPECTED_INSPECTION_STAGING_SCAN_SHA256: ${{ needs.inspect.outputs.staging_scan_sha256 }}
          EXPECTED_INSPECTION_VOLUME_SCAN_SHA256: ${{ needs.inspect.outputs.volume_scan_sha256 }}
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          EXPECTED_VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          EXPECTED_VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          EXPECTED_VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
          LEDGER_PATH: ${{ steps.dmg.outputs.ledger_path }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          STAGED_ACP_PATH: ${{ steps.dmg.outputs.acp_path }}
        run: |
          set -euo pipefail
          inspection=/tmp/personal-desktop-inspection
          receipt="$inspection/personal-desktop-inspection-receipt.json"
          inventory="$inspection/personal-desktop-mounted-volume-inventory.json"
          staging_report="$inspection/personal-desktop-inspection-staging-secret.json"
          volume_report="$inspection/personal-desktop-inspection-volume-secret.json"
          [[ "$(find "$inspection" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 4 ]]
          [[ -z "$(find "$inspection" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          for input in "$receipt" "$inventory" "$staging_report" "$volume_report"; do
            [[ -s "$input" && ! -L "$input" ]]
            jq -e -s 'length == 1' "$input" >/dev/null
          done

          receipt_sha=$(shasum -a 256 "$receipt" | awk '{print $1}')
          inventory_sha=$(shasum -a 256 "$inventory" | awk '{print $1}')
          staging_scan_sha=$(shasum -a 256 "$staging_report" | awk '{print $1}')
          volume_scan_sha=$(shasum -a 256 "$volume_report" | awk '{print $1}')
          staging_scan_artifact=$(jq -r .ArtifactName "$staging_report")
          volume_scan_artifact=$(jq -r .ArtifactName "$volume_report")
          [[ "$receipt_sha" == "$EXPECTED_INSPECTION_RECEIPT_SHA256" ]]
          [[ "$inventory_sha" == "$EXPECTED_INSPECTION_INVENTORY_SHA256" ]]
          [[ "$staging_scan_sha" == "$EXPECTED_INSPECTION_STAGING_SCAN_SHA256" ]]
          [[ "$volume_scan_sha" == "$EXPECTED_INSPECTION_VOLUME_SCAN_SHA256" ]]

          dmg_sha=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          ledger_sha=$(shasum -a 256 "$LEDGER_PATH" | awk '{print $1}')
          acp_sha=$(shasum -a 256 "$STAGED_ACP_PATH" | awk '{print $1}')
          [[ "$(jq -r .schema "$LEDGER_PATH")" == "personal-desktop-staging/v2" ]]
          sidecar_manifest_sha=$(jq -r .sidecar_manifest_sha256 "$LEDGER_PATH")
          minimum_valid_until=$(( $(date -u '+%s') + 2100 ))
          jq -e \
            --argjson artifact_id "$EXPECTED_ARTIFACT_ID" \
            --arg artifact_name "$EXPECTED_ARTIFACT_NAME" \
            --arg artifact_digest "$EXPECTED_ARTIFACT_DIGEST" \
            --arg artifact_expires_at "$EXPECTED_ARTIFACT_EXPIRES_AT" \
            --argjson authorization_artifact_id "$EXPECTED_AUTHORIZATION_ARTIFACT_ID" \
            --arg authorization_artifact_name "$EXPECTED_AUTHORIZATION_ARTIFACT_NAME" \
            --arg authorization_artifact_digest "$EXPECTED_AUTHORIZATION_ARTIFACT_DIGEST" \
            --arg authorization_artifact_expires_at "$EXPECTED_AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --arg bundle_id "$EXPECTED_BUNDLE_ID" \
            --arg dmg_name "$(basename "$DMG_PATH")" \
            --arg dmg_sha256 "$dmg_sha" \
            --arg ledger_sha256 "$ledger_sha" \
            --arg acp_sha256 "$acp_sha" \
            --arg sidecar_manifest_sha256 "$sidecar_manifest_sha" \
            --arg inventory_sha256 "$inventory_sha" \
            --arg attach_layout_sha256 "${{ steps.volume-evidence.outputs.attach_layout_sha256 }}" \
            --arg projection_manifest_sha256 "${{ steps.volume-evidence.outputs.projection_manifest_sha256 }}" \
            --arg record_sha256 "${{ steps.volume-evidence.outputs.record_sha256 }}" \
            --arg mounted_sidecar_manifest_sha256 "${{ steps.volume-evidence.outputs.sidecar_manifest_sha256 }}" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg staging_scan_sha256 "$staging_scan_sha" \
            --arg staging_scan_artifact "$staging_scan_artifact" \
            --arg target "$EXPECTED_TARGET" \
            --arg version "$EXPECTED_VERSION" \
            --arg volume_scan_sha256 "$volume_scan_sha" \
            --arg volume_scan_artifact "$volume_scan_artifact" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_SHA" \
            --argjson volume_artifact_id "$EXPECTED_VOLUME_ARTIFACT_ID" \
            --arg volume_artifact_name "$EXPECTED_VOLUME_ARTIFACT_NAME" \
            --arg volume_artifact_digest "$EXPECTED_VOLUME_ARTIFACT_DIGEST" \
            --arg volume_artifact_expires_at "$EXPECTED_VOLUME_ARTIFACT_EXPIRES_AT" \
            --argjson minimum_valid_until "$minimum_valid_until" \
            --argjson run_id "$GITHUB_RUN_ID" '
              (keys | sort) == [
                "authorization_artifact", "bundle_id", "candidate", "candidate_artifact",
                "inspected_at", "mounted_volume", "mounted_volume_artifact",
                "product_name", "repository", "scans",
                "schema", "source_sha", "target", "version", "workflow_ref",
                "workflow_run_attempt", "workflow_run_id", "workflow_sha"
              ]
              and .schema == "personal-desktop-staging-inspection/v1"
              and .repository == "justinharkelroad/buzz"
              and .workflow_sha == $workflow_sha
              and .workflow_ref == $workflow_ref
              and .workflow_run_id == $run_id
              and .workflow_run_attempt == 1
              and .source_sha == $source_sha
              and .target == $target
              and .version == $version
              and .bundle_id == $bundle_id
              and .product_name == $product_name
              and (.inspected_at | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%SZ")) == .inspected_at
              and (.inspected_at | fromdateiso8601) <= now
              and .candidate_artifact == {
                id: $artifact_id,
                name: $artifact_name,
                digest: $artifact_digest,
                expires_at: $artifact_expires_at
              }
              and .authorization_artifact == {
                id: $authorization_artifact_id,
                name: $authorization_artifact_name,
                digest: $authorization_artifact_digest,
                expires_at: $authorization_artifact_expires_at
              }
              and .mounted_volume_artifact == {
                id: $volume_artifact_id,
                name: $volume_artifact_name,
                digest: $volume_artifact_digest,
                expires_at: $volume_artifact_expires_at
              }
              and (.candidate_artifact.expires_at | fromdateiso8601) > $minimum_valid_until
              and (.authorization_artifact.expires_at | fromdateiso8601) > $minimum_valid_until
              and (.mounted_volume_artifact.expires_at | fromdateiso8601) > $minimum_valid_until
              and .candidate == {
                dmg_name: $dmg_name,
                dmg_sha256: $dmg_sha256,
                ledger_sha256: $ledger_sha256,
                buzz_acp_sha256: $acp_sha256,
                sidecar_manifest_sha256: $sidecar_manifest_sha256
              }
              and .mounted_volume.root_layout == [
                ".DS_Store", ".VolumeIcon.icns", ".background",
                "Applications", ($product_name + ".app")
              ]
              and .mounted_volume.inventory_sha256 == $inventory_sha256
              and .mounted_volume.attach_layout_sha256 == $attach_layout_sha256
              and .mounted_volume.projection_manifest_sha256 == $projection_manifest_sha256
              and .mounted_volume.record_sha256 == $record_sha256
              and .mounted_volume.sidecar_manifest_sha256 == $mounted_sidecar_manifest_sha256
              and .mounted_volume.embedded_buzz_acp_sha256 == $acp_sha256
              and .mounted_volume.sidecar_manifest_sha256 == $sidecar_manifest_sha256
              and (.mounted_volume.main_executable_sha256 | test("^[0-9a-f]{64}$"))
              and .scans == {
                downloaded_artifact: {
                  artifact_name: $staging_scan_artifact,
                  trivy_version: "0.70.0",
                  report_sha256: $staging_scan_sha256
                },
                full_volume_projection: {
                  artifact_name: $volume_scan_artifact,
                  trivy_version: "0.70.0",
                  report_sha256: $volume_scan_sha256
                }
              }
            ' "$receipt" >/dev/null

          jq -e --arg app "$EXPECTED_PRODUCT_NAME.app" '
            ([.[] | select((.path | contains("/")) | not) | {
              path, type, target: (.target // null)
            }]) == [
              {path: ".DS_Store", type: "file", target: null},
              {path: ".VolumeIcon.icns", type: "file", target: null},
              {path: ".background", type: "directory", target: null},
              {path: "Applications", type: "symlink", target: "/Applications"},
              {path: $app, type: "directory", target: null}
            ]
            and ([.[] | select(.path == ".background" or (.path | startswith(".background/"))) | {
              path, type
            }]) == [
              {path: ".background", type: "directory"},
              {path: ".background/dmg-background.png", type: "file"}
            ]
            and all(.[];
              if .type == "file" then
                (keys | sort) == ["path", "sha256", "size", "type"]
                and (.sha256 | test("^[0-9a-f]{64}$"))
                and (.size | type == "number" and . >= 0 and floor == .)
              elif .type == "directory" then
                (keys | sort) == ["path", "type"]
              elif .type == "symlink" and .path == "Applications" then
                (keys | sort) == ["path", "target", "type"] and .target == "/Applications"
              elif .type == "symlink" then
                (keys | sort) == ["path", "resolved_path", "target", "type"]
                and (.target | startswith("/") | not)
                and (.resolved_path | type == "string" and length > 0)
              else false end
            )
          ' "$inventory" >/dev/null
          jq -e '
            .SchemaVersion == 2
            and .ArtifactType == "filesystem"
            and .ArtifactName == "/tmp/personal-desktop-inspect-staging"
            and .Trivy.Version == "0.70.0"
            and ([.Results[]? | .Secrets[]?] | length) == 0
          ' "$staging_report" >/dev/null
          jq -e '
            .SchemaVersion == 2
            and .ArtifactType == "filesystem"
            and (.ArtifactName | test("^/tmp/personal-desktop-mounted-volume-evidence\\.[A-Za-z0-9]+/projection$"))
            and .Trivy.Version == "0.70.0"
            and ([.Results[]? | .Secrets[]?] | length) == 0
          ' "$volume_report" >/dev/null
          jq -e \
            --argjson artifact_id "$EXPECTED_INSPECTION_ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg name "$EXPECTED_INSPECTION_ARTIFACT_NAME" \
            --arg digest "$EXPECTED_INSPECTION_ARTIFACT_DIGEST" \
            --arg expires_at "$EXPECTED_INSPECTION_ARTIFACT_EXPIRES_AT" \
            --argjson minimum_valid_until "$minimum_valid_until" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expires_at == $expires_at
              and .expired == false
              and .workflow_run.id == $run_id
              and (.expires_at | fromdateiso8601) > $minimum_valid_until
            ' /tmp/personal-desktop-inspection-artifact.json >/dev/null
          {
            echo "inventory_sha256=$inventory_sha"
            echo "receipt=$receipt"
            echo "receipt_sha256=$receipt_sha"
            echo "staging_scan_sha256=$staging_scan_sha"
            echo "volume_scan_sha256=$volume_scan_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Validate independent fresh-remount receipt
        id: remount-evidence
        working-directory: verifier
        env:
          BASH_ENV: ""
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ENV: ""
          EXPECTED_PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.remount.outputs.receipt_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          REMOUNT_ARTIFACT_DIGEST: ${{ needs.remount.outputs.artifact_digest }}
          REMOUNT_ARTIFACT_EXPIRES_AT: ${{ needs.remount.outputs.artifact_expires_at }}
          REMOUNT_ARTIFACT_ID: ${{ needs.remount.outputs.artifact_id }}
          REMOUNT_ARTIFACT_NAME: ${{ needs.remount.outputs.artifact_name }}
          VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
        run: |
          set -euo pipefail
          root=/tmp/personal-desktop-independent-remount
          receipt="$root/personal-desktop-independent-remount-receipt.json"
          [[ "$(find "$root" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 1 ]]
          [[ -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          [[ -s "$receipt" && ! -L "$receipt" ]]
          jq -e -s 'length == 1' "$receipt" >/dev/null
          receipt_sha=$(shasum -a 256 "$receipt" | awk '{print $1}')
          [[ "$receipt_sha" == "$EXPECTED_RECEIPT_SHA256" ]]
          ledger="${{ steps.dmg.outputs.ledger_path }}"
          sidecars=/tmp/personal-desktop-staging/personal-desktop-sidecars.json
          record=/tmp/personal-desktop-mounted-volume/personal-desktop-mounted-volume-record.json
          [[ "$(jq -r .schema "$ledger")" == "personal-desktop-staging/v2" ]]
          ledger_sha=$(shasum -a 256 "$ledger" | awk '{print $1}')
          sidecar_manifest_sha=$(shasum -a 256 "$sidecars" | awk '{print $1}')
          record_sha=$(shasum -a 256 "$record" | awk '{print $1}')
          jq -e \
            --argjson candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidate_artifact_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg candidate_artifact_expires_at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --argjson volume_artifact_id "$VOLUME_ARTIFACT_ID" \
            --arg volume_artifact_name "$VOLUME_ARTIFACT_NAME" \
            --arg volume_artifact_digest "$VOLUME_ARTIFACT_DIGEST" \
            --arg volume_artifact_expires_at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg target "$EXPECTED_TARGET" \
            --arg version "$EXPECTED_VERSION" \
            --arg product_name "$EXPECTED_PRODUCT_NAME" \
            --arg dmg_name "${{ steps.dmg.outputs.name }}" \
            --arg dmg_sha "${{ steps.dmg.outputs.sha256 }}" \
            --arg ledger_sha "$ledger_sha" \
            --arg sidecar_manifest_sha "$sidecar_manifest_sha" \
            --arg record_sha "$record_sha" \
            --arg attach_layout_sha "${{ steps.volume-evidence.outputs.attach_layout_sha256 }}" \
            --arg inventory_sha "${{ steps.volume-evidence.outputs.inventory_sha256 }}" \
            --arg projection_manifest_sha "${{ steps.volume-evidence.outputs.projection_manifest_sha256 }}" \
            --arg mounted_sidecar_manifest_sha "${{ steps.volume-evidence.outputs.sidecar_manifest_sha256 }}" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --slurpfile record "$record" '
              (keys | sort) == [
                "candidate", "candidate_artifact", "mounted_volume",
                "mounted_volume_artifact", "product_name", "remounted_at",
                "repository", "schema", "source_sha", "target", "verification",
                "version", "workflow_ref", "workflow_run_attempt",
                "workflow_run_id", "workflow_sha"
              ]
              and .schema == "personal-desktop-independent-remount/v1"
              and .repository == "justinharkelroad/buzz"
              and .workflow_sha == $workflow_sha
              and .workflow_ref == $workflow_ref
              and .workflow_run_id == $run_id
              and .workflow_run_attempt == 1
              and .source_sha == $source_sha
              and .target == $target
              and .version == $version
              and .product_name == $product_name
              and (.remounted_at | fromdateiso8601) <= now
              and .candidate_artifact == {
                id: $candidate_artifact_id, name: $candidate_artifact_name,
                digest: $candidate_artifact_digest, expires_at: $candidate_artifact_expires_at
              }
              and .mounted_volume_artifact == {
                id: $volume_artifact_id, name: $volume_artifact_name,
                digest: $volume_artifact_digest, expires_at: $volume_artifact_expires_at
              }
              and .candidate == {
                dmg_name: $dmg_name, dmg_sha256: $dmg_sha,
                ledger_sha256: $ledger_sha,
                sidecar_manifest_sha256: $sidecar_manifest_sha
              }
              and .mounted_volume == {
                record_sha256: $record_sha,
                attach_layout_sha256: $attach_layout_sha,
                inventory_sha256: $inventory_sha,
                projection_manifest_sha256: $projection_manifest_sha,
                sidecar_manifest_sha256: $mounted_sidecar_manifest_sha,
                main_executable_sha256: $record[0].mounted_volume.main_executable_sha256
              }
              and .verification == {
                fresh_runner: true, mounted_read_only: true, mounted_nobrowse: true,
                inventory_equal: true, projection_hashes_equal: true,
                sidecars_equal: true, candidate_executed: false
              }
            ' "$receipt" >/dev/null
          minimum_valid_until=$(( $(date -u '+%s') + 2100 ))
          [[ "$(date -juf '%Y-%m-%dT%H:%M:%SZ' "$REMOUNT_ARTIFACT_EXPIRES_AT" '+%s')" -gt "$minimum_valid_until" ]]
          jq -e \
            --argjson artifact_id "$REMOUNT_ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg name "$REMOUNT_ARTIFACT_NAME" \
            --arg digest "$REMOUNT_ARTIFACT_DIGEST" \
            --arg expires_at "$REMOUNT_ARTIFACT_EXPIRES_AT" \
            --argjson minimum_valid_until "$minimum_valid_until" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expires_at == $expires_at
              and .expired == false
              and .workflow_run.id == $run_id
              and (.expires_at | fromdateiso8601) > $minimum_valid_until
            ' /tmp/personal-desktop-independent-remount-artifact.json >/dev/null
          {
            echo "receipt=$receipt"
            echo "receipt_sha256=$receipt_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Create exact sealed desktop attestation predicate
        working-directory: verifier
        env:
          BASH_ENV: ""
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
          DMG_SHA256: ${{ steps.dmg.outputs.sha256 }}
          ENV: ""
          INSPECTION_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.artifact_digest }}
          INSPECTION_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.artifact_expires_at }}
          INSPECTION_ARTIFACT_ID: ${{ needs.inspect.outputs.artifact_id }}
          INSPECTION_ARTIFACT_NAME: ${{ needs.inspect.outputs.artifact_name }}
          INSPECTION_INVENTORY_SHA256: ${{ steps.inspection.outputs.inventory_sha256 }}
          INSPECTION_RECEIPT_SHA256: ${{ steps.inspection.outputs.receipt_sha256 }}
          INSPECTION_STAGING_SCAN_SHA256: ${{ steps.inspection.outputs.staging_scan_sha256 }}
          INSPECTION_VOLUME_SCAN_SHA256: ${{ steps.inspection.outputs.volume_scan_sha256 }}
          LEDGER_PATH: ${{ steps.dmg.outputs.ledger_path }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          REMOUNT_ARTIFACT_DIGEST: ${{ needs.remount.outputs.artifact_digest }}
          REMOUNT_ARTIFACT_EXPIRES_AT: ${{ needs.remount.outputs.artifact_expires_at }}
          REMOUNT_ARTIFACT_ID: ${{ needs.remount.outputs.artifact_id }}
          REMOUNT_ARTIFACT_NAME: ${{ needs.remount.outputs.artifact_name }}
          REMOUNT_RECEIPT_SHA256: ${{ steps.remount-evidence.outputs.receipt_sha256 }}
          TARGET: ${{ needs.build.outputs.target }}
          VERSION: ${{ inputs.version }}
          VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
        run: |
          set -euo pipefail
          predicate=/tmp/personal-desktop-staging-attestation-predicate.json
          [[ -f "$LEDGER_PATH" && ! -L "$LEDGER_PATH" ]]
          [[ ! -e "$predicate" && ! -L "$predicate" ]]
          case "$TARGET" in
            aarch64-apple-darwin) dmg_arch=aarch64 ;;
            x86_64-apple-darwin) dmg_arch=x64 ;;
            *) echo "::error::unsupported desktop target"; exit 1 ;;
          esac
          [[ "$DMG_NAME" == "${PRODUCT_NAME}_${VERSION}_${dmg_arch}.dmg" ]]
          [[ "$DMG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(jq -r .schema "$LEDGER_PATH")" == "personal-desktop-staging/v2" ]]
          ledger_sha256=$(shasum -a 256 "$LEDGER_PATH" | awk '{print $1}')
          umask 077
          jq -nS \
            --arg dmg_name "$DMG_NAME" \
            --arg dmg_sha256 "$DMG_SHA256" \
            --argjson candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidate_artifact_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg candidate_artifact_expires_at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --arg ledger_sha256 "$ledger_sha256" \
            --argjson inspection_artifact_id "$INSPECTION_ARTIFACT_ID" \
            --arg inspection_artifact_name "$INSPECTION_ARTIFACT_NAME" \
            --arg inspection_artifact_digest "$INSPECTION_ARTIFACT_DIGEST" \
            --arg inspection_artifact_expires_at "$INSPECTION_ARTIFACT_EXPIRES_AT" \
            --arg inspection_inventory_sha256 "$INSPECTION_INVENTORY_SHA256" \
            --arg inspection_receipt_sha256 "$INSPECTION_RECEIPT_SHA256" \
            --arg inspection_staging_scan_sha256 "$INSPECTION_STAGING_SCAN_SHA256" \
            --arg inspection_volume_scan_sha256 "$INSPECTION_VOLUME_SCAN_SHA256" \
            --argjson volume_artifact_id "$VOLUME_ARTIFACT_ID" \
            --arg volume_artifact_name "$VOLUME_ARTIFACT_NAME" \
            --arg volume_artifact_digest "$VOLUME_ARTIFACT_DIGEST" \
            --arg volume_artifact_expires_at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --arg volume_record_sha256 "${{ steps.volume-evidence.outputs.record_sha256 }}" \
            --arg volume_attach_layout_sha256 "${{ steps.volume-evidence.outputs.attach_layout_sha256 }}" \
            --arg volume_projection_manifest_sha256 "${{ steps.volume-evidence.outputs.projection_manifest_sha256 }}" \
            --arg volume_sidecar_manifest_sha256 "${{ steps.volume-evidence.outputs.sidecar_manifest_sha256 }}" \
            --argjson remount_artifact_id "$REMOUNT_ARTIFACT_ID" \
            --arg remount_artifact_name "$REMOUNT_ARTIFACT_NAME" \
            --arg remount_artifact_digest "$REMOUNT_ARTIFACT_DIGEST" \
            --arg remount_artifact_expires_at "$REMOUNT_ARTIFACT_EXPIRES_AT" \
            --arg remount_receipt_sha256 "$REMOUNT_RECEIPT_SHA256" \
            --slurpfile ledger "$LEDGER_PATH" '
              $ledger[0] as $sealed
              | {
                  schema: "personal-desktop-staging-attestation/v2",
                  repository: $sealed.repository,
                  source_sha: $sealed.source_sha,
                  ledger_sha256: $ledger_sha256,
                  ledger: $sealed,
                  verifier: {
                    sha: $sealed.workflow_sha,
                    ref: "refs/heads/main",
                    workflow_ref: $sealed.workflow_ref
                  },
                  subject: {
                    name: $dmg_name,
                    digest: {sha256: $dmg_sha256}
                  },
                  candidate_artifact: {
                    id: $candidate_artifact_id,
                    name: $candidate_artifact_name,
                    digest: $candidate_artifact_digest,
                    expires_at: $candidate_artifact_expires_at
                  },
                  build_contract_sha256: $sealed.build_contract_sha256,
                  desktop: {
                    target: $sealed.target,
                    version: $sealed.version,
                    bundle_id: $sealed.bundle_id,
                    product_name: $sealed.product_name,
                    buzz_acp_sha256: $sealed.buzz_acp_sha256,
                    sidecars: {
                      manifest_sha256: $sealed.sidecar_manifest_sha256,
                      manifest: $sealed.sidecars
                    }
                  },
                  relay: {
                    image: $sealed.relay_image,
                    digest: $sealed.relay_digest,
                    image_ref: $sealed.relay_image_ref,
                    https: $sealed.relay_https,
                    wss: $sealed.relay_wss,
                    pubkey: $sealed.relay_pubkey
                  },
                  staging: {
                    deployment_receipt_sha256: $sealed.staging_deployment_receipt_sha256,
                    deployment_evidence_reference: $sealed.staging_deployment_evidence_reference,
                    smoke_approval_record_sha256: $sealed.smoke_approval_record_sha256,
                    controls: {
                      environment: $sealed.staging_controls.environment,
                      environment_configuration_sha256: $sealed.staging_controls.environment_configuration_sha256,
                      deployment_branch_policies_sha256: $sealed.staging_controls.deployment_branch_policies_sha256,
                      run_identity_sha256: $sealed.staging_controls.run_identity_sha256,
                      deployment_branch: $sealed.staging_controls.deployment_branch,
                      authorized_owner: $sealed.staging_controls.authorized_owner
                    }
                  },
                  safety: {
                    channel: $sealed.channel,
                    unsigned: $sealed.unsigned,
                    updater_enabled: $sealed.updater_enabled,
                    production_eligible: $sealed.production_eligible,
                    installed: $sealed.installed,
                    actions_evidence_artifacts_published: $sealed.actions_evidence_artifacts_published,
                    registry_package_published: $sealed.registry_package_published,
                    updater_feed_published: $sealed.updater_feed_published
                  },
                  authorization_artifact: $sealed.authorization_artifact,
                  inspection: {
                    artifact: {
                      id: $inspection_artifact_id,
                      name: $inspection_artifact_name,
                      digest: $inspection_artifact_digest,
                      expires_at: $inspection_artifact_expires_at
                    },
                    mounted_volume_artifact: {
                      id: $volume_artifact_id,
                      name: $volume_artifact_name,
                      digest: $volume_artifact_digest,
                      expires_at: $volume_artifact_expires_at
                    },
                    mounted_volume_record_sha256: $volume_record_sha256,
                    mounted_volume_attach_layout_sha256: $volume_attach_layout_sha256,
                    mounted_volume_projection_manifest_sha256: $volume_projection_manifest_sha256,
                    mounted_volume_sidecar_manifest_sha256: $volume_sidecar_manifest_sha256,
                    receipt_sha256: $inspection_receipt_sha256,
                    mounted_volume_inventory_sha256: $inspection_inventory_sha256,
                    downloaded_artifact_scan_sha256: $inspection_staging_scan_sha256,
                    full_volume_projection_scan_sha256: $inspection_volume_scan_sha256
                  },
                  remount: {
                    artifact: {
                      id: $remount_artifact_id,
                      name: $remount_artifact_name,
                      digest: $remount_artifact_digest,
                      expires_at: $remount_artifact_expires_at
                    },
                    receipt_sha256: $remount_receipt_sha256,
                    fresh_runner: true,
                    mounted_read_only: true,
                    candidate_executed: false
                  },
                  gate1: {
                    workflow_sha: $sealed.gate1_workflow_sha,
                    evidence_run_id: $sealed.gate1_evidence_run_id,
                    evidence_run_attempt: $sealed.gate1_evidence_run_attempt,
                    artifact: $sealed.gate1_artifact,
                    receipt_sha256: $sealed.gate1_receipt_sha256,
                    attestation_bundle_sha256: $sealed.gate1_attestation_bundle_sha256,
                    eligibility_expires_at: $sealed.gate1_eligibility_expires_at,
                    release_evidence_expires_at: $sealed.gate1_release_evidence_expires_at
                  }
                }
            ' > "$predicate"
          jq -e \
            --arg dmg_name "$DMG_NAME" \
            --arg dmg_sha256 "$DMG_SHA256" \
            --argjson candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidate_artifact_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg candidate_artifact_expires_at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --arg ledger_sha256 "$ledger_sha256" \
            --argjson inspection_artifact_id "$INSPECTION_ARTIFACT_ID" \
            --arg inspection_artifact_name "$INSPECTION_ARTIFACT_NAME" \
            --arg inspection_artifact_digest "$INSPECTION_ARTIFACT_DIGEST" \
            --arg inspection_artifact_expires_at "$INSPECTION_ARTIFACT_EXPIRES_AT" \
            --arg inspection_inventory_sha256 "$INSPECTION_INVENTORY_SHA256" \
            --arg inspection_receipt_sha256 "$INSPECTION_RECEIPT_SHA256" \
            --arg inspection_staging_scan_sha256 "$INSPECTION_STAGING_SCAN_SHA256" \
            --arg inspection_volume_scan_sha256 "$INSPECTION_VOLUME_SCAN_SHA256" \
            --argjson volume_artifact_id "$VOLUME_ARTIFACT_ID" \
            --arg volume_artifact_name "$VOLUME_ARTIFACT_NAME" \
            --arg volume_artifact_digest "$VOLUME_ARTIFACT_DIGEST" \
            --arg volume_artifact_expires_at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --arg volume_record_sha256 "${{ steps.volume-evidence.outputs.record_sha256 }}" \
            --arg volume_attach_layout_sha256 "${{ steps.volume-evidence.outputs.attach_layout_sha256 }}" \
            --arg volume_projection_manifest_sha256 "${{ steps.volume-evidence.outputs.projection_manifest_sha256 }}" \
            --arg volume_sidecar_manifest_sha256 "${{ steps.volume-evidence.outputs.sidecar_manifest_sha256 }}" \
            --argjson remount_artifact_id "$REMOUNT_ARTIFACT_ID" \
            --arg remount_artifact_name "$REMOUNT_ARTIFACT_NAME" \
            --arg remount_artifact_digest "$REMOUNT_ARTIFACT_DIGEST" \
            --arg remount_artifact_expires_at "$REMOUNT_ARTIFACT_EXPIRES_AT" \
            --arg remount_receipt_sha256 "$REMOUNT_RECEIPT_SHA256" \
            --arg verifier_ref "$GITHUB_REF" \
            --arg verifier_sha "$GITHUB_SHA" \
            --arg verifier_workflow_ref "$GITHUB_WORKFLOW_REF" \
            --slurpfile ledger "$LEDGER_PATH" '
              ($ledger | length) == 1
              and $ledger[0].schema == "personal-desktop-staging/v2"
              and (keys | sort) == [
                "authorization_artifact", "build_contract_sha256", "candidate_artifact",
                "desktop", "gate1", "inspection", "ledger", "ledger_sha256", "relay", "remount",
                "repository", "safety", "schema", "source_sha",
                "staging", "subject", "verifier"
              ]
              and .schema == "personal-desktop-staging-attestation/v2"
              and .repository == $ledger[0].repository
              and .repository == "justinharkelroad/buzz"
              and (.source_sha | test("^[0-9a-f]{40}$"))
              and .source_sha == $ledger[0].source_sha
              and .ledger == $ledger[0]
              and .ledger_sha256 == $ledger_sha256
              and (.ledger_sha256 | test("^[0-9a-f]{64}$"))
              and .verifier == {
                sha: $ledger[0].workflow_sha,
                ref: "refs/heads/main",
                workflow_ref: $ledger[0].workflow_ref
              }
              and .verifier.sha == $verifier_sha
              and .verifier.ref == $verifier_ref
              and .verifier.workflow_ref == $verifier_workflow_ref
              and .subject == {name: $dmg_name, digest: {sha256: $dmg_sha256}}
              and .subject.digest.sha256 == $ledger[0].dmg_sha256
              and .candidate_artifact == {
                id: $candidate_artifact_id,
                name: $candidate_artifact_name,
                digest: $candidate_artifact_digest,
                expires_at: $candidate_artifact_expires_at
              }
              and .build_contract_sha256 == $ledger[0].build_contract_sha256
              and (.build_contract_sha256 | test("^[0-9a-f]{64}$"))
              and .desktop == {
                target: $ledger[0].target,
                version: $ledger[0].version,
                bundle_id: $ledger[0].bundle_id,
                product_name: $ledger[0].product_name,
                buzz_acp_sha256: $ledger[0].buzz_acp_sha256,
                sidecars: {
                  manifest_sha256: $ledger[0].sidecar_manifest_sha256,
                  manifest: $ledger[0].sidecars
                }
              }
              and (.desktop.product_name | type == "string" and length > 0)
              and (.desktop.buzz_acp_sha256 | test("^[0-9a-f]{64}$"))
              and .desktop.sidecars.manifest_sha256 == .ledger.sidecar_manifest_sha256
              and .desktop.sidecars.manifest == .ledger.sidecars
              and .relay == {
                image: $ledger[0].relay_image,
                digest: $ledger[0].relay_digest,
                image_ref: $ledger[0].relay_image_ref,
                https: $ledger[0].relay_https,
                wss: $ledger[0].relay_wss,
                pubkey: $ledger[0].relay_pubkey
              }
              and .relay.image_ref == (.relay.image + "@" + .relay.digest)
              and (.relay.digest | test("^sha256:[0-9a-f]{64}$"))
              and (.relay.https | startswith("https://"))
              and (.relay.wss | startswith("wss://"))
              and .staging == {
                deployment_receipt_sha256: $ledger[0].staging_deployment_receipt_sha256,
                deployment_evidence_reference: $ledger[0].staging_deployment_evidence_reference,
                smoke_approval_record_sha256: $ledger[0].smoke_approval_record_sha256,
                controls: {
                  environment: $ledger[0].staging_controls.environment,
                  environment_configuration_sha256: $ledger[0].staging_controls.environment_configuration_sha256,
                  deployment_branch_policies_sha256: $ledger[0].staging_controls.deployment_branch_policies_sha256,
                  run_identity_sha256: $ledger[0].staging_controls.run_identity_sha256,
                  deployment_branch: $ledger[0].staging_controls.deployment_branch,
                  authorized_owner: $ledger[0].staging_controls.authorized_owner
                }
              }
              and all([
                .staging.deployment_receipt_sha256,
                .staging.smoke_approval_record_sha256,
                .staging.controls.environment_configuration_sha256,
                .staging.controls.deployment_branch_policies_sha256,
                .staging.controls.run_identity_sha256
              ][]; test("^[0-9a-f]{64}$"))
              and .staging.controls.environment == "personal-staging"
              and .staging.controls.deployment_branch == "main"
              and .staging.controls.authorized_owner.login == "justinharkelroad"
              and .safety == {
                channel: "staging-only",
                unsigned: true,
                updater_enabled: false,
                production_eligible: false,
                installed: false,
                actions_evidence_artifacts_published: true,
                registry_package_published: false,
                updater_feed_published: false
              }
              and .authorization_artifact == $ledger[0].authorization_artifact
              and .inspection == {
                artifact: {
                  id: $inspection_artifact_id,
                  name: $inspection_artifact_name,
                  digest: $inspection_artifact_digest,
                  expires_at: $inspection_artifact_expires_at
                },
                mounted_volume_artifact: {
                  id: $volume_artifact_id,
                  name: $volume_artifact_name,
                  digest: $volume_artifact_digest,
                  expires_at: $volume_artifact_expires_at
                },
                mounted_volume_record_sha256: $volume_record_sha256,
                mounted_volume_attach_layout_sha256: $volume_attach_layout_sha256,
                mounted_volume_projection_manifest_sha256: $volume_projection_manifest_sha256,
                mounted_volume_sidecar_manifest_sha256: $volume_sidecar_manifest_sha256,
                receipt_sha256: $inspection_receipt_sha256,
                mounted_volume_inventory_sha256: $inspection_inventory_sha256,
                downloaded_artifact_scan_sha256: $inspection_staging_scan_sha256,
                full_volume_projection_scan_sha256: $inspection_volume_scan_sha256
              }
              and (.inspection.artifact.id | type == "number" and . >= 1 and floor == .)
              and (.inspection.artifact.digest | test("^sha256:[0-9a-f]{64}$"))
              and (.inspection.mounted_volume_artifact.id | type == "number" and . >= 1 and floor == .)
              and (.inspection.mounted_volume_artifact.digest | test("^sha256:[0-9a-f]{64}$"))
              and .inspection.mounted_volume_sidecar_manifest_sha256 == .ledger.sidecar_manifest_sha256
              and all([
                .inspection.receipt_sha256,
                .inspection.mounted_volume_inventory_sha256,
                .inspection.mounted_volume_record_sha256,
                .inspection.mounted_volume_attach_layout_sha256,
                .inspection.mounted_volume_projection_manifest_sha256,
                .inspection.mounted_volume_sidecar_manifest_sha256,
                .inspection.downloaded_artifact_scan_sha256,
                .inspection.full_volume_projection_scan_sha256
              ][]; test("^[0-9a-f]{64}$"))
              and .remount == {
                artifact: {
                  id: $remount_artifact_id,
                  name: $remount_artifact_name,
                  digest: $remount_artifact_digest,
                  expires_at: $remount_artifact_expires_at
                },
                receipt_sha256: $remount_receipt_sha256,
                fresh_runner: true,
                mounted_read_only: true,
                candidate_executed: false
              }
              and (.remount.artifact.id | type == "number" and . >= 1 and floor == .)
              and (.remount.artifact.digest | test("^sha256:[0-9a-f]{64}$"))
              and (.remount.receipt_sha256 | test("^[0-9a-f]{64}$"))
              and .gate1 == {
                workflow_sha: $ledger[0].gate1_workflow_sha,
                evidence_run_id: $ledger[0].gate1_evidence_run_id,
                evidence_run_attempt: $ledger[0].gate1_evidence_run_attempt,
                artifact: $ledger[0].gate1_artifact,
                receipt_sha256: $ledger[0].gate1_receipt_sha256,
                attestation_bundle_sha256: $ledger[0].gate1_attestation_bundle_sha256,
                eligibility_expires_at: $ledger[0].gate1_eligibility_expires_at,
                release_evidence_expires_at: $ledger[0].gate1_release_evidence_expires_at
              }
              and (.gate1.workflow_sha | test("^[0-9a-f]{40}$"))
              and .gate1.evidence_run_attempt == 1
              and (.gate1.receipt_sha256 | test("^[0-9a-f]{64}$"))
              and (.gate1.attestation_bundle_sha256 | test("^[0-9a-f]{64}$"))
            ' "$predicate" >/dev/null
          chmod 0400 "$predicate"

      - name: Revalidate live protected main immediately before OIDC
        working-directory: verifier
        env:
          BASH_ENV: ""
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPECTION_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.artifact_expires_at }}
          INSPECTION_INVENTORY_SHA256: ${{ steps.inspection.outputs.inventory_sha256 }}
          INSPECTION_RECEIPT_PATH: ${{ steps.inspection.outputs.receipt }}
          INSPECTION_RECEIPT_SHA256: ${{ steps.inspection.outputs.receipt_sha256 }}
          INSPECTION_STAGING_SCAN_SHA256: ${{ steps.inspection.outputs.staging_scan_sha256 }}
          INSPECTION_VOLUME_SCAN_SHA256: ${{ steps.inspection.outputs.volume_scan_sha256 }}
          LEDGER_PATH: ${{ steps.dmg.outputs.ledger_path }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          PREDICATE_PATH: /tmp/personal-desktop-staging-attestation-predicate.json
          REMOUNT_ARTIFACT_DIGEST: ${{ needs.remount.outputs.artifact_digest }}
          REMOUNT_ARTIFACT_EXPIRES_AT: ${{ needs.remount.outputs.artifact_expires_at }}
          REMOUNT_ARTIFACT_ID: ${{ needs.remount.outputs.artifact_id }}
          REMOUNT_ARTIFACT_NAME: ${{ needs.remount.outputs.artifact_name }}
          REMOUNT_RECEIPT_PATH: ${{ steps.remount-evidence.outputs.receipt }}
          REMOUNT_RECEIPT_SHA256: ${{ steps.remount-evidence.outputs.receipt_sha256 }}
          RULESET_EVIDENCE_TOKEN: ${{ secrets.PERSONAL_RULESET_EVIDENCE_TOKEN }}
          STAGED_ACP_PATH: ${{ steps.dmg.outputs.acp_path }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
        run: |
          set -euo pipefail
          [[ -f "$LEDGER_PATH" && ! -L "$LEDGER_PATH" ]]
          [[ -n "$RULESET_EVIDENCE_TOKEN" ]]
          set +e
          classic_reviews_headers=$(GH_TOKEN="$RULESET_EVIDENCE_TOKEN" gh api \
            --hostname github.com --include \
            "repos/$GITHUB_REPOSITORY/branches/main/protection/required_pull_request_reviews" \
            2>/dev/null)
          classic_reviews_exit=$?
          set -e
          classic_reviews_status=$(printf '%s\n' "$classic_reviews_headers" | awk 'NR == 1 {print $2}')
          case "$classic_reviews_status" in
            404) ;;
            200)
              echo "::error::classic main required pull-request reviews are configured"
              exit 1
              ;;
            *)
              echo "::error::classic main required pull-request review absence could not be proven (HTTP ${classic_reviews_status:-unknown}, gh exit $classic_reviews_exit)"
              exit 1
              ;;
          esac
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/branches/main" \
            | jq -S '{
                classic_required_pull_request_reviews: false,
                name,
                protected,
                commit: {sha: .commit.sha}
              }' \
            > /tmp/personal-desktop-live-main-branch.json
          jq -e --arg sha "$GITHUB_SHA" '
            keys == ["classic_required_pull_request_reviews", "commit", "name", "protected"]
            and (.commit | keys) == ["sha"]
            and .classic_required_pull_request_reviews == false
            and .name == "main"
            and .protected == true
            and .commit.sha == $sha
          ' /tmp/personal-desktop-live-main-branch.json >/dev/null
          gh api --hostname github.com --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" \
            > /tmp/personal-desktop-live-main-effective-rule-pages.json
          jq -S '
            def canonical:
              if type == "object" then
                to_entries | sort_by(.key) | map(.value |= canonical) | from_entries
              elif type == "array" then map(canonical)
              else . end;
            [.[][] | {
              type,
              parameters: (.parameters | canonical),
              ruleset_id,
              ruleset_source_type,
              ruleset_source
            }]
            | sort_by(.ruleset_id // 0, .type // "", (.parameters | tojson), .ruleset_source_type // "", .ruleset_source // "")
          ' /tmp/personal-desktop-live-main-effective-rule-pages.json \
            > /tmp/personal-desktop-live-main-effective-rules.json
          ruleset_ids=()
          while IFS= read -r ruleset_id; do
            ruleset_ids+=("$ruleset_id")
          done < <(
            jq -r '[.[] | .ruleset_id | select(type == "number" and . >= 1 and floor == .)] | unique | .[]' \
              /tmp/personal-desktop-live-main-effective-rules.json
          )
          ((${#ruleset_ids[@]} > 0))
          ruleset_dir=/tmp/personal-desktop-live-main-ruleset-details
          mkdir "$ruleset_dir"
          ruleset_details=()
          for ruleset_id in "${ruleset_ids[@]}"; do
            raw_ruleset="$ruleset_dir/${ruleset_id}.raw.json"
            ruleset_detail="$ruleset_dir/${ruleset_id}.json"
            [[ -n "$RULESET_EVIDENCE_TOKEN" ]]
            GH_TOKEN="$RULESET_EVIDENCE_TOKEN" gh api --hostname github.com \
              "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" > "$raw_ruleset"
            jq -e --argjson ruleset_id "$ruleset_id" '
              .id == $ruleset_id
              and has("bypass_actors")
              and (.bypass_actors | type == "array")
            ' "$raw_ruleset" >/dev/null
            jq -S '{
              id,
              name,
              target,
              source_type,
              source,
              enforcement,
              bypass_actors: (.bypass_actors | sort_by(.actor_type // "", .actor_id // 0, .bypass_mode // ""))
            }' \
              "$raw_ruleset" > "$ruleset_detail"
            ruleset_details+=("$ruleset_detail")
          done
          jq -sS 'sort_by(.id)' "${ruleset_details[@]}" \
            > /tmp/personal-desktop-live-main-rulesets.json
          bash ./deploy/personal-relay/validate-main-protection.sh \
            --branch-json /tmp/personal-desktop-live-main-branch.json \
            --rules-json /tmp/personal-desktop-live-main-effective-rules.json \
            --rulesets-json /tmp/personal-desktop-live-main-rulesets.json \
            --expected-sha "$GITHUB_SHA" \
            --expected-repository justinharkelroad/buzz
          cmp -s /tmp/personal-desktop-live-main-branch.json \
            /tmp/personal-desktop-authorization/personal-desktop-main-branch.json
          jq -S 'sort_by(.ruleset_id // 0, .type, (.parameters | tostring), .ruleset_source_type, .ruleset_source)' \
            /tmp/personal-desktop-live-main-effective-rules.json \
            > /tmp/personal-desktop-live-main-effective-rules.canonical.json
          jq -S 'sort_by(.ruleset_id // 0, .type, (.parameters | tostring), .ruleset_source_type, .ruleset_source)' \
            /tmp/personal-desktop-authorization/personal-desktop-main-effective-rules.json \
            > /tmp/personal-desktop-sealed-main-effective-rules.canonical.json
          cmp -s /tmp/personal-desktop-live-main-effective-rules.canonical.json \
            /tmp/personal-desktop-sealed-main-effective-rules.canonical.json
          jq -S 'sort_by(.id)' /tmp/personal-desktop-live-main-rulesets.json \
            > /tmp/personal-desktop-live-main-rulesets.canonical.json
          jq -S 'sort_by(.id)' /tmp/personal-desktop-authorization/personal-desktop-main-rulesets.json \
            > /tmp/personal-desktop-sealed-main-rulesets.canonical.json
          cmp -s /tmp/personal-desktop-live-main-rulesets.canonical.json \
            /tmp/personal-desktop-sealed-main-rulesets.canonical.json

          gh api --hostname github.com \
            "repos/$GITHUB_REPOSITORY/environments/personal-staging" \
            > /tmp/personal-desktop-live-staging-environment.raw.json
          jq -S '{
              id,
              node_id,
              name,
              deployment_branch_policy: {
                protected_branches: .deployment_branch_policy.protected_branches,
                custom_branch_policies: .deployment_branch_policy.custom_branch_policies
              },
              protection_rules: [.protection_rules[]] | sort_by(.type)
            }' /tmp/personal-desktop-live-staging-environment.raw.json \
            > /tmp/personal-desktop-live-staging-environment.json
          jq -e '
            type == "object"
            and keys == ["deployment_branch_policy", "id", "name", "node_id", "protection_rules"]
            and .name == "personal-staging"
            and (.id | type == "number" and . >= 1 and floor == .)
            and (.node_id | type == "string" and length > 0)
            and .deployment_branch_policy == {protected_branches: false, custom_branch_policies: true}
            and ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 0
          ' /tmp/personal-desktop-live-staging-environment.json >/dev/null
          gh api --hostname github.com --paginate \
            "repos/$GITHUB_REPOSITORY/environments/personal-staging/deployment-branch-policies?per_page=100" \
            | jq -s '{
                total_count: ([.[].branch_policies[]] | length),
                branch_policies: [.[].branch_policies[] | {id, node_id, name}] | sort_by(.id, .node_id, .name)
              }' \
            > /tmp/personal-desktop-live-staging-branch-policies.json
          jq -e '
            .total_count == 1
            and (.branch_policies | length) == 1
            and (.branch_policies[0] | keys | sort) == ["id", "name", "node_id"]
            and (.branch_policies[0].id | type == "number" and . >= 1 and floor == .)
            and (.branch_policies[0].node_id | type == "string" and length > 0)
            and .branch_policies[0].name == "main"
          ' /tmp/personal-desktop-live-staging-branch-policies.json >/dev/null
          jq -S . /tmp/personal-desktop-live-staging-environment.json \
            > /tmp/personal-desktop-live-staging-environment.canonical.json
          jq -S . /tmp/personal-desktop-authorization/personal-staging-environment.json \
            > /tmp/personal-desktop-sealed-staging-environment.canonical.json
          cmp -s /tmp/personal-desktop-live-staging-environment.canonical.json \
            /tmp/personal-desktop-sealed-staging-environment.canonical.json
          jq -S '.branch_policies |= sort_by(.id, .node_id, .name)' \
            /tmp/personal-desktop-live-staging-branch-policies.json \
            > /tmp/personal-desktop-live-staging-branch-policies.canonical.json
          jq -S '.branch_policies |= sort_by(.id, .node_id, .name)' \
            /tmp/personal-desktop-authorization/personal-staging-branch-policies.json \
            > /tmp/personal-desktop-sealed-staging-branch-policies.canonical.json
          cmp -s /tmp/personal-desktop-live-staging-branch-policies.canonical.json \
            /tmp/personal-desktop-sealed-staging-branch-policies.canonical.json
          minimum_valid_until=$(( $(date -u '+%s') + 2100 ))
          jq -e --argjson minimum_valid_until "$minimum_valid_until" '
            .schema == "personal-desktop-staging/v2"
            and (.authorization_artifact.expires_at | fromdateiso8601) > $minimum_valid_until
            and (.gate1_artifact.expires_at | fromdateiso8601) > $minimum_valid_until
            and (.gate1_eligibility_expires_at | fromdateiso8601) > $minimum_valid_until
            and (.gate1_release_evidence_expires_at | fromdateiso8601) > $minimum_valid_until
          ' "$LEDGER_PATH" >/dev/null
          [[ "$(date -juf '%Y-%m-%dT%H:%M:%SZ' "$INSPECTION_ARTIFACT_EXPIRES_AT" '+%s')" -gt "$minimum_valid_until" ]]
          [[ "$(date -juf '%Y-%m-%dT%H:%M:%SZ' "$REMOUNT_ARTIFACT_EXPIRES_AT" '+%s')" -gt "$minimum_valid_until" ]]
          [[ "$(date -juf '%Y-%m-%dT%H:%M:%SZ' "$VOLUME_ARTIFACT_EXPIRES_AT" '+%s')" -gt "$minimum_valid_until" ]]

          [[ -f "$DMG_PATH" && ! -L "$DMG_PATH" ]]
          [[ -f "$STAGED_ACP_PATH" && ! -L "$STAGED_ACP_PATH" ]]
          [[ -f "$INSPECTION_RECEIPT_PATH" && ! -L "$INSPECTION_RECEIPT_PATH" ]]
          [[ -f "$PREDICATE_PATH" && ! -L "$PREDICATE_PATH" ]]
          [[ -f "$REMOUNT_RECEIPT_PATH" && ! -L "$REMOUNT_RECEIPT_PATH" ]]
          staged_sidecars=/tmp/personal-desktop-staging/personal-desktop-sidecars.json
          volume_root=/tmp/personal-desktop-mounted-volume
          volume_record="$volume_root/personal-desktop-mounted-volume-record.json"
          volume_attach_layout="$volume_root/personal-desktop-dmg-attach-layout.json"
          volume_projection_manifest="$volume_root/personal-desktop-volume-projection-manifest.json"
          volume_sidecars="$volume_root/personal-desktop-mounted-sidecars.json"
          for evidence in "$staged_sidecars" "$volume_record" "$volume_attach_layout" "$volume_projection_manifest" "$volume_sidecars"; do
            [[ -f "$evidence" && ! -L "$evidence" ]]
            jq -e -s 'length == 1' "$evidence" >/dev/null
          done
          dmg_sha=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          acp_sha=$(shasum -a 256 "$STAGED_ACP_PATH" | awk '{print $1}')
          ledger_sha=$(shasum -a 256 "$LEDGER_PATH" | awk '{print $1}')
          receipt_sha=$(shasum -a 256 "$INSPECTION_RECEIPT_PATH" | awk '{print $1}')
          remount_receipt_sha=$(shasum -a 256 "$REMOUNT_RECEIPT_PATH" | awk '{print $1}')
          inventory_sha=$(shasum -a 256 /tmp/personal-desktop-inspection/personal-desktop-mounted-volume-inventory.json | awk '{print $1}')
          staging_scan_sha=$(shasum -a 256 /tmp/personal-desktop-inspection/personal-desktop-inspection-staging-secret.json | awk '{print $1}')
          volume_scan_sha=$(shasum -a 256 /tmp/personal-desktop-inspection/personal-desktop-inspection-volume-secret.json | awk '{print $1}')
          sidecar_manifest_sha=$(shasum -a 256 "$staged_sidecars" | awk '{print $1}')
          volume_record_sha=$(shasum -a 256 "$volume_record" | awk '{print $1}')
          volume_attach_layout_sha=$(shasum -a 256 "$volume_attach_layout" | awk '{print $1}')
          volume_projection_manifest_sha=$(shasum -a 256 "$volume_projection_manifest" | awk '{print $1}')
          volume_sidecar_manifest_sha=$(shasum -a 256 "$volume_sidecars" | awk '{print $1}')
          cmp -s "$staged_sidecars" "$volume_sidecars"
          while IFS=$'\t' read -r candidate_name expected_sha; do
            candidate_sidecar="/tmp/personal-desktop-staging/$candidate_name"
            [[ -f "$candidate_sidecar" && ! -L "$candidate_sidecar" ]]
            [[ "$(shasum -a 256 "$candidate_sidecar" | awk '{print $1}')" == "$expected_sha" ]]
          done < <(jq -r '.entries[] | [.candidate_name, .source_sha256] | @tsv' "$staged_sidecars")
          [[ "$dmg_sha" == "$(jq -r .dmg_sha256 "$LEDGER_PATH")" ]]
          [[ "$acp_sha" == "$(jq -r .buzz_acp_sha256 "$LEDGER_PATH")" ]]
          [[ "$dmg_sha" == "$(jq -r .candidate.dmg_sha256 "$INSPECTION_RECEIPT_PATH")" ]]
          [[ "$acp_sha" == "$(jq -r .candidate.buzz_acp_sha256 "$INSPECTION_RECEIPT_PATH")" ]]
          [[ "$ledger_sha" == "$(jq -r .candidate.ledger_sha256 "$INSPECTION_RECEIPT_PATH")" ]]
          [[ "$receipt_sha" == "$INSPECTION_RECEIPT_SHA256" ]]
          [[ "$remount_receipt_sha" == "$REMOUNT_RECEIPT_SHA256" ]]
          [[ "$inventory_sha" == "$INSPECTION_INVENTORY_SHA256" ]]
          [[ "$staging_scan_sha" == "$INSPECTION_STAGING_SCAN_SHA256" ]]
          [[ "$volume_scan_sha" == "$INSPECTION_VOLUME_SCAN_SHA256" ]]
          [[ "$sidecar_manifest_sha" == "$(jq -r .sidecar_manifest_sha256 "$LEDGER_PATH")" ]]
          [[ "$volume_record_sha" == "${{ steps.volume-evidence.outputs.record_sha256 }}" ]]
          [[ "$volume_attach_layout_sha" == "${{ steps.volume-evidence.outputs.attach_layout_sha256 }}" ]]
          [[ "$volume_projection_manifest_sha" == "${{ steps.volume-evidence.outputs.projection_manifest_sha256 }}" ]]
          [[ "$volume_sidecar_manifest_sha" == "${{ steps.volume-evidence.outputs.sidecar_manifest_sha256 }}" ]]
          jq -e \
            --arg dmg_sha "$dmg_sha" \
            --arg acp_sha "$acp_sha" \
            --arg receipt_sha "$receipt_sha" \
            --arg inventory_sha "$inventory_sha" \
            --arg staging_scan_sha "$staging_scan_sha" \
            --arg volume_scan_sha "$volume_scan_sha" \
            --arg ledger_sha "$ledger_sha" \
            --arg sidecar_manifest_sha "$sidecar_manifest_sha" \
            --arg volume_record_sha "$volume_record_sha" \
            --arg volume_attach_layout_sha "$volume_attach_layout_sha" \
            --arg volume_projection_manifest_sha "$volume_projection_manifest_sha" \
            --arg volume_sidecar_manifest_sha "$volume_sidecar_manifest_sha" \
            --argjson remount_artifact_id "$REMOUNT_ARTIFACT_ID" \
            --arg remount_artifact_name "$REMOUNT_ARTIFACT_NAME" \
            --arg remount_artifact_digest "$REMOUNT_ARTIFACT_DIGEST" \
            --arg remount_artifact_expires_at "$REMOUNT_ARTIFACT_EXPIRES_AT" \
            --arg remount_receipt_sha "$remount_receipt_sha" \
            --slurpfile ledger "$LEDGER_PATH" '
              $ledger[0].schema == "personal-desktop-staging/v2"
              and .ledger.schema == "personal-desktop-staging/v2"
              and .subject.digest.sha256 == $dmg_sha
              and .ledger == $ledger[0]
              and .ledger_sha256 == $ledger_sha
              and .desktop.buzz_acp_sha256 == $acp_sha
              and .desktop.sidecars.manifest_sha256 == $sidecar_manifest_sha
              and .desktop.sidecars.manifest == $ledger[0].sidecars
              and .inspection.receipt_sha256 == $receipt_sha
              and .inspection.mounted_volume_inventory_sha256 == $inventory_sha
              and .inspection.mounted_volume_record_sha256 == $volume_record_sha
              and .inspection.mounted_volume_attach_layout_sha256 == $volume_attach_layout_sha
              and .inspection.mounted_volume_projection_manifest_sha256 == $volume_projection_manifest_sha
              and .inspection.mounted_volume_sidecar_manifest_sha256 == $volume_sidecar_manifest_sha
              and .inspection.downloaded_artifact_scan_sha256 == $staging_scan_sha
              and .inspection.full_volume_projection_scan_sha256 == $volume_scan_sha
              and .remount == {
                artifact: {
                  id: $remount_artifact_id,
                  name: $remount_artifact_name,
                  digest: $remount_artifact_digest,
                  expires_at: $remount_artifact_expires_at
                },
                receipt_sha256: $remount_receipt_sha,
                fresh_runner: true,
                mounted_read_only: true,
                candidate_executed: false
              }
            ' "$PREDICATE_PATH" >/dev/null

      - name: Attest staging DMG provenance
        id: attest-dmg
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ steps.dmg.outputs.name }}
          subject-digest: sha256:${{ steps.dmg.outputs.sha256 }}
          predicate-type: https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2
          predicate-path: /tmp/personal-desktop-staging-attestation-predicate.json
          push-to-registry: false
          show-summary: false

      - name: Verify repository-scoped attestation and inspect predicate
        env:
          BASH_ENV: ""
          BUNDLE_PATH: ${{ steps.attest-dmg.outputs.bundle-path }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          DMG_SHA256: ${{ steps.dmg.outputs.sha256 }}
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          [[ -f "$BUNDLE_PATH" && ! -L "$BUNDLE_PATH" ]]
          cp "$BUNDLE_PATH" personal-desktop-attestation-bundle.json
          gh attestation verify "$DMG_PATH" \
            --hostname github.com \
            --bundle personal-desktop-attestation-bundle.json \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2 \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow github.com/justinharkelroad/buzz/.github/workflows/personal-desktop-release.yml \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > personal-desktop-attestation-verification.json
          jq -e \
            --arg name "$DMG_NAME" \
            --arg digest "$DMG_SHA256" \
            --slurpfile predicate /tmp/personal-desktop-staging-attestation-predicate.json '
              length == 1
              and all(.[].verificationResult.statement;
                .predicateType == "https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2"
                and any(.subject[]?; .name == $name and .digest.sha256 == $digest)
                and .predicate == $predicate[0]
              )
            ' personal-desktop-attestation-verification.json >/dev/null
          cp /tmp/personal-desktop-staging-attestation-predicate.json \
            personal-desktop-attestation-predicate.json
          jq '[.[].verificationResult.statement.predicate]' \
            personal-desktop-attestation-verification.json \
            > personal-desktop-attestation-returned-predicate.json

      - name: Stage exact attestation evidence
        id: attestation-stage
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          stage=$(/usr/bin/mktemp -d /tmp/personal-desktop-attestation-evidence.XXXXXX)
          /bin/cp personal-desktop-attestation-bundle.json "$stage/"
          /bin/cp personal-desktop-attestation-predicate.json "$stage/"
          /bin/cp personal-desktop-attestation-returned-predicate.json "$stage/"
          /bin/cp personal-desktop-attestation-verification.json "$stage/"
          [[ "$(find "$stage" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 4 ]]
          [[ -z "$(find "$stage" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          for evidence in "$stage"/*.json; do
            jq -e -s 'length == 1' "$evidence" >/dev/null
          done
          echo "path=$stage" >> "$GITHUB_OUTPUT"

      - name: Upload exact attestation evidence
        id: attestation-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-desktop-staging-attestation-${{ inputs.target }}-${{ github.sha }}
          path: ${{ steps.attestation-stage.outputs.path }}/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Bind attestation evidence artifact identity
        id: uploaded-attestation
        env:
          ARTIFACT_ID: ${{ steps.attestation-upload.outputs.artifact-id }}
          ARTIFACT_NAME: personal-desktop-staging-attestation-${{ inputs.target }}-${{ github.sha }}
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          UPLOAD_DIGEST: ${{ steps.attestation-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          case "$UPLOAD_DIGEST" in
            sha256:*) artifact_digest=$UPLOAD_DIGEST ;;
            *) artifact_digest="sha256:$UPLOAD_DIGEST" ;;
          esac
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > /tmp/personal-desktop-attestation-artifact.json
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg digest "$artifact_digest" \
            --arg name "$ARTIFACT_NAME" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $run_id
              and (.expires_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' /tmp/personal-desktop-attestation-artifact.json >/dev/null
          {
            echo "digest=$artifact_digest"
            echo "expires_at=$(jq -r .expires_at /tmp/personal-desktop-attestation-artifact.json)"
            echo "id=$ARTIFACT_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          BASH_ENV: ""
          ENV: ""
          GATE1_EVIDENCE_RUN_ID: ${{ inputs.gate1_evidence_run_id }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          {
            echo "### Personal desktop staging candidate"
            echo
            echo "Approved source: \`$SOURCE_SHA\`"
            echo
            echo "Protected desktop verifier: \`$GITHUB_SHA\`"
            echo
            echo "Gate 1 evidence run: \`$GATE1_EVIDENCE_RUN_ID\`"
            echo
            echo "This is unsigned, staging-only, and not eligible for production installation."
            echo
            echo "This workflow does not install, publish an updater feed, deploy, or change hosted Buzz."
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Audit exact desktop attestation evidence
    if: github.repository == 'justinharkelroad/buzz'
    needs:
      - attest
      - build
      - inspect
      - remount
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Checkout protected audit verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact attestation evidence and sealed audit inputs
        working-directory: verifier
        env:
          ARTIFACT_DIGEST: ${{ needs.attest.outputs.artifact_digest }}
          ARTIFACT_EXPIRES_AT: ${{ needs.attest.outputs.artifact_expires_at }}
          ARTIFACT_ID: ${{ needs.attest.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.attest.outputs.artifact_name }}
          BASH_ENV: ""
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPECTION_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.artifact_digest }}
          INSPECTION_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.artifact_expires_at }}
          INSPECTION_ARTIFACT_ID: ${{ needs.inspect.outputs.artifact_id }}
          INSPECTION_ARTIFACT_NAME: ${{ needs.inspect.outputs.artifact_name }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          REF_PROTECTED: ${{ github.ref_protected }}
          REMOUNT_ARTIFACT_DIGEST: ${{ needs.remount.outputs.artifact_digest }}
          REMOUNT_ARTIFACT_EXPIRES_AT: ${{ needs.remount.outputs.artifact_expires_at }}
          REMOUNT_ARTIFACT_ID: ${{ needs.remount.outputs.artifact_id }}
          REMOUNT_ARTIFACT_NAME: ${{ needs.remount.outputs.artifact_name }}
          VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == "refs/heads/main" && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_WORKFLOW_REF" == "justinharkelroad/buzz/.github/workflows/personal-desktop-release.yml@refs/heads/main" ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]]
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$ARTIFACT_NAME" \
            --digest "$ARTIFACT_DIGEST" \
            --expires-at "$ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-attestation-audit-input \
            --metadata-output /tmp/personal-desktop-attestation-audit-source-artifact.json \
            --archive-output /tmp/personal-desktop-attestation-audit-source.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$CANDIDATE_ARTIFACT_NAME" \
            --digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --expires-at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-attestation-audit-candidate \
            --metadata-output /tmp/personal-desktop-attestation-audit-candidate-artifact.json \
            --archive-output /tmp/personal-desktop-attestation-audit-candidate.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$INSPECTION_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$INSPECTION_ARTIFACT_NAME" \
            --digest "$INSPECTION_ARTIFACT_DIGEST" \
            --expires-at "$INSPECTION_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-attestation-audit-inspection \
            --metadata-output /tmp/personal-desktop-attestation-audit-inspection-artifact.json \
            --archive-output /tmp/personal-desktop-attestation-audit-inspection.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$VOLUME_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$VOLUME_ARTIFACT_NAME" \
            --digest "$VOLUME_ARTIFACT_DIGEST" \
            --expires-at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-attestation-audit-volume \
            --metadata-output /tmp/personal-desktop-attestation-audit-volume-artifact.json \
            --archive-output /tmp/personal-desktop-attestation-audit-volume.zip
          bash ./deploy/personal-relay/download-exact-artifact.sh \
            --artifact-id "$REMOUNT_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$REMOUNT_ARTIFACT_NAME" \
            --digest "$REMOUNT_ARTIFACT_DIGEST" \
            --expires-at "$REMOUNT_ARTIFACT_EXPIRES_AT" \
            --output-dir /tmp/personal-desktop-attestation-audit-remount \
            --metadata-output /tmp/personal-desktop-attestation-audit-remount-artifact.json \
            --archive-output /tmp/personal-desktop-attestation-audit-remount.zip
          input=/tmp/personal-desktop-attestation-audit-input
          [[ "$(find "$input" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 4 ]]
          [[ -z "$(find "$input" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          expected_names=$(printf '%s\n' \
            personal-desktop-attestation-bundle.json \
            personal-desktop-attestation-predicate.json \
            personal-desktop-attestation-returned-predicate.json \
            personal-desktop-attestation-verification.json)
          observed_names=$(find "$input" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          [[ "$observed_names" == "$expected_names" ]]
          for evidence in "$input"/*.json; do
            jq -e -s 'length == 1' "$evidence" >/dev/null
          done
          candidate=/tmp/personal-desktop-attestation-audit-candidate
          [[ "$(find "$candidate" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 10 ]]
          [[ -z "$(find "$candidate" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          ledger="$candidate/personal-desktop-staging.json"
          [[ -s "$ledger" && ! -L "$ledger" ]]
          jq -e '.schema == "personal-desktop-staging/v2"' "$ledger" >/dev/null
          jq -e '
            .schema == "personal-desktop-staging-attestation/v2"
            and .ledger.schema == "personal-desktop-staging/v2"
          ' "$input/personal-desktop-attestation-predicate.json" >/dev/null
          dmg_count=$(find "$candidate" -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d '[:space:]')
          dmg=$(find "$candidate" -maxdepth 1 -name '*.dmg' -type f -print -quit)
          [[ "$dmg_count" == 1 && -n "$dmg" && ! -L "$dmg" ]]
          dmg_sha=$(sha256sum "$dmg" | awk '{print $1}')
          [[ "$dmg_sha" == "$(jq -r .dmg_sha256 "$ledger")" ]]
          remount=/tmp/personal-desktop-attestation-audit-remount
          remount_receipt="$remount/personal-desktop-independent-remount-receipt.json"
          [[ "$(find "$remount" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 1 ]]
          [[ -z "$(find "$remount" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          [[ -s "$remount_receipt" && ! -L "$remount_receipt" ]]
          jq -e -s 'length == 1' "$remount_receipt" >/dev/null
          [[ "$(sha256sum "$remount_receipt" | awk '{print $1}')" == "${{ needs.remount.outputs.receipt_sha256 }}" ]]

      - name: Independently verify exact attestation against immutable DMG
        env:
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          input=/tmp/personal-desktop-attestation-audit-input
          candidate=/tmp/personal-desktop-attestation-audit-candidate
          dmg_count=$(find "$candidate" -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d '[:space:]')
          dmg=$(find "$candidate" -maxdepth 1 -name '*.dmg' -type f -print -quit)
          [[ "$dmg_count" == 1 && -n "$dmg" && ! -L "$dmg" ]]
          dmg_name=$(basename "$dmg")
          dmg_sha=$(sha256sum "$dmg" | awk '{print $1}')
          gh attestation verify "$dmg" \
            --hostname github.com \
            --bundle "$input/personal-desktop-attestation-bundle.json" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2 \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --signer-workflow github.com/justinharkelroad/buzz/.github/workflows/personal-desktop-release.yml \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > /tmp/personal-desktop-attestation-audit-independent-verification.json
          jq -e \
            --arg name "$dmg_name" \
            --arg digest "$dmg_sha" \
            --slurpfile predicate "$input/personal-desktop-attestation-predicate.json" '
              length == 1
              and all(.[].verificationResult.statement;
                .predicateType == "https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2"
                and (.subject | type == "array" and length == 1)
                and .subject[0] == {name: $name, digest: {sha256: $digest}}
                and .predicate == $predicate[0]
              )
            ' /tmp/personal-desktop-attestation-audit-independent-verification.json >/dev/null
          jq -e \
            --slurpfile predicate "$input/personal-desktop-attestation-predicate.json" '
              length == 1 and .[0] == $predicate[0]
            ' "$input/personal-desktop-attestation-returned-predicate.json" >/dev/null
          jq -e \
            --arg name "$dmg_name" \
            --arg digest "$dmg_sha" \
            --slurpfile predicate "$input/personal-desktop-attestation-predicate.json" '
              length == 1
              and all(.[].verificationResult.statement;
                .predicateType == "https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2"
                and (.subject | type == "array" and length == 1)
                and .subject[0] == {name: $name, digest: {sha256: $digest}}
                and .predicate == $predicate[0]
              )
            ' "$input/personal-desktop-attestation-verification.json" >/dev/null

      - name: Stage exact post-download audit scan inputs
        id: audit-scan-input
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          stage=$(mktemp -d /tmp/personal-desktop-attestation-audit-scan-input.XXXXXX)
          attestation="$stage/attestation"
          candidate="$stage/candidate"
          volume="$stage/volume-projection"
          mkdir "$attestation" "$candidate" "$volume"
          cp /tmp/personal-desktop-attestation-audit-input/*.json "$attestation/"
          cp /tmp/personal-desktop-attestation-audit-independent-verification.json "$attestation/"
          cp /tmp/personal-desktop-attestation-audit-remount/personal-desktop-independent-remount-receipt.json "$attestation/"
          cp -Rp /tmp/personal-desktop-attestation-audit-candidate/. "$candidate/"
          cp -Rp /tmp/personal-desktop-attestation-audit-volume/projection/. "$volume/"
          [[ "$(find "$attestation" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 6 ]]
          [[ -z "$(find "$attestation" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          [[ "$(find "$candidate" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 10 ]]
          [[ -z "$(find "$candidate" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          [[ -z "$(find "$volume" -type l -print -quit)" ]]
          [[ -z "$(find "$volume" -mindepth 1 ! -type d ! -type f -print -quit)" ]]
          {
            echo "attestation=$attestation"
            echo "candidate=$candidate"
            echo "volume=$volume"
          } >> "$GITHUB_OUTPUT"

      - name: Create trusted attestation-audit secret-scan policy
        working-directory: verifier
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          policy_root=/tmp/personal-desktop-attestation-audit-trivy-policy
          [[ ! -e "$policy_root" && ! -L "$policy_root" ]]
          [[ ! -e trivyignores && ! -L trivyignores ]]
          install -d -m 0700 "$policy_root"
          printf '{}\n' > "$policy_root/trivy.yaml"
          install -m 0600 /dev/null "$policy_root/trivy.ignore"
          printf '{}\n' > "$policy_root/secret.yaml"
          chmod 0400 "$policy_root/trivy.yaml" "$policy_root/trivy.ignore" "$policy_root/secret.yaml"

      - name: Independently reject secrets in exact candidate evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CONFIG: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.yaml
          TRIVY_IGNOREFILE: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.ignore
          TRIVY_SECRET_CONFIG: /tmp/personal-desktop-attestation-audit-trivy-policy/secret.yaml
        with:
          scan-type: fs
          scan-ref: ${{ steps.audit-scan-input.outputs.candidate }}
          scanners: secret
          format: json
          output: /tmp/personal-desktop-attestation-audit-candidate-secret.json
          exit-code: "1"
          trivy-config: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.yaml
          trivyignores: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.ignore
          version: v0.70.0
          cache: false

      - name: Independently reject secrets in fresh volume projection evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CONFIG: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.yaml
          TRIVY_IGNOREFILE: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.ignore
          TRIVY_SECRET_CONFIG: /tmp/personal-desktop-attestation-audit-trivy-policy/secret.yaml
        with:
          scan-type: fs
          scan-ref: ${{ steps.audit-scan-input.outputs.volume }}
          scanners: secret
          format: json
          output: /tmp/personal-desktop-attestation-audit-volume-secret.json
          exit-code: "1"
          trivy-config: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.yaml
          trivyignores: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.ignore
          version: v0.70.0
          cache: false
          skip-setup-trivy: true

      - name: Reject secrets in exact attestation evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CONFIG: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.yaml
          TRIVY_IGNOREFILE: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.ignore
          TRIVY_SECRET_CONFIG: /tmp/personal-desktop-attestation-audit-trivy-policy/secret.yaml
        with:
          scan-type: fs
          scan-ref: ${{ steps.audit-scan-input.outputs.attestation }}
          scanners: secret
          format: json
          output: /tmp/personal-desktop-attestation-audit-secret.json
          exit-code: "1"
          trivy-config: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.yaml
          trivyignores: /tmp/personal-desktop-attestation-audit-trivy-policy/trivy.ignore
          version: v0.70.0
          cache: false
          skip-setup-trivy: true

      - name: Restore exact protected terminal audit verifier after scanners
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: terminal-verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Terminally validate and cross-bind every attestation input
        id: terminal-audit
        working-directory: terminal-verifier
        env:
          ATTESTATION_SCAN_ROOT: ${{ steps.audit-scan-input.outputs.attestation }}
          AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.build.outputs.authorization_artifact_digest }}
          AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.authorization_artifact_expires_at }}
          AUTHORIZATION_ARTIFACT_ID: ${{ needs.build.outputs.authorization_artifact_id }}
          AUTHORIZATION_ARTIFACT_NAME: ${{ needs.build.outputs.authorization_artifact_name }}
          BASH_ENV: ""
          BUILD_CONTRACT_SHA256: ${{ needs.build.outputs.build_contract_sha256 }}
          BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          CANDIDATE_SCAN_ROOT: ${{ steps.audit-scan-input.outputs.candidate }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ENV: ""
          GATE1_ARTIFACT_DIGEST: ${{ needs.build.outputs.gate1_artifact_digest }}
          GATE1_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.gate1_artifact_expires_at }}
          GATE1_ARTIFACT_ID: ${{ needs.build.outputs.gate1_artifact_id }}
          GATE1_ARTIFACT_NAME: ${{ needs.build.outputs.gate1_artifact_name }}
          GATE1_ATTESTATION_BUNDLE_SHA256: ${{ needs.build.outputs.gate1_attestation_bundle_sha256 }}
          GATE1_EVIDENCE_RUN_ID: ${{ inputs.gate1_evidence_run_id }}
          GATE1_RECEIPT_SHA256: ${{ needs.build.outputs.gate1_receipt_sha256 }}
          GATE1_WORKFLOW_SHA: ${{ needs.build.outputs.gate1_workflow_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPECTION_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.artifact_digest }}
          INSPECTION_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.artifact_expires_at }}
          INSPECTION_ARTIFACT_ID: ${{ needs.inspect.outputs.artifact_id }}
          INSPECTION_ARTIFACT_NAME: ${{ needs.inspect.outputs.artifact_name }}
          INSPECTION_INVENTORY_SHA256: ${{ needs.inspect.outputs.inventory_sha256 }}
          INSPECTION_RECEIPT_SHA256: ${{ needs.inspect.outputs.receipt_sha256 }}
          INSPECTION_STAGING_SCAN_SHA256: ${{ needs.inspect.outputs.staging_scan_sha256 }}
          INSPECTION_VOLUME_SCAN_SHA256: ${{ needs.inspect.outputs.volume_scan_sha256 }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          RELAY_DIGEST: ${{ needs.build.outputs.relay_digest }}
          RELAY_HTTPS: ${{ needs.build.outputs.relay_https }}
          RELAY_IMAGE: ${{ needs.build.outputs.relay_image }}
          RELAY_IMAGE_REF: ${{ needs.build.outputs.relay_image_ref }}
          RELAY_WSS: ${{ needs.build.outputs.relay_wss }}
          REMOUNT_ARTIFACT_DIGEST: ${{ needs.remount.outputs.artifact_digest }}
          REMOUNT_ARTIFACT_EXPIRES_AT: ${{ needs.remount.outputs.artifact_expires_at }}
          REMOUNT_ARTIFACT_ID: ${{ needs.remount.outputs.artifact_id }}
          REMOUNT_ARTIFACT_NAME: ${{ needs.remount.outputs.artifact_name }}
          REMOUNT_RECEIPT_SHA256: ${{ needs.remount.outputs.receipt_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGING_DEPLOYMENT_RECEIPT_SHA256: ${{ inputs.staging_deployment_receipt_sha256 }}
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
          VOLUME_ATTACH_LAYOUT_SHA256: ${{ needs.inspect.outputs.volume_attach_layout_sha256 }}
          VOLUME_PROJECTION_MANIFEST_SHA256: ${{ needs.inspect.outputs.volume_projection_manifest_sha256 }}
          VOLUME_RECORD_SHA256: ${{ needs.inspect.outputs.volume_record_sha256 }}
          VOLUME_SCAN_ROOT: ${{ steps.audit-scan-input.outputs.volume }}
          VOLUME_SIDECAR_MANIFEST_SHA256: ${{ needs.inspect.outputs.volume_sidecar_manifest_sha256 }}
        run: |
          set -euo pipefail
          expectations=/tmp/personal-desktop-attestation-audit-expectations.json
          summary=/tmp/personal-desktop-attestation-audit-summary.json
          [[ ! -e "$expectations" && ! -L "$expectations" ]]
          [[ ! -e "$summary" && ! -L "$summary" ]]
          jq -nS \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_sha "$SOURCE_SHA" \
            --arg target "$TARGET" \
            --arg version "$VERSION" \
            --arg product_name "$PRODUCT_NAME" \
            --arg confirmation "$CONFIRMATION" \
            --argjson gate1_evidence_run_id "$GATE1_EVIDENCE_RUN_ID" \
            --arg staging_receipt_sha "$STAGING_DEPLOYMENT_RECEIPT_SHA256" \
            --argjson candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidate_artifact_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg candidate_artifact_expires_at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --argjson authorization_artifact_id "$AUTHORIZATION_ARTIFACT_ID" \
            --arg authorization_artifact_name "$AUTHORIZATION_ARTIFACT_NAME" \
            --arg authorization_artifact_digest "$AUTHORIZATION_ARTIFACT_DIGEST" \
            --arg authorization_artifact_expires_at "$AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --argjson inspection_artifact_id "$INSPECTION_ARTIFACT_ID" \
            --arg inspection_artifact_name "$INSPECTION_ARTIFACT_NAME" \
            --arg inspection_artifact_digest "$INSPECTION_ARTIFACT_DIGEST" \
            --arg inspection_artifact_expires_at "$INSPECTION_ARTIFACT_EXPIRES_AT" \
            --argjson volume_artifact_id "$VOLUME_ARTIFACT_ID" \
            --arg volume_artifact_name "$VOLUME_ARTIFACT_NAME" \
            --arg volume_artifact_digest "$VOLUME_ARTIFACT_DIGEST" \
            --arg volume_artifact_expires_at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --argjson remount_artifact_id "$REMOUNT_ARTIFACT_ID" \
            --arg remount_artifact_name "$REMOUNT_ARTIFACT_NAME" \
            --arg remount_artifact_digest "$REMOUNT_ARTIFACT_DIGEST" \
            --arg remount_artifact_expires_at "$REMOUNT_ARTIFACT_EXPIRES_AT" \
            --arg remount_receipt_sha "$REMOUNT_RECEIPT_SHA256" \
            --arg inspection_receipt_sha "$INSPECTION_RECEIPT_SHA256" \
            --arg inspection_inventory_sha "$INSPECTION_INVENTORY_SHA256" \
            --arg inspection_staging_scan_sha "$INSPECTION_STAGING_SCAN_SHA256" \
            --arg inspection_volume_scan_sha "$INSPECTION_VOLUME_SCAN_SHA256" \
            --arg volume_record_sha "$VOLUME_RECORD_SHA256" \
            --arg volume_attach_layout_sha "$VOLUME_ATTACH_LAYOUT_SHA256" \
            --arg volume_projection_manifest_sha "$VOLUME_PROJECTION_MANIFEST_SHA256" \
            --arg volume_sidecar_manifest_sha "$VOLUME_SIDECAR_MANIFEST_SHA256" \
            --arg build_contract_sha "$BUILD_CONTRACT_SHA256" \
            --arg bundle_id "$BUNDLE_ID" \
            --argjson gate1_artifact_id "$GATE1_ARTIFACT_ID" \
            --arg gate1_artifact_name "$GATE1_ARTIFACT_NAME" \
            --arg gate1_artifact_digest "$GATE1_ARTIFACT_DIGEST" \
            --arg gate1_artifact_expires_at "$GATE1_ARTIFACT_EXPIRES_AT" \
            --arg gate1_bundle_sha "$GATE1_ATTESTATION_BUNDLE_SHA256" \
            --arg gate1_receipt_sha "$GATE1_RECEIPT_SHA256" \
            --arg gate1_workflow_sha "$GATE1_WORKFLOW_SHA" \
            --arg relay_image "$RELAY_IMAGE" \
            --arg relay_digest "$RELAY_DIGEST" \
            --arg relay_image_ref "$RELAY_IMAGE_REF" \
            --arg relay_https "$RELAY_HTTPS" \
            --arg relay_wss "$RELAY_WSS" '
              {
                schema: "personal-desktop-attestation-audit-expectations/v3",
                repository: $repository,
                workflow: {
                  sha: $workflow_sha, ref: $workflow_ref,
                  run_id: $workflow_run_id, run_attempt: $workflow_run_attempt
                },
                source_sha: $source_sha,
                target: $target,
                version: $version,
                product_name: $product_name,
                confirmation: $confirmation,
                gate1_evidence_run_id: $gate1_evidence_run_id,
                staging_deployment_receipt_sha256: $staging_receipt_sha,
                candidate_artifact: {
                  id: $candidate_artifact_id, name: $candidate_artifact_name,
                  digest: $candidate_artifact_digest, expires_at: $candidate_artifact_expires_at
                },
                authorization_artifact: {
                  id: $authorization_artifact_id, name: $authorization_artifact_name,
                  digest: $authorization_artifact_digest, expires_at: $authorization_artifact_expires_at
                },
                inspection_artifact: {
                  id: $inspection_artifact_id, name: $inspection_artifact_name,
                  digest: $inspection_artifact_digest, expires_at: $inspection_artifact_expires_at
                },
                volume_artifact: {
                  id: $volume_artifact_id, name: $volume_artifact_name,
                  digest: $volume_artifact_digest, expires_at: $volume_artifact_expires_at
                },
                remount_artifact: {
                  id: $remount_artifact_id, name: $remount_artifact_name,
                  digest: $remount_artifact_digest, expires_at: $remount_artifact_expires_at
                },
                remount_receipt_sha256: $remount_receipt_sha,
                inspection_hashes: {
                  receipt: $inspection_receipt_sha,
                  inventory: $inspection_inventory_sha,
                  staging_scan: $inspection_staging_scan_sha,
                  volume_scan: $inspection_volume_scan_sha
                },
                volume_hashes: {
                  record: $volume_record_sha,
                  attach_layout: $volume_attach_layout_sha,
                  projection_manifest: $volume_projection_manifest_sha,
                  sidecar_manifest: $volume_sidecar_manifest_sha
                },
                build: {
                  build_contract_sha256: $build_contract_sha,
                  bundle_id: $bundle_id,
                  gate1_artifact: {
                    id: $gate1_artifact_id, name: $gate1_artifact_name,
                    digest: $gate1_artifact_digest, expires_at: $gate1_artifact_expires_at
                  },
                  gate1_attestation_bundle_sha256: $gate1_bundle_sha,
                  gate1_receipt_sha256: $gate1_receipt_sha,
                  gate1_workflow_sha: $gate1_workflow_sha,
                  relay_image: $relay_image,
                  relay_digest: $relay_digest,
                  relay_image_ref: $relay_image_ref,
                  relay_https: $relay_https,
                  relay_wss: $relay_wss
                }
              }
            ' > "$expectations"
          chmod 0400 "$expectations"

          bind_scan_report() {
            local report=$1
            local bound=$2
            local expected_root=$3
            [[ -s "$report" && ! -L "$report" && ! -e "$bound" && ! -L "$bound" ]]
            jq '. + {Trivy: {Version: "0.70.0"}}' "$report" > "$bound"
            install -m 0600 "$bound" "$report"
            jq -e --arg root "$expected_root" '
              .SchemaVersion == 2
              and .ArtifactType == "filesystem"
              and .ArtifactName == $root
              and .Trivy.Version == "0.70.0"
              and ([.Results[]? | .Secrets[]?] | length) == 0
            ' "$report" >/dev/null
          }
          bind_scan_report \
            /tmp/personal-desktop-attestation-audit-candidate-secret.json \
            /tmp/personal-desktop-attestation-audit-candidate-secret-bound.json \
            "$CANDIDATE_SCAN_ROOT"
          bind_scan_report \
            /tmp/personal-desktop-attestation-audit-volume-secret.json \
            /tmp/personal-desktop-attestation-audit-volume-secret-bound.json \
            "$VOLUME_SCAN_ROOT"
          bind_scan_report \
            /tmp/personal-desktop-attestation-audit-secret.json \
            /tmp/personal-desktop-attestation-audit-secret-bound.json \
            "$ATTESTATION_SCAN_ROOT"

          candidate=/tmp/personal-desktop-attestation-audit-candidate
          volume=/tmp/personal-desktop-attestation-audit-volume
          [[ -z "$(find "$ATTESTATION_SCAN_ROOT" "$CANDIDATE_SCAN_ROOT" "$VOLUME_SCAN_ROOT" -type l -print -quit)" ]]
          [[ -z "$(find "$ATTESTATION_SCAN_ROOT" "$CANDIDATE_SCAN_ROOT" "$VOLUME_SCAN_ROOT" -mindepth 1 ! -type d ! -type f -print -quit)" ]]
          diff -qr "$CANDIDATE_SCAN_ROOT" "$candidate" >/dev/null
          diff -qr "$VOLUME_SCAN_ROOT" "$volume/projection" >/dev/null
          for evidence in /tmp/personal-desktop-attestation-audit-input/*.json; do
            cmp -s "$evidence" "$ATTESTATION_SCAN_ROOT/$(basename "$evidence")"
          done
          cmp -s \
            /tmp/personal-desktop-attestation-audit-remount/personal-desktop-independent-remount-receipt.json \
            "$ATTESTATION_SCAN_ROOT/personal-desktop-independent-remount-receipt.json"
          case "$TARGET" in
            aarch64-apple-darwin) dmg_arch=aarch64 ;;
            x86_64-apple-darwin) dmg_arch=x64 ;;
            *) echo "::error::unsupported audit target"; exit 1 ;;
          esac
          dmg="$candidate/${PRODUCT_NAME}_${VERSION}_${dmg_arch}.dmg"
          ledger="$candidate/personal-desktop-staging.json"
          sidecars="$candidate/personal-desktop-sidecars.json"
          jq -e '.schema == "personal-desktop-staging/v2"' "$ledger" >/dev/null
          jq -e '
            .schema == "personal-desktop-staging-attestation/v2"
            and .ledger.schema == "personal-desktop-staging/v2"
          ' /tmp/personal-desktop-attestation-audit-input/personal-desktop-attestation-predicate.json >/dev/null
          bash ./deploy/personal-relay/validate-desktop-attestation-audit.sh \
            --candidate-dir "$candidate" \
            --inspection-dir /tmp/personal-desktop-attestation-audit-inspection \
            --remount-dir /tmp/personal-desktop-attestation-audit-remount \
            --volume-dir "$volume" \
            --predicate /tmp/personal-desktop-attestation-audit-input/personal-desktop-attestation-predicate.json \
            --expectations "$expectations" \
            --summary-output "$summary"

          terminal_verification=/tmp/personal-desktop-attestation-audit-terminal-verification.json
          gh attestation verify "$dmg" \
            --hostname github.com \
            --bundle /tmp/personal-desktop-attestation-audit-input/personal-desktop-attestation-bundle.json \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2 \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --signer-workflow github.com/justinharkelroad/buzz/.github/workflows/personal-desktop-release.yml \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$terminal_verification"
          dmg_sha=$(sha256sum "$dmg" | awk '{print $1}')
          predicate=/tmp/personal-desktop-attestation-audit-input/personal-desktop-attestation-predicate.json
          jq -e \
            --arg name "$(basename "$dmg")" \
            --arg digest "$dmg_sha" \
            --slurpfile predicate "$predicate" '
              length == 1
              and all(.[].verificationResult.statement;
                .predicateType == "https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2"
                and (.subject | type == "array" and length == 1)
                and .subject[0] == {name: $name, digest: {sha256: $digest}}
                and .predicate == $predicate[0]
              )
            ' "$terminal_verification" >/dev/null
          jq -e --slurpfile predicate "$predicate" '
            length == 1 and .[0] == $predicate[0]
          ' /tmp/personal-desktop-attestation-audit-input/personal-desktop-attestation-returned-predicate.json >/dev/null
          jq -e \
            --arg name "$(basename "$dmg")" \
            --arg digest "$dmg_sha" \
            --slurpfile predicate "$predicate" '
              length == 1
              and all(.[].verificationResult.statement;
                .predicateType == "https://github.com/justinharkelroad/buzz/attestations/personal-desktop-staging/v2"
                and (.subject | type == "array" and length == 1)
                and .subject[0] == {name: $name, digest: {sha256: $digest}}
                and .predicate == $predicate[0]
              )
            ' /tmp/personal-desktop-attestation-audit-input/personal-desktop-attestation-verification.json >/dev/null
          cmp -s "$terminal_verification" \
            "$ATTESTATION_SCAN_ROOT/personal-desktop-attestation-audit-independent-verification.json"
          install -m 0600 "$terminal_verification" \
            /tmp/personal-desktop-attestation-audit-independent-verification.json
          {
            echo "attestation_scan_sha256=$(sha256sum /tmp/personal-desktop-attestation-audit-secret.json | awk '{print $1}')"
            echo "candidate_scan_sha256=$(sha256sum /tmp/personal-desktop-attestation-audit-candidate-secret.json | awk '{print $1}')"
            echo "summary_sha256=$(sha256sum "$summary" | awk '{print $1}')"
            echo "volume_scan_sha256=$(sha256sum /tmp/personal-desktop-attestation-audit-volume-secret.json | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Bind zero-secret attestation audit
        id: audit-receipt
        env:
          ARTIFACT_DIGEST: ${{ needs.attest.outputs.artifact_digest }}
          ARTIFACT_EXPIRES_AT: ${{ needs.attest.outputs.artifact_expires_at }}
          ARTIFACT_ID: ${{ needs.attest.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.attest.outputs.artifact_name }}
          BASH_ENV: ""
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.build.outputs.artifact_expires_at }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ENV: ""
          INSPECTION_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.artifact_digest }}
          INSPECTION_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.artifact_expires_at }}
          INSPECTION_ARTIFACT_ID: ${{ needs.inspect.outputs.artifact_id }}
          INSPECTION_ARTIFACT_NAME: ${{ needs.inspect.outputs.artifact_name }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          REMOUNT_ARTIFACT_DIGEST: ${{ needs.remount.outputs.artifact_digest }}
          REMOUNT_ARTIFACT_EXPIRES_AT: ${{ needs.remount.outputs.artifact_expires_at }}
          REMOUNT_ARTIFACT_ID: ${{ needs.remount.outputs.artifact_id }}
          REMOUNT_ARTIFACT_NAME: ${{ needs.remount.outputs.artifact_name }}
          REMOUNT_RECEIPT_SHA256: ${{ needs.remount.outputs.receipt_sha256 }}
          VOLUME_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.volume_artifact_digest }}
          VOLUME_ARTIFACT_EXPIRES_AT: ${{ needs.inspect.outputs.volume_artifact_expires_at }}
          VOLUME_ARTIFACT_ID: ${{ needs.inspect.outputs.volume_artifact_id }}
          VOLUME_ARTIFACT_NAME: ${{ needs.inspect.outputs.volume_artifact_name }}
        run: |
          set -euo pipefail
          input=/tmp/personal-desktop-attestation-audit-input
          expectations=/tmp/personal-desktop-attestation-audit-expectations.json
          summary=/tmp/personal-desktop-attestation-audit-summary.json
          for evidence in \
            "$expectations" \
            "$summary" \
            /tmp/personal-desktop-attestation-audit-secret.json \
            /tmp/personal-desktop-attestation-audit-candidate-secret.json \
            /tmp/personal-desktop-attestation-audit-volume-secret.json \
            /tmp/personal-desktop-attestation-audit-independent-verification.json \
            /tmp/personal-desktop-attestation-audit-remount/personal-desktop-independent-remount-receipt.json; do
            [[ -s "$evidence" && ! -L "$evidence" ]]
            jq -e -s 'length == 1' "$evidence" >/dev/null
          done
          bundle_sha=$(sha256sum "$input/personal-desktop-attestation-bundle.json" | awk '{print $1}')
          predicate_sha=$(sha256sum "$input/personal-desktop-attestation-predicate.json" | awk '{print $1}')
          returned_predicate_sha=$(sha256sum "$input/personal-desktop-attestation-returned-predicate.json" | awk '{print $1}')
          verification_sha=$(sha256sum "$input/personal-desktop-attestation-verification.json" | awk '{print $1}')
          independent_verification_sha=$(sha256sum /tmp/personal-desktop-attestation-audit-independent-verification.json | awk '{print $1}')
          expectations_sha=$(sha256sum "$expectations" | awk '{print $1}')
          summary_sha=$(sha256sum "$summary" | awk '{print $1}')
          attestation_scan_sha=$(sha256sum /tmp/personal-desktop-attestation-audit-secret.json | awk '{print $1}')
          candidate_scan_sha=$(sha256sum /tmp/personal-desktop-attestation-audit-candidate-secret.json | awk '{print $1}')
          volume_scan_sha=$(sha256sum /tmp/personal-desktop-attestation-audit-volume-secret.json | awk '{print $1}')
          remount_receipt_sha=$(sha256sum /tmp/personal-desktop-attestation-audit-remount/personal-desktop-independent-remount-receipt.json | awk '{print $1}')
          [[ "$summary_sha" == "${{ steps.terminal-audit.outputs.summary_sha256 }}" ]]
          [[ "$attestation_scan_sha" == "${{ steps.terminal-audit.outputs.attestation_scan_sha256 }}" ]]
          [[ "$candidate_scan_sha" == "${{ steps.terminal-audit.outputs.candidate_scan_sha256 }}" ]]
          [[ "$volume_scan_sha" == "${{ steps.terminal-audit.outputs.volume_scan_sha256 }}" ]]
          [[ "$remount_receipt_sha" == "$REMOUNT_RECEIPT_SHA256" ]]
          audited_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq -nS \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg artifact_expires_at "$ARTIFACT_EXPIRES_AT" \
            --arg audited_at "$audited_at" \
            --arg bundle_sha "$bundle_sha" \
            --arg predicate_sha "$predicate_sha" \
            --arg returned_predicate_sha "$returned_predicate_sha" \
            --arg verification_sha "$verification_sha" \
            --arg independent_verification_sha "$independent_verification_sha" \
            --arg expectations_sha "$expectations_sha" \
            --arg summary_sha "$summary_sha" \
            --arg attestation_scan_sha "$attestation_scan_sha" \
            --arg candidate_scan_sha "$candidate_scan_sha" \
            --arg volume_scan_sha "$volume_scan_sha" \
            --arg remount_receipt_sha "$remount_receipt_sha" \
            --argjson candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidate_artifact_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg candidate_artifact_expires_at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --argjson inspection_artifact_id "$INSPECTION_ARTIFACT_ID" \
            --arg inspection_artifact_name "$INSPECTION_ARTIFACT_NAME" \
            --arg inspection_artifact_digest "$INSPECTION_ARTIFACT_DIGEST" \
            --arg inspection_artifact_expires_at "$INSPECTION_ARTIFACT_EXPIRES_AT" \
            --argjson volume_artifact_id "$VOLUME_ARTIFACT_ID" \
            --arg volume_artifact_name "$VOLUME_ARTIFACT_NAME" \
            --arg volume_artifact_digest "$VOLUME_ARTIFACT_DIGEST" \
            --arg volume_artifact_expires_at "$VOLUME_ARTIFACT_EXPIRES_AT" \
            --argjson remount_artifact_id "$REMOUNT_ARTIFACT_ID" \
            --arg remount_artifact_name "$REMOUNT_ARTIFACT_NAME" \
            --arg remount_artifact_digest "$REMOUNT_ARTIFACT_DIGEST" \
            --arg remount_artifact_expires_at "$REMOUNT_ARTIFACT_EXPIRES_AT" \
            --slurpfile summary "$summary" \
            --argjson run_id "$GITHUB_RUN_ID" '
              {
                schema: "personal-desktop-staging-attestation-audit/v4",
                repository: "justinharkelroad/buzz",
                workflow_sha: env.GITHUB_SHA,
                workflow_ref: env.GITHUB_WORKFLOW_REF,
                workflow_run_id: $run_id,
                workflow_run_attempt: 1,
                audited_at: $audited_at,
                attestation_artifact: {
                  id: $artifact_id, name: $artifact_name,
                  digest: $artifact_digest, expires_at: $artifact_expires_at
                },
                sealed_input_artifacts: {
                  candidate: {
                    id: $candidate_artifact_id, name: $candidate_artifact_name,
                    digest: $candidate_artifact_digest, expires_at: $candidate_artifact_expires_at
                  },
                  inspection: {
                    id: $inspection_artifact_id, name: $inspection_artifact_name,
                    digest: $inspection_artifact_digest, expires_at: $inspection_artifact_expires_at
                  },
                  mounted_volume: {
                    id: $volume_artifact_id, name: $volume_artifact_name,
                    digest: $volume_artifact_digest, expires_at: $volume_artifact_expires_at
                  },
                  independent_remount: {
                    id: $remount_artifact_id, name: $remount_artifact_name,
                    digest: $remount_artifact_digest, expires_at: $remount_artifact_expires_at
                  }
                },
                evidence: {
                  bundle_sha256: $bundle_sha,
                  predicate_sha256: $predicate_sha,
                  returned_predicate_sha256: $returned_predicate_sha,
                  verification_sha256: $verification_sha,
                  independent_verification_sha256: $independent_verification_sha,
                  independent_remount_receipt_sha256: $remount_receipt_sha
                },
                cross_binding: {
                  expectations_sha256: $expectations_sha,
                  summary_sha256: $summary_sha,
                  summary: $summary[0]
                },
                secret_scans: {
                  attestation: {trivy_version: "0.70.0", report_sha256: $attestation_scan_sha},
                  candidate: {trivy_version: "0.70.0", report_sha256: $candidate_scan_sha},
                  mounted_volume: {trivy_version: "0.70.0", report_sha256: $volume_scan_sha}
                }
              }
            ' > /tmp/personal-desktop-attestation-audit-receipt.json
          jq -e '
            (keys | sort) == [
              "attestation_artifact", "audited_at", "cross_binding", "evidence",
              "repository", "schema", "sealed_input_artifacts", "secret_scans",
              "workflow_ref", "workflow_run_attempt", "workflow_run_id", "workflow_sha"
            ]
            and .schema == "personal-desktop-staging-attestation-audit/v4"
            and .repository == "justinharkelroad/buzz"
            and .workflow_run_attempt == 1
            and .cross_binding.summary.schema == "personal-desktop-attestation-audit-summary/v3"
            and all([
              .evidence[], .cross_binding.expectations_sha256,
              .cross_binding.summary_sha256,
              .secret_scans.attestation.report_sha256,
              .secret_scans.candidate.report_sha256,
              .secret_scans.mounted_volume.report_sha256
            ][]; test("^[0-9a-f]{64}$"))
          ' /tmp/personal-desktop-attestation-audit-receipt.json >/dev/null

      - name: Stage exact attestation audit evidence
        id: audit-stage
        env:
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          stage=$(mktemp -d /tmp/personal-desktop-attestation-audit-evidence.XXXXXX)
          cp /tmp/personal-desktop-attestation-audit-receipt.json "$stage/"
          cp /tmp/personal-desktop-attestation-audit-secret.json "$stage/"
          cp /tmp/personal-desktop-attestation-audit-candidate-secret.json "$stage/"
          cp /tmp/personal-desktop-attestation-audit-volume-secret.json "$stage/"
          cp /tmp/personal-desktop-attestation-audit-independent-verification.json "$stage/"
          cp /tmp/personal-desktop-attestation-audit-remount/personal-desktop-independent-remount-receipt.json "$stage/"
          cp /tmp/personal-desktop-attestation-audit-summary.json "$stage/"
          [[ "$(find "$stage" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 7 ]]
          [[ -z "$(find "$stage" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          echo "path=$stage" >> "$GITHUB_OUTPUT"

      - name: Upload exact attestation audit evidence
        id: audit-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-desktop-staging-attestation-audit-${{ inputs.target }}-${{ github.sha }}
          path: ${{ steps.audit-stage.outputs.path }}/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Bind attestation audit artifact identity
        env:
          ARTIFACT_ID: ${{ steps.audit-upload.outputs.artifact-id }}
          ARTIFACT_NAME: personal-desktop-staging-attestation-audit-${{ inputs.target }}-${{ github.sha }}
          BASH_ENV: ""
          ENV: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          UPLOAD_DIGEST: ${{ steps.audit-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          case "$UPLOAD_DIGEST" in
            sha256:*) artifact_digest=$UPLOAD_DIGEST ;;
            *) artifact_digest="sha256:$UPLOAD_DIGEST" ;;
          esac
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > /tmp/personal-desktop-attestation-audit-artifact.json
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg digest "$artifact_digest" \
            --arg name "$ARTIFACT_NAME" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $run_id
            ' /tmp/personal-desktop-attestation-audit-artifact.json >/dev/null
