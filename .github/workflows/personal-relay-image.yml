          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE_REF}" \
            --hostname github.com \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --source-digest "$SOURCE_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow github.com/justinharkelroad/buzz/.github/workflows/personal-relay-image.yml \
            --signer-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners \
            --format json > personal-relay-attestation-verification.json
          jq -e \
            --arg image "$IMAGE_NAME" \
            --arg digest "${IMAGE_DIGEST#sha256:}" '
              length == 1
              and all(.[].verificationResult.statement;
                .predicateType == "https://slsa.dev/provenance/v1"
                and (.subject | type == "array" and length == 1)
                and .subject[0].name == $image
                and .subject[0].digest == {sha256: $digest}
              )
            ' personal-relay-attestation-verification.json >/dev/null
          jq '[.[0].verificationResult.statement.predicate]' \
            personal-relay-attestation-verification.json \
            > personal-relay-attestation-predicate.json

      - name: Write non-secret release ledger
        env:
          AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.release-approval.outputs.authorization_artifact_digest }}
          AUTHORIZATION_ARTIFACT_EXPIRES_AT: ${{ needs.release-approval.outputs.authorization_artifact_expires_at }}
          AUTHORIZATION_ARTIFACT_ID: ${{ needs.release-approval.outputs.authorization_artifact_id }}
          AUTHORIZATION_ARTIFACT_NAME: ${{ needs.release-approval.outputs.authorization_artifact_name }}
          CANDIDATE_REF: ${{ steps.manifest.outputs.candidate_ref }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$AUTHORIZATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORIZATION_ARTIFACT_NAME" == "personal-relay-release-authorization-${SOURCE_SHA}-${GITHUB_RUN_ID}-1" ]]
          [[ "$AUTHORIZATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -en --arg expires_at "$AUTHORIZATION_ARTIFACT_EXPIRES_AT" '
            ($expires_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and (($expires_at | fromdateiso8601) > now)
          ' >/dev/null
          merged_index_sha256=$(sha256sum personal-relay-merged-index.json | awk '{print $1}')
          manifest_create_sha256=$(sha256sum /tmp/personal-relay-manifest-create.json | awk '{print $1}')
          branch_metadata_sha256=$(sha256sum /tmp/personal-relay-release-authorization/personal-relay-release-main-branch.json | awk '{print $1}')
          effective_rules_sha256=$(sha256sum /tmp/personal-relay-release-authorization/personal-relay-release-main-effective-rules.json | awk '{print $1}')
          rulesets_sha256=$(sha256sum /tmp/personal-relay-release-authorization/personal-relay-release-main-rulesets.json | awk '{print $1}')
          environment_sha256=$(sha256sum /tmp/personal-relay-release-authorization/personal-relay-release-environment.json | awk '{print $1}')
          branch_policies_sha256=$(sha256sum /tmp/personal-relay-release-authorization/personal-relay-release-branch-policies.json | awk '{print $1}')
          run_identity_sha256=$(sha256sum /tmp/personal-relay-release-authorization/personal-relay-release-run-identity.json | awk '{print $1}')
          authorization_sha256=$(sha256sum /tmp/personal-relay-release-authorization/personal-relay-release-authorization.json | awk '{print $1}')
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg image "$IMAGE_NAME" \
            --arg candidate_ref "$CANDIDATE_REF" \
            --arg digest "$IMAGE_DIGEST" \
            --arg deployment_ref "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --arg merged_index_sha256 "$merged_index_sha256" \
            --arg manifest_create_sha256 "$manifest_create_sha256" \
            --arg branch_metadata_sha256 "$branch_metadata_sha256" \
            --arg effective_rules_sha256 "$effective_rules_sha256" \
            --arg rulesets_sha256 "$rulesets_sha256" \
            --arg environment_sha256 "$environment_sha256" \
            --arg branch_policies_sha256 "$branch_policies_sha256" \
            --arg run_identity_sha256 "$run_identity_sha256" \
            --arg authorization_sha256 "$authorization_sha256" \
            --arg authorization_artifact_name "$AUTHORIZATION_ARTIFACT_NAME" \
            --arg authorization_artifact_digest "$AUTHORIZATION_ARTIFACT_DIGEST" \
            --arg authorization_artifact_expires_at "$AUTHORIZATION_ARTIFACT_EXPIRES_AT" \
            --arg workflow_run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson authorization_artifact_id "$AUTHORIZATION_ARTIFACT_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --slurpfile scan_policy personal-relay-scan-policy-summaries.json \
            --slurpfile scanner_databases personal-relay-trivy-databases.json \
            --slurpfile authorization /tmp/personal-relay-release-authorization/personal-relay-release-authorization.json \
            '{repository: $repository, source_sha: $source_sha, workflow_ref: $workflow_ref, workflow_sha: $workflow_sha, image: $image, candidate_ref: $candidate_ref, candidate_tag_policy: "best-effort non-overwriting marker; never used for deployment or digest resolution", digest: $digest, deployment_ref: $deployment_ref, artifact_status: "candidate_only", deployment_eligible: false, deployment_blockers: ["separate owner-authorized protected Gate 1 run", "recorded disposition for every remaining HIGH and CRITICAL finding"], main_protection: {branch: "main", commit_sha: $source_sha, ref_protected: true, branch_metadata_sha256: $branch_metadata_sha256, effective_rules_sha256: $effective_rules_sha256, rulesets_sha256: $rulesets_sha256}, release_authorization: {environment: "personal-relay-release", authorized_owner: "justinharkelroad", image_name: $authorization[0].image_name, candidate_tag: $authorization[0].candidate_tag, environment_sha256: $environment_sha256, branch_policies_sha256: $branch_policies_sha256, run_identity_sha256: $run_identity_sha256, authorization_sha256: $authorization_sha256, evidence_artifact: {id: $authorization_artifact_id, name: $authorization_artifact_name, digest: $authorization_artifact_digest, expires_at: $authorization_artifact_expires_at}}, merged_manifest: {raw_index_sha256: $merged_index_sha256, create_metadata_sha256: $manifest_create_sha256, descriptor_policy: "exact union of the two scanned platform indexes"}, sbom: "raw OCI descriptor chain and OCI-artifact subject cryptographically bind each retained SPDX predicate to its exact platform manifest", vulnerability_gate: "exact Trivy JSON image and subject-bound SPDX report union blocks fixed HIGH and CRITICAL findings on AMD64 and ARM64", unfixed_high_critical_finding_rows: ($scan_policy[0] | map(.high_critical.unfixed_findings) | add // 0), scan_policy: $scan_policy[0], scanner_databases: $scanner_databases[0], database_regressions: "three webhook dispatch authority tests passed against pinned Postgres", workflow_run: $workflow_run, workflow_run_attempt: $workflow_run_attempt}' \
            > personal-relay-release.json

      - name: Stage release evidence at one deterministic artifact root
        run: |
          set -euo pipefail
          evidence_root=/tmp/personal-relay-final-evidence
          mkdir "$evidence_root"

          evidence_files=(
            personal-relay-attestation-predicate.json
            personal-relay-attestation-verification.json
            personal-relay-expected-merged-descriptors.json
            personal-relay-merged-index.json
            personal-relay-release.json
            personal-relay-scan-policy-summaries.json
            personal-relay-trivy-databases.json
            /tmp/personal-relay-release-authorization-artifact.json
            /tmp/personal-relay-release-authorization/personal-relay-release-authorization.json
            /tmp/personal-relay-release-authorization/personal-relay-release-main-branch.json
            /tmp/personal-relay-release-authorization/personal-relay-release-main-effective-rules.json
            /tmp/personal-relay-release-authorization/personal-relay-release-main-rulesets.json
            /tmp/personal-relay-release-authorization/personal-relay-release-environment.json
            /tmp/personal-relay-release-authorization/personal-relay-release-branch-policies.json
            /tmp/personal-relay-release-authorization/personal-relay-release-run-identity.json
            /tmp/personal-relay-manifest-create.json
            /tmp/personal-relay-scan/*
          )
          for evidence_file in "${evidence_files[@]}"; do
            [[ -f "$evidence_file" && ! -L "$evidence_file" ]] || {
              echo "::error::release evidence is not a regular file: $evidence_file"
              exit 1
            }
            evidence_name=${evidence_file##*/}
            [[ ! -e "$evidence_root/$evidence_name" ]] || {
              echo "::error::duplicate release evidence basename: $evidence_name"
              exit 1
            }
            install -m 0644 "$evidence_file" "$evidence_root/$evidence_name"
          done
          [[ -s "$evidence_root/personal-relay-release.json" ]]
          [[ $(find "$evidence_root" -mindepth 1 -maxdepth 1 -type f | wc -l) -eq ${#evidence_files[@]} ]]

          evidence_manifest=/tmp/personal-relay-final-evidence.sha256
          (
            cd "$evidence_root"
            for evidence_name in *; do
              sha256sum "$evidence_name"
            done
          ) > "$evidence_manifest"
          [[ $(wc -l < "$evidence_manifest") -eq ${#evidence_files[@]} ]]
          install -m 0444 "$evidence_manifest" "$evidence_root/personal-relay-final-evidence.sha256"
          chmod 0444 "$evidence_root"/*
          chmod 0555 "$evidence_root"

      - name: Verify staged release evidence is unchanged
        working-directory: /tmp/personal-relay-final-evidence
        run: |
          set -euo pipefail
          [[ "$(stat -c '%a' .)" == "555" ]]
          [[ -z "$(find . -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          [[ -z "$(find . -mindepth 1 -maxdepth 1 -perm /222 -print -quit)" ]]
          sha256sum --check --strict personal-relay-final-evidence.sha256

      - name: Create trusted final-evidence secret-scan policy
        run: |
          set -euo pipefail
          policy_root=/tmp/personal-relay-final-trivy-policy
          [[ ! -e "$policy_root" && ! -e trivyignores && ! -L trivyignores ]]
          install -d -m 0700 "$policy_root"
          printf '{}\n' > "$policy_root/trivy.yaml"
          : > "$policy_root/trivy.ignore"
          printf '{}\n' > "$policy_root/trivy.secret.yaml"
          chmod 0400 "$policy_root"/*

      - name: Reject secrets in final release evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CONFIG: /tmp/personal-relay-final-trivy-policy/trivy.yaml
          TRIVY_IGNOREFILE: /tmp/personal-relay-final-trivy-policy/trivy.ignore
          TRIVY_SECRET_CONFIG: /tmp/personal-relay-final-trivy-policy/trivy.secret.yaml
        with:
          trivy-config: /tmp/personal-relay-final-trivy-policy/trivy.yaml
          trivyignores: /tmp/personal-relay-final-trivy-policy/trivy.ignore
          scan-type: fs
          scan-ref: /tmp/personal-relay-final-evidence
          scanners: secret
          format: json
          output: /tmp/personal-relay-final-evidence-secret.json
          exit-code: "1"
          version: v0.70.0
          cache: false

      - name: Bind zero-secret final-evidence report
        run: |
          set -euo pipefail
          report=/tmp/personal-relay-final-evidence-secret.json
          bound_report=/tmp/personal-relay-final-evidence-secret-bound.json
          [[ -s "$report" && ! -L "$report" && ! -e "$bound_report" ]]
          jq '. + {Trivy: {Version: "0.70.0"}}' "$report" > "$bound_report"
          install -m 0600 "$bound_report" "$report"
          jq -e '
            .SchemaVersion == 2
            and .ArtifactType == "filesystem"
            and .Trivy.Version == "0.70.0"
            and ([.Results[]?.Secrets[]?] | length) == 0
          ' "$report" >/dev/null

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-relay-evidence-${{ github.sha }}
          path: /tmp/personal-relay-final-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_name }}@${{ steps.manifest.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          {
            echo "### Personal relay artifact"
            echo
            echo "Source: \`$SOURCE_SHA\`"
            echo
            echo "Deployment image: \`$IMAGE_REF\`"
            echo
            echo "The digest-qualified image is immutable but remains candidate-only."
            echo
            echo "Deployment eligibility requires a separate protected Gate 1 review and recorded dispositions."
            echo
            echo "This workflow publishes an artifact only. It does not deploy Railway or change hosted Buzz."
          } >> "$GITHUB_STEP_SUMMARY"
