name: Personal Relay Image

on:
  pull_request:
    paths:
      - ".cargo/**"
      - ".dockerignore"
      - ".github/workflows/personal-relay-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "admin-web/**"
      - "crates/**"
      - "deploy/personal-relay/**"
      - "migrations/**"
      - "package.json"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "schema/**"
      - "web/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character candidate SHA. It must equal github.sha."
        required: true
        type: string
      confirmation:
        description: "Enter PUBLISH_PERSONAL_RELAY"
        required: true
        type: string

concurrency:
  group: personal-relay-image-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Bind workflow to source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      candidate_tag: ${{ steps.contract.outputs.candidate_tag }}
      image_name: ${{ steps.contract.outputs.image_name }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify invocation contract
        id: contract
        env:
          CONFIGURED_IMAGE: ${{ vars.PERSONAL_RELAY_IMAGE }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          actual_sha=$(git rev-parse 'HEAD^{commit}')
          [[ "$actual_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::checkout does not match github.sha"
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REPOSITORY" == "justinharkelroad/buzz" ]] || {
              echo "::error::publication is limited to Justin's personal fork"
              exit 1
            }
            [[ "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::source_sha must be exactly 40 lowercase hexadecimal characters"
              exit 1
            }
            [[ "$INPUT_SOURCE_SHA" == "$GITHUB_SHA" ]] || {
              echo "::error::source_sha must exactly equal github.sha"
              exit 1
            }
            [[ "$INPUT_CONFIRMATION" == "PUBLISH_PERSONAL_RELAY" ]] || {
              echo "::error::publication confirmation did not match"
              exit 1
            }
          fi

          image_name=${CONFIGURED_IMAGE:-ghcr.io/justinharkelroad/buzz-relay-personal}
          [[ "$image_name" =~ ^ghcr\.io/justinharkelroad/[a-z0-9._-]+$ ]] || {
            echo "::error::PERSONAL_RELAY_IMAGE must stay in Justin's lowercase GHCR namespace"
            exit 1
          }

          {
            echo "candidate_tag=sha-${GITHUB_SHA}"
            echo "image_name=$image_name"
            echo "source_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify personal release contracts
        run: bash ./deploy/personal-relay/release-contract-test.sh

  build-check:
    name: Build-only check (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA" && test "$SOURCE_SHA" = "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Build personal runtime without publication
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime-personal
          platforms: ${{ matrix.platform }}
          tags: personal-relay-check:${{ matrix.arch }}
          load: true
          provenance: false
          sbom: false

      - name: Verify personal runtime contract
        env:
          IMAGE_REF: personal-relay-check:${{ matrix.arch }}
        run: bash ./deploy/personal-relay/runtime-contract-test.sh "$IMAGE_REF"

  release-gate:
    name: Approve source and run release tests
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: personal-relay-release
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: buzz
          POSTGRES_PASSWORD: buzz_dev
          POSTGRES_USER: buzz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buzz -d buzz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BUZZ_TEST_DATABASE_URL: postgres://buzz:buzz_dev@localhost:5432/buzz
      DATABASE_URL: postgres://buzz:buzz_dev@localhost:5432/buzz
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Require the exact independently approved candidate
        env:
          APPROVED_SOURCE_SHA: ${{ vars.PERSONAL_APPROVED_RELAY_SHA }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::personal-relay-release must define PERSONAL_APPROVED_RELAY_SHA"
            exit 1
          }
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::prepared source does not match github.sha"
            exit 1
          }
          [[ "$APPROVED_SOURCE_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::github.sha is not the exact approved relay candidate"
            exit 1
          }
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]] || {
            echo "::error::checkout does not match the approved invocation source"
            exit 1
          }

      - name: Fail if the candidate tag already exists
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
        run: |
          set -euo pipefail
          package_name=${IMAGE_NAME#ghcr.io/justinharkelroad/}
          api_path="users/justinharkelroad/packages/container/${package_name}/versions?per_page=100"
          if ! gh api --paginate --slurp "$api_path" > /tmp/package-versions.json 2>/tmp/package-versions.err; then
            if grep -q 'HTTP 404' /tmp/package-versions.err; then
              printf '%s\n' '[]' > /tmp/package-versions.json
            else
              cat /tmp/package-versions.err >&2
              exit 1
            fi
          fi
          if jq -e --arg tag "$CANDIDATE_TAG" \
            'any(.[][]?; any((.metadata.container.tags // [])[]?; . == $tag))' \
            /tmp/package-versions.json >/dev/null; then
            echo "::error::candidate tag already exists and will not be moved"
            exit 1
          fi

      - name: Run workflow engine tests with HTTP support
        run: cargo test --locked -p buzz-workflow --features reqwest

      - name: Run database-backed dispatch regressions
        run: |
          set -euo pipefail
          cargo test --locked -p buzz-workflow --features reqwest \
            executor::tests::webhook_dispatch_revalidation_allows_current_admin \
            -- --ignored --exact --test-threads=1
          cargo test --locked -p buzz-workflow --features reqwest \
            executor::tests::webhook_dispatch_denial_precedes_transport_and_disables_workflow \
            -- --ignored --exact --test-threads=1
          cargo test --locked -p buzz-workflow --features reqwest \
            executor::tests::webhook_dispatch_revalidation_preserves_community_scope \
            -- --ignored --exact --test-threads=1

  build-publish:
    name: Build candidate digest (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, release-gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA" && test "$SOURCE_SHA" = "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to personal GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform manifest by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime-personal
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Personal Buzz Relay
          outputs: type=image,name=${{ needs.prepare.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true,oci-artifact=true
          provenance: mode=max
          sbom: true

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p /tmp/personal-relay-digests
          touch "/tmp/personal-relay-digests/${DIGEST#sha256:}"

      - name: Verify exact pushed platform runtime
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          bash ./deploy/personal-relay/runtime-contract-test.sh "$IMAGE_REF"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-relay-digest-${{ matrix.arch }}
          path: /tmp/personal-relay-digests/*
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Scan candidate digest (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, build-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      TRIVY_DISABLE_TELEMETRY: "true"
      TRIVY_OFFLINE_SCAN: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"
      TRIVY_SKIP_VEX_REPO_UPDATE: "true"
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact scan source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA" && test "$SOURCE_SHA" = "$GITHUB_SHA"

      - name: Download platform digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-relay-digest-${{ matrix.arch }}
          path: /tmp/personal-relay-digest

      - name: Resolve platform digest
        id: digest
        run: |
          set -euo pipefail
          mapfile -t files < <(find /tmp/personal-relay-digest -maxdepth 1 -type f)
          [[ ${#files[@]} -eq 1 ]] || {
            echo "::error::expected exactly one platform digest"
            exit 1
          }
          digest="sha256:$(basename "${files[0]}")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to personal GHCR read-only
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and bind the exact platform's raw SBOM attestation
        env:
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repository_path=${IMAGE_NAME#ghcr.io/}
          [[ "$repository_path" != "$IMAGE_NAME" ]]
          registry_token=$(
            curl --fail --silent --show-error --location --retry 3 \
              --user "$IMAGE_OWNER:$GH_TOKEN" \
              --get \
              --data-urlencode service=ghcr.io \
              --data-urlencode "scope=repository:${repository_path}:pull" \
              https://ghcr.io/token \
              | jq -er '.token // .access_token'
          )
          echo "::add-mask::$registry_token"

          registry_get() {
            local path=$1
            local output=$2
            local accept=${3:-}
            local args=(
              --fail --silent --show-error --location --retry 3
              --header "Authorization: Bearer ${registry_token}"
            )
            if [[ -n "$accept" ]]; then
              args+=(--header "Accept: ${accept}")
            fi
            curl "${args[@]}" "https://ghcr.io/v2/${repository_path}/${path}" --output "$output"
          }

          digest_matches() {
            local digest=$1
            local path=$2
            printf '%s  %s\n' "${digest#sha256:}" "$path" | sha256sum --check --status -
          }

          image_index="personal-relay-image-index-${ARCH}.json"
          attestation_manifest="personal-relay-attestation-manifest-${ARCH}.json"
          sbom_attestation="personal-relay-sbom-attestation-${ARCH}.intoto.json"
          spdx="personal-relay-sbom-${ARCH}.spdx.json"

          registry_get \
            "manifests/${IMAGE_DIGEST}" \
            "$image_index" \
            'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          digest_matches "$IMAGE_DIGEST" "$image_index"

          platform_digest=$(jq -er --arg arch "$ARCH" '
            [
              .manifests[]
              | select(.mediaType == "application/vnd.oci.image.manifest.v1+json")
              | select(.platform.os == "linux" and .platform.architecture == $arch)
            ]
            | if length == 1 then .[0].digest else error("expected one platform manifest") end
          ' "$image_index")
          attestation_digest=$(jq -er --arg platform_digest "$platform_digest" '
            [
              .manifests[]
              | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
              | select(.annotations["vnd.docker.reference.digest"] == $platform_digest)
              | select(.platform.os == "unknown" and .platform.architecture == "unknown")
            ]
            | if length == 1 then .[0].digest else error("expected one attestation manifest") end
          ' "$image_index")

          registry_get \
            "manifests/${attestation_digest}" \
            "$attestation_manifest" \
            'application/vnd.oci.image.manifest.v1+json'
          digest_matches "$attestation_digest" "$attestation_manifest"
          jq -e --arg platform_digest "$platform_digest" '
            .artifactType == "application/vnd.docker.attestation.manifest.v1+json"
            and .subject.mediaType == "application/vnd.oci.image.manifest.v1+json"
            and .subject.digest == $platform_digest
            and (.subject.size | type == "number" and . > 0)
          ' "$attestation_manifest" >/dev/null
          sbom_layer_digest=$(jq -er '
            [
              .layers[]
              | select(.mediaType == "application/vnd.in-toto+json")
              | select(.annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")
            ]
            | if length == 1 then .[0].digest else error("expected one SPDX attestation layer") end
          ' "$attestation_manifest")

          registry_get "blobs/${sbom_layer_digest}" "$sbom_attestation"
          digest_matches "$sbom_layer_digest" "$sbom_attestation"
          jq -e --arg subject "${platform_digest#sha256:}" '
            (."_type" == "https://in-toto.io/Statement/v0.1" or
              ."_type" == "https://in-toto.io/Statement/v1")
            and .predicateType == "https://spdx.dev/Document"
            and (.subject | type == "array" and length == 1)
            and .subject[0].digest.sha256 == $subject
            and .predicate.SPDXID == "SPDXRef-DOCUMENT"
            and (.predicate.packages | type == "array" and length > 0)
          ' "$sbom_attestation" >/dev/null
          jq '.predicate' "$sbom_attestation" > "$spdx"

      - name: Export exact image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ needs.prepare.outputs.image_name }}@${{ steps.digest.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: personal-relay-trivy-image-${{ matrix.arch }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: true
          exit-code: "0"
          version: v0.70.0

      - name: Export attached SPDX vulnerability report with the same database
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          scan-type: sbom
          scan-ref: personal-relay-sbom-${{ matrix.arch }}.spdx.json
          scanners: vuln
          vuln-type: os,library
          format: json
          output: personal-relay-trivy-sbom-${{ matrix.arch }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: true
          exit-code: "0"
          version: v0.70.0
          skip-setup-trivy: true
          cache: false

      - name: Record scanner and database identity
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          vulnerability_db="$GITHUB_WORKSPACE/.cache/trivy/db/trivy.db"
          java_db="$GITHUB_WORKSPACE/.cache/trivy/java-db/trivy-java.db"
          test -s "$vulnerability_db"
          vulnerability_db_sha256=$(sha256sum "$vulnerability_db" | awk '{print $1}')
          java_db_sha256=null
          if [[ -s "$java_db" ]]; then
            java_db_sha256=$(sha256sum "$java_db" | awk '{print $1}')
          fi
          trivy version --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --format json \
            | jq \
              --arg vulnerability_db_sha256 "$vulnerability_db_sha256" \
              --arg java_db_sha256 "$java_db_sha256" \
              '. + {
                VulnerabilityDBSHA256: $vulnerability_db_sha256,
                JavaDBSHA256: (if $java_db_sha256 == "null" then null else $java_db_sha256 end)
              }' \
            > "personal-relay-trivy-version-${ARCH}.json"
          jq -e '
            .Version == "0.70.0"
            and (.VulnerabilityDB.UpdatedAt | type == "string" and length > 0)
            and (.VulnerabilityDBSHA256 | test("^[0-9a-f]{64}$"))
            and (.JavaDBSHA256 == null or (.JavaDBSHA256 | test("^[0-9a-f]{64}$")))
          ' \
            "personal-relay-trivy-version-${ARCH}.json" >/dev/null

      - name: Enforce the exact image and attached SPDX report union
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE_REF: ${{ needs.prepare.outputs.image_name }}@${{ steps.digest.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          bash ./deploy/personal-relay/trivy-report-policy.sh \
            --image-report "personal-relay-trivy-image-${ARCH}.json" \
            --sbom-report "personal-relay-trivy-sbom-${ARCH}.json" \
            --image-index "personal-relay-image-index-${ARCH}.json" \
            --attestation-manifest "personal-relay-attestation-manifest-${ARCH}.json" \
            --sbom-attestation "personal-relay-sbom-attestation-${ARCH}.intoto.json" \
            --spdx "personal-relay-sbom-${ARCH}.spdx.json" \
            --expected-image-ref "$IMAGE_REF" \
            --expected-image-digest "$IMAGE_DIGEST" \
            --expected-arch "$ARCH" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-trivy-version 0.70.0 \
            > "personal-relay-trivy-policy-${ARCH}.json"

      - name: Upload exact scan evidence even when policy blocks
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-relay-scan-${{ matrix.arch }}
          path: |
            personal-relay-attestation-manifest-${{ matrix.arch }}.json
            personal-relay-image-index-${{ matrix.arch }}.json
            personal-relay-sbom-attestation-${{ matrix.arch }}.intoto.json
            personal-relay-sbom-${{ matrix.arch }}.spdx.json
            personal-relay-trivy-image-${{ matrix.arch }}.json
            personal-relay-trivy-policy-${{ matrix.arch }}.json
            personal-relay-trivy-sbom-${{ matrix.arch }}.json
            personal-relay-trivy-version-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Create candidate manifest and attest digest
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, release-gate, build-publish, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact publication source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA" && test "$SOURCE_SHA" = "$GITHUB_SHA"

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/personal-relay-digests
          pattern: personal-relay-digest-*
          merge-multiple: true

      - name: Download exact platform scan evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/personal-relay-scan
          pattern: personal-relay-scan-*
          merge-multiple: true

      - name: Reverify exact platform scan bindings
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            summary="/tmp/personal-relay-scan/personal-relay-trivy-policy-${arch}.json"
            version="/tmp/personal-relay-scan/personal-relay-trivy-version-${arch}.json"
            test -s "$summary"
            test -s "$version"
            jq -e \
              --arg arch "$arch" \
              --arg image "$IMAGE_NAME" \
              --arg source_sha "$SOURCE_SHA" '
                .artifact.architecture == $arch
                and .artifact.source_sha == $source_sha
                and .artifact.image_ref == ($image + "@" + .artifact.image_digest)
                and (.artifact.image_digest | test("^sha256:[0-9a-f]{64}$"))
                and .scanner == {name: "Trivy", version: "0.70.0"}
                and .high_critical.fixed_findings == 0
              ' "$summary" >/dev/null
            digest=$(jq -r '.artifact.image_digest | sub("^sha256:"; "")' "$summary")
            test -f "/tmp/personal-relay-digests/${digest}"
          done
          jq -s 'sort_by(.artifact.architecture)' \
            /tmp/personal-relay-scan/personal-relay-trivy-policy-*.json \
            > personal-relay-scan-policy-summaries.json
          jq -e '
            length == 2
            and (map(.artifact.architecture) == ["amd64", "arm64"])
            and (map(.artifact.image_digest) | unique | length == 2)
          ' personal-relay-scan-policy-summaries.json >/dev/null
          jq -n \
            --slurpfile amd64 /tmp/personal-relay-scan/personal-relay-trivy-version-amd64.json \
            --slurpfile arm64 /tmp/personal-relay-scan/personal-relay-trivy-version-arm64.json \
            '[{architecture: "amd64"} + $amd64[0], {architecture: "arm64"} + $arm64[0]]' \
            > personal-relay-trivy-databases.json
          jq -e '
            length == 2
            and (map(.Version) | unique == ["0.70.0"])
            and (map(.VulnerabilityDB.UpdatedAt) | unique | length == 1)
            and (map(.VulnerabilityDBSHA256) | unique | length == 1)
            and (map(.JavaDBSHA256) | unique | length == 1)
          ' personal-relay-trivy-databases.json >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to personal GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck that the candidate tag does not exist
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
        run: |
          set -euo pipefail
          package_name=${IMAGE_NAME#ghcr.io/justinharkelroad/}
          api_path="users/justinharkelroad/packages/container/${package_name}/versions?per_page=100"
          gh api --paginate --slurp "$api_path" > /tmp/package-versions.json
          if jq -e --arg tag "$CANDIDATE_TAG" \
            'any(.[][]?; any((.metadata.container.tags // [])[]?; . == $tag))' \
            /tmp/package-versions.json >/dev/null; then
            echo "::error::candidate tag already exists and will not be moved"
            exit 1
          fi

      - name: Create non-overwriting candidate tag and resolve digest
        id: manifest
        working-directory: /tmp/personal-relay-digests
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
        run: |
          set -euo pipefail
          digest_refs=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
            digest_refs+=("${IMAGE_NAME}@sha256:${digest}")
          done
          [[ ${#digest_refs[@]} -eq 2 ]] || {
            echo "::error::expected exactly two platform digests"
            exit 1
          }
          candidate_ref="${IMAGE_NAME}:${CANDIDATE_TAG}"
          docker buildx imagetools create \
            -t "$candidate_ref" \
            --metadata-file /tmp/personal-relay-manifest-create.json \
            "${digest_refs[@]}"
          manifest_digest=$(jq -er '
            .["containerimage.descriptor"]
            | select(.mediaType == "application/vnd.oci.image.index.v1+json")
            | .digest
          ' /tmp/personal-relay-manifest-create.json)
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          {
            echo "candidate_ref=$candidate_ref"
            echo "digest=$manifest_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the exact merged descriptor union by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repository_path=${IMAGE_NAME#ghcr.io/}
          [[ "$repository_path" != "$IMAGE_NAME" ]]
          registry_token=$(
            curl --fail --silent --show-error --location --retry 3 \
              --user "$IMAGE_OWNER:$GH_TOKEN" \
              --get \
              --data-urlencode service=ghcr.io \
              --data-urlencode "scope=repository:${repository_path}:pull" \
              https://ghcr.io/token \
              | jq -er '.token // .access_token'
          )
          echo "::add-mask::$registry_token"

          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/${repository_path}/manifests/${IMAGE_DIGEST}" \
            --output personal-relay-merged-index.json
          printf '%s  %s\n' \
            "${IMAGE_DIGEST#sha256:}" \
            personal-relay-merged-index.json \
            | sha256sum --check --status -

          metadata_size=$(jq -er --arg digest "$IMAGE_DIGEST" '
            .["containerimage.descriptor"]
            | select(.digest == $digest)
            | .size
          ' /tmp/personal-relay-manifest-create.json)
          actual_size=$(wc -c < personal-relay-merged-index.json)
          actual_size=${actual_size//[[:space:]]/}
          [[ "$metadata_size" == "$actual_size" ]]

          jq -s '
            map(.manifests) | add | sort_by(.digest)
          ' \
            /tmp/personal-relay-scan/personal-relay-image-index-amd64.json \
            /tmp/personal-relay-scan/personal-relay-image-index-arm64.json \
            > personal-relay-expected-merged-descriptors.json
          jq -e \
            --slurpfile expected personal-relay-expected-merged-descriptors.json '
              .schemaVersion == 2
              and .mediaType == "application/vnd.oci.image.index.v1+json"
              and (.manifests | type == "array")
              and (.manifests | sort_by(.digest)) == $expected[0]
            ' personal-relay-merged-index.json >/dev/null

      - name: Verify binaries and scoped privilege drop
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_name }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          bash ./deploy/personal-relay/runtime-contract-test.sh "$IMAGE_REF"

      - name: Attest merged image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ needs.prepare.outputs.image_name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Verify repository-scoped attestation and inspect predicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.prepare.outputs.image_name }}@${{ steps.manifest.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE_REF}" \
            -R "$GITHUB_REPOSITORY" \
            --source-digest "$SOURCE_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json > personal-relay-attestation-verification.json
          jq -e 'length > 0' personal-relay-attestation-verification.json >/dev/null
          jq '[.[].verificationResult.statement.predicate]' \
            personal-relay-attestation-verification.json \
            > personal-relay-attestation-predicate.json

      - name: Write non-secret release ledger
        env:
          CANDIDATE_REF: ${{ steps.manifest.outputs.candidate_ref }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          merged_index_sha256=$(sha256sum personal-relay-merged-index.json | awk '{print $1}')
          manifest_create_sha256=$(sha256sum /tmp/personal-relay-manifest-create.json | awk '{print $1}')
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg image "$IMAGE_NAME" \
            --arg candidate_ref "$CANDIDATE_REF" \
            --arg digest "$IMAGE_DIGEST" \
            --arg deployment_ref "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --arg merged_index_sha256 "$merged_index_sha256" \
            --arg manifest_create_sha256 "$manifest_create_sha256" \
            --arg workflow_run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile scan_policy personal-relay-scan-policy-summaries.json \
            --slurpfile scanner_databases personal-relay-trivy-databases.json \
            '{repository: $repository, source_sha: $source_sha, workflow_ref: $workflow_ref, workflow_sha: $workflow_sha, image: $image, candidate_ref: $candidate_ref, candidate_tag_policy: "best-effort non-overwriting marker; never used for deployment or digest resolution", digest: $digest, deployment_ref: $deployment_ref, artifact_status: "candidate_only", deployment_eligible: false, deployment_blockers: ["separate protected Gate 1 review", "recorded disposition for every remaining HIGH and CRITICAL finding"], merged_manifest: {raw_index_sha256: $merged_index_sha256, create_metadata_sha256: $manifest_create_sha256, descriptor_policy: "exact union of the two scanned platform indexes"}, sbom: "raw OCI descriptor chain and OCI-artifact subject cryptographically bind each retained SPDX predicate to its exact platform manifest", vulnerability_gate: "exact Trivy JSON image and subject-bound SPDX report union blocks fixed HIGH and CRITICAL findings on AMD64 and ARM64", unfixed_high_critical_finding_rows: ($scan_policy[0] | map(.high_critical.unfixed_findings) | add // 0), scan_policy: $scan_policy[0], scanner_databases: $scanner_databases[0], database_regressions: "three webhook dispatch authority tests passed against Postgres", workflow_run: $workflow_run}' \
            > personal-relay-release.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-relay-evidence-${{ github.sha }}
          path: |
            personal-relay-attestation-predicate.json
            personal-relay-attestation-verification.json
            personal-relay-expected-merged-descriptors.json
            personal-relay-merged-index.json
            personal-relay-release.json
            personal-relay-scan-policy-summaries.json
            personal-relay-trivy-databases.json
            /tmp/personal-relay-manifest-create.json
            /tmp/personal-relay-scan/*
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_name }}@${{ steps.manifest.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          {
            echo "### Personal relay artifact"
            echo
            echo "Source: \`$SOURCE_SHA\`"
            echo
            echo "Deployment image: \`$IMAGE_REF\`"
            echo
            echo "The digest-qualified image is immutable but remains candidate-only."
            echo
            echo "Deployment eligibility requires a separate protected Gate 1 review and recorded dispositions."
            echo
            echo "This workflow publishes an artifact only. It does not deploy Railway or change hosted Buzz."
          } >> "$GITHUB_STEP_SUMMARY"
