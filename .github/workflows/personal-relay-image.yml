          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repository_path=${IMAGE_NAME#ghcr.io/}
          [[ "$repository_path" != "$IMAGE_NAME" ]]
          registry_token=$(
            curl --fail --silent --show-error --location --retry 3 \
              --user "$IMAGE_OWNER:$GH_TOKEN" \
              --get \
              --data-urlencode service=ghcr.io \
              --data-urlencode "scope=repository:${repository_path}:pull" \
              https://ghcr.io/token \
              | jq -er '.token // .access_token'
          )
          echo "::add-mask::$registry_token"

          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/${repository_path}/manifests/${IMAGE_DIGEST}" \
            --output personal-relay-merged-index.json
          printf '%s  %s\n' \
            "${IMAGE_DIGEST#sha256:}" \
            personal-relay-merged-index.json \
            | sha256sum --check --status -

