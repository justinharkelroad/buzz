            echo "::error::PERSONAL_RULESET_EVIDENCE_TOKEN is required to expose ruleset bypass actors"
            exit 1
          }
          mapfile -t live_ruleset_ids < <(jq -er '[.[].ruleset_id] | unique[]' "$live_rules")
          [[ ${#live_ruleset_ids[@]} -ge 1 ]]
          for ruleset_id in "${live_ruleset_ids[@]}"; do
            [[ "$ruleset_id" =~ ^[1-9][0-9]*$ ]]
            ruleset_raw="${live_ruleset_details}.${ruleset_id}.raw.json"
            [[ ! -e "$ruleset_raw" && ! -L "$ruleset_raw" ]]
            GH_TOKEN="$RULESET_EVIDENCE_TOKEN" gh api --hostname github.com \
              "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" > "$ruleset_raw"
            jq -e 'type == "object" and has("bypass_actors") and (.bypass_actors | type == "array")' \
              "$ruleset_raw" >/dev/null || {
              echo "::error::ruleset API did not expose bypass_actors to PERSONAL_RULESET_EVIDENCE_TOKEN"
              exit 1
            }
            jq -cS '{
              id,
              name,
              target,
              source_type,
              source,
              enforcement,
              bypass_actors: (.bypass_actors | sort_by(.actor_type // "", .actor_id // 0, .bypass_mode // ""))
            }' \
              "$ruleset_raw" >> "$live_ruleset_details"
            rm -f "$ruleset_raw"
          done
          jq -sS 'sort_by(.id)' "$live_ruleset_details" > "$live_rulesets"
          gh api --hostname github.com \
            "repos/$GITHUB_REPOSITORY/environments/personal-relay-release" \
            > "$live_environment_raw"
          jq -S '{
              id,
              node_id,
              name,
              protection_rules: [.protection_rules[]] | sort_by(.type),
              deployment_branch_policy
            }' "$live_environment_raw" > "$live_environment"
          gh api --hostname github.com --paginate \
