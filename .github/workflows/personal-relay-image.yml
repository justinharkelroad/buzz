            --hostname github.com --include \
            "repos/$GITHUB_REPOSITORY/branches/main/protection/required_pull_request_reviews" \
            2>/dev/null)
          classic_reviews_exit=$?
          set -e
          classic_reviews_status=$(printf '%s\n' "$classic_reviews_headers" | awk 'NR == 1 {print $2}')
          case "$classic_reviews_status" in
            404) ;;
            200)
              echo "::error::classic main required pull-request reviews are configured"
              exit 1
              ;;
            *)
              echo "::error::classic main required pull-request review absence could not be proven (HTTP ${classic_reviews_status:-unknown}, gh exit $classic_reviews_exit)"
              exit 1
              ;;
