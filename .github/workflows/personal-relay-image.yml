      - name: Attest merged image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ needs.prepare.outputs.image_name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          show-summary: false

      - name: Remove GHCR credentials after registry attestation
        if: ${{ always() }}
        run: |
          set -euo pipefail
          expected_config=/tmp/personal-relay-publish-docker
          [[ "$DOCKER_CONFIG" == "$expected_config" ]]
          if [[ -L "$DOCKER_CONFIG" ]]; then
            unlink -- "$DOCKER_CONFIG"
            echo "::error::refused to follow a symlinked Docker credential directory"
            exit 1
          fi
          if [[ -e "$DOCKER_CONFIG" ]]; then
            [[ -d "$DOCKER_CONFIG" && -O "$DOCKER_CONFIG" ]]
            config_file="$DOCKER_CONFIG/config.json"
            if [[ -L "$config_file" ]]; then
              unlink -- "$config_file"
              echo "::error::refused to follow a symlinked Docker credential file"
              exit 1
            fi
            if [[ -e "$config_file" ]]; then
              [[ -f "$config_file" && -O "$config_file" ]]
              shred --force --iterations=3 --remove --zero -- "$config_file"
            fi
            [[ ! -e "$config_file" && ! -L "$config_file" ]]
            [[ -z "$(find "$DOCKER_CONFIG" -mindepth 1 -maxdepth 1 -print -quit)" ]]
            rmdir -- "$DOCKER_CONFIG"
          fi
          [[ ! -e "$DOCKER_CONFIG" && ! -L "$DOCKER_CONFIG" ]]

      - name: Verify repository-scoped attestation and inspect predicate
