name: Harbor Buzz Orchestra

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/harbor-buzz-orchestra/**"
      - ".github/workflows/benchmark-harbor.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "benchmarks/harbor-buzz-orchestra/**"
      - ".github/workflows/benchmark-harbor.yml"

concurrency:
  group: harbor-buzz-orchestra-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Python tests and lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Test adapter
        working-directory: benchmarks/harbor-buzz-orchestra
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          pytest -q
          ruff check .
      - name: Test provisioner
        working-directory: benchmarks/harbor-buzz-orchestra/testbed
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          pytest -q
          ruff check .
