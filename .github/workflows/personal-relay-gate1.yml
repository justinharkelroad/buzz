            > /tmp/personal-relay-gate1-source-jobs.json
          [[ "$(jq 'length' /tmp/personal-relay-gate1-source-jobs.json)" == 1 ]]
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg workflow_sha "$GITHUB_SHA" '
              .[0]
              | .run_id == $run_id
              and .head_sha == $workflow_sha
              and .name == "Unprivileged exact-source authorization tests"
              and .status == "completed"
              and .conclusion == "success"
              and (.id | type == "number" and . >= 1 and floor == .)
              and (.steps | type == "array" and length > 0)
              and all(.steps[]?; .status == "completed" and .conclusion == "success")
              and ([.steps[]? | select(
                .name == "Checkout only the exact published source"
                and .status == "completed" and .conclusion == "success")] | length) == 1
              and ([.steps[]? | select(
                .name == "Verify unprivileged source-test invocation"
                and .status == "completed" and .conclusion == "success")] | length) == 1
              and ([.steps[]? | select(
                .name == "Activate exact source Hermit toolchain"
                and .status == "completed" and .conclusion == "success")] | length) == 1
              and ([.steps[]? | select(
                .name == "Run exact relay and ACP authorization acceptance tests"
                and .status == "completed" and .conclusion == "success")] | length) == 1
            ' /tmp/personal-relay-gate1-source-jobs.json >/dev/null
          jq '.[0] | {
            id,
            run_id,
            head_sha,
            name,
            status,
            conclusion,
            started_at,
            completed_at,
            steps: [.steps[] | {name, status, conclusion, number}]
          }' /tmp/personal-relay-gate1-source-jobs.json \
            > "$proof_dir/source-test-job.json"
          workflow_path=.github/workflows/personal-relay-gate1.yml
          [[ -f "$workflow_path" && ! -L "$workflow_path" ]]
