name: Personal Relay Gate 1 Receipt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source SHA of the published personal relay candidate"
        required: true
        type: string
      image_name:
        description: "Exact candidate image name (ghcr.io/justinharkelroad/...)"
        required: true
        default: ghcr.io/justinharkelroad/buzz-relay-personal
        type: string
      image_digest:
        description: "Exact merged candidate digest (sha256:...)"
        required: true
        type: string
      approval_sha256:
        description: "Canonical SHA-256 of the reviewed Gate 1 approval JSON committed on main"
        required: true
        type: string
      confirmation:
        description: "Enter ISSUE_PERSONAL_RELAY_GATE1_RECEIPT"
        required: true
        type: string

concurrency:
  group: personal-relay-gate1-${{ github.event_name == 'pull_request' && github.ref || inputs.source_sha || github.sha }}-${{ inputs.image_digest || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  contract:
    name: Gate 1 receipt contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Gate 1 receipt fixtures and workflow contract
        run: |
          set -euo pipefail
          bash ./deploy/personal-relay/gate1-receipt-test.sh
          bash ./deploy/personal-relay/release-contract-test.sh

      - name: Stage changed Gate 1 approvals for proactive secret scanning
        id: changed-approvals
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          scan_dir=/tmp/personal-relay-gate1-pr-approvals
          mkdir -p "$scan_dir"
          count=0
          while IFS= read -r -d '' path; do
            [[ "$path" =~ ^deploy/personal-relay/gate1-approvals/[0-9a-f]{40}-[0-9a-f]{64}\.json$ ]]
            [[ -f "$path" && ! -L "$path" ]]
            git ls-files --error-unmatch "$path" >/dev/null
            jq -e . "$path" >/dev/null
            cp -- "$path" "$scan_dir/${path##*/}"
            count=$((count + 1))
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- 'deploy/personal-relay/gate1-approvals/**')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create trusted empty Trivy configuration outside the checkout
        if: github.event_name == 'pull_request' && steps.changed-approvals.outputs.count != '0'
        run: |
          set -euo pipefail
          [[ ! -e trivyignores && ! -L trivyignores ]]
          for policy_path in \
            /tmp/personal-relay-trivy-config.yaml \
            /tmp/personal-relay-trivy-ignore \
            /tmp/personal-relay-trivy-secret.yaml; do
            [[ ! -e "$policy_path" && ! -L "$policy_path" ]]
          done
          install -m 600 /dev/null /tmp/personal-relay-trivy-config.yaml
          install -m 600 /dev/null /tmp/personal-relay-trivy-ignore
          install -m 600 /dev/null /tmp/personal-relay-trivy-secret.yaml
          printf '{}\n' > /tmp/personal-relay-trivy-config.yaml
          printf '{}\n' > /tmp/personal-relay-trivy-secret.yaml

      - name: Scan changed Gate 1 approvals for secrets
        if: github.event_name == 'pull_request' && steps.changed-approvals.outputs.count != '0'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CONFIG: /tmp/personal-relay-trivy-config.yaml
          TRIVY_IGNOREFILE: /tmp/personal-relay-trivy-ignore
          TRIVY_SECRET_CONFIG: /tmp/personal-relay-trivy-secret.yaml
        with:
          cache: false
          scan-type: fs
          scan-ref: /tmp/personal-relay-gate1-pr-approvals
          scanners: secret
          format: json
          output: /tmp/personal-relay-gate1-pr-approval-secret.json
          exit-code: "1"
          trivy-config: /tmp/personal-relay-trivy-config.yaml
          trivyignores: /tmp/personal-relay-trivy-ignore
          version: v0.70.0

      - name: Validate proactive approval secret-scan report
        if: github.event_name == 'pull_request' && steps.changed-approvals.outputs.count != '0'
        run: |
          set -euo pipefail
          report=/tmp/personal-relay-gate1-pr-approval-secret.json
          bound_report=/tmp/personal-relay-gate1-pr-approval-secret-bound.json
          jq '. + {Trivy: {Version: "0.70.0"}}' \
            "$report" > "$bound_report"
          install -m 0600 "$bound_report" "$report"
          jq -e '
            .SchemaVersion == 2
            and .ArtifactType == "filesystem"
            and .Trivy.Version == "0.70.0"
            and ([.Results[]? | .Secrets[]?] | length) == 0
          ' "$report" >/dev/null

  source-tests:
    name: Unprivileged exact-source authorization tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: buzz
          POSTGRES_PASSWORD: buzz_dev
          POSTGRES_USER: buzz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buzz -d buzz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      BUZZ_TEST_DATABASE_URL: postgres://buzz:buzz_dev@localhost:5432/buzz
      DATABASE_URL: postgres://buzz:buzz_dev@localhost:5432/buzz
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      IMAGE_NAME: ${{ inputs.image_name }}
      REDIS_URL: redis://localhost:6379
      REF_PROTECTED: ${{ github.ref_protected }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout only the exact published source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unprivileged source-test invocation
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REPOSITORY" == "justinharkelroad/buzz" ]]
          [[ "$GITHUB_ACTOR" == "justinharkelroad" && "$GITHUB_TRIGGERING_ACTOR" == "justinharkelroad" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "justinharkelroad/buzz/.github/workflows/personal-relay-gate1.yml@refs/heads/main" ]]
          [[ "$REF_PROTECTED" == "true" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_NAME" =~ ^ghcr\.io/justinharkelroad/[a-z0-9._-]+$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$APPROVAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIRMATION" == "ISSUE_PERSONAL_RELAY_GATE1_RECEIPT" ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$SOURCE_SHA" ]]

      - name: Activate exact source Hermit toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Run exact relay and ACP authorization acceptance tests
        run: |
          set -euo pipefail
          require_exact_test() {
            local package=$1
            local full_name=$2
            local mode=$3
            local list_file
            local match_count
            list_file=$(mktemp /tmp/personal-relay-gate1-test-list.XXXXXXXX)
            if [[ "$mode" == ignored ]]; then
              cargo test --locked -p "$package" "$full_name" -- \
                --ignored --exact --list --format terse > "$list_file"
            else
              [[ "$mode" == normal ]]
              cargo test --locked -p "$package" "$full_name" -- \
                --exact --list --format terse > "$list_file"
            fi
            match_count=$(grep -Fxc -- "${full_name}: test" "$list_file" || true)
            rm -f "$list_file"
            [[ "$match_count" == 1 ]] || {
              echo "::error::expected exactly one listed Rust test for ${package}:${full_name}; found ${match_count}"
              exit 1
            }
          }
          cargo run --locked -p buzz-admin -- migrate
          relay_test=workflow_sink::integration_tests::workflow_send_message_p_tags_mentioned_member
          require_exact_test buzz-relay "$relay_test" ignored
          cargo test --locked -p buzz-relay \
            "$relay_test" \
            -- --ignored --exact --test-threads=1
          acp_tests=(
            trusted_relay_workflow_uses_attributed_owner_for_author_gate
            forged_workflow_marker_cannot_replace_actual_signer
            relay_signed_non_workflow_event_cannot_replace_actual_signer
            missing_trusted_relay_identity_fails_closed_to_actual_signer
            invalid_signature_fails_closed_to_actual_signer
            wrong_kind_fails_closed_to_actual_signer
            duplicate_actor_or_workflow_tags_fail_closed_to_actual_signer
            test_allowlist_accepts_explicit_external_pubkey
            test_allowlist_rejects_non_sibling_not_in_allowlist
            test_owner_only_rejects_stranger_so_no_steer
            test_dm_accepts_explicit_allowlisted_external_pubkey
            test_dm_rejects_allowlisted_external_pubkey_in_group
            test_dm_rejects_external_pubkey_absent_from_allowlist
            test_dm_rejects_stranger_under_anyone
            test_author_gate_resolver_caches_verified_immutable_dm_metadata
            test_author_gate_unknown_metadata_is_immediate_singleflight_and_backed_off
            test_dynamic_dm_prefetch_accepts_first_replayed_allowlisted_message
          )
          for test_name in "${acp_tests[@]}"; do
            full_name="author_gate_tests::${test_name}"
            require_exact_test buzz-acp "$full_name" normal
            cargo test --locked -p buzz-acp "$full_name" -- --exact
          done
          acp_nip11_test=relay::tests::nip11_identity_lookup_retries_boundedly_and_recovers
          require_exact_test buzz-acp "$acp_nip11_test" normal
          cargo test --locked -p buzz-acp "$acp_nip11_test" -- --exact
          core_test=dm::tests::relay_channel_metadata_verifier_is_strict_and_fail_closed
          require_exact_test buzz-core "$core_test" normal
          cargo test --locked -p buzz-core "$core_test" -- --exact
          relay_dm_tests=(
            handlers::side_effects::tests::immutable_dm_admin_routes_reject_in_place_membership_and_visibility_mutations
            handlers::side_effects::tests::immutable_dm_discovery_tags_are_sorted_and_committed
            handlers::side_effects::tests::immutable_dm_reconciliation_matcher_rejects_unmarked_metadata
          )
          for full_name in "${relay_dm_tests[@]}"; do
            require_exact_test buzz-relay "$full_name" normal
            cargo test --locked -p buzz-relay "$full_name" -- --exact
          done
          relay_runtime_tests=(
            nip11::tests::nip11_dev_fallback_identity_is_advertised_for_harness_verification
            tests::channel_reconciliation_schedule_is_durable_beyond_legacy_startup_window
          )
          for full_name in "${relay_runtime_tests[@]}"; do
            require_exact_test buzz-relay "$full_name" normal
            cargo test --locked -p buzz-relay "$full_name" -- --exact
          done
          admin_reconcile_test=tests::reconcile_replacement_bumps_past_trusted_wrong_d_and_ignores_wrong_signer
          require_exact_test buzz-admin "$admin_reconcile_test" ignored
          cargo test --locked -p buzz-admin "$admin_reconcile_test" -- --ignored --exact --test-threads=1
          db_test=dm::tests::immutable_dm_database_guards_reject_mutations_and_allow_create_dm
          require_exact_test buzz-db "$db_test" ignored
          cargo test --locked -p buzz-db "$db_test" -- --ignored --exact --test-threads=1
          core_group_role_test=dm::tests::relay_group_role_discovery_verifier_is_strict_and_fail_closed
          require_exact_test buzz-core "$core_group_role_test" normal
          cargo test --locked -p buzz-core "$core_group_role_test" -- --exact
          core_relay_only_test=kind::tests::nip29_relay_authored_discovery_snapshots_are_relay_only
          require_exact_test buzz-core "$core_relay_only_test" normal
          cargo test --locked -p buzz-core "$core_relay_only_test" -- --exact
          relay_client_discovery_test=handlers::ingest::tests::relay_authored_discovery_and_membership_triggers_are_rejected_from_client_ingest
          require_exact_test buzz-relay "$relay_client_discovery_test" normal
          cargo test --locked -p buzz-relay "$relay_client_discovery_test" -- --exact
          acp_membership_discovery_test=relay::tests::membership_discovery_rejects_forged_invalid_or_stale_snapshots
          require_exact_test buzz-acp "$acp_membership_discovery_test" normal
          cargo test --locked -p buzz-acp "$acp_membership_discovery_test" -- --exact
          acp_metadata_discovery_test=relay::tests::merge_discovered_channels_omits_missing_wrong_signer_and_malformed_metadata
          require_exact_test buzz-acp "$acp_metadata_discovery_test" normal
          cargo test --locked -p buzz-acp "$acp_metadata_discovery_test" -- --exact
          core_membership_notification_test=dm::tests::relay_membership_notification_verifier_is_strict_and_target_bound
          require_exact_test buzz-core "$core_membership_notification_test" normal
          cargo test --locked -p buzz-core "$core_membership_notification_test" -- --exact
          core_metadata_content_test=dm::tests::relay_channel_metadata_rejects_signed_nonempty_content
          require_exact_test buzz-core "$core_metadata_content_test" normal
          cargo test --locked -p buzz-core "$core_metadata_content_test" -- --exact
          acp_current_membership_test=relay::tests::current_membership_state_is_tri_state_and_stale_notification_safe
          require_exact_test buzz-acp "$acp_current_membership_test" normal
          cargo test --locked -p buzz-acp "$acp_current_membership_test" -- --exact
          acp_metadata_shadow_test=relay::tests::merge_discovered_channels_newer_malformed_coordinate_shadows_older_valid_metadata
          require_exact_test buzz-acp "$acp_metadata_shadow_test" normal
          cargo test --locked -p buzz-acp "$acp_metadata_shadow_test" -- --exact
          acp_verified_dm_metadata_test=relay::tests::merge_discovered_channels_accepts_only_fully_verified_dm_metadata
          require_exact_test buzz-acp "$acp_verified_dm_metadata_test" normal
          cargo test --locked -p buzz-acp "$acp_verified_dm_metadata_test" -- --exact
          acp_membership_recheck_test=relay::tests::membership_recheck_command_reopens_trigger_dedup_without_losing_replay_floor
          require_exact_test buzz-acp "$acp_membership_recheck_test" normal
          cargo test --locked -p buzz-acp "$acp_membership_recheck_test" -- --exact
          acp_setup_membership_test=setup_mode::tests::setup_membership_notifications_requery_current_signed_39002
          require_exact_test buzz-acp "$acp_setup_membership_test" normal
          cargo test --locked -p buzz-acp "$acp_setup_membership_test" -- --exact
          acp_pool_wrong_signer_test=pool::tests::lazy_metadata_lookup_ignores_newer_wrong_signer_sibling
          require_exact_test buzz-acp "$acp_pool_wrong_signer_test" normal
          cargo test --locked -p buzz-acp "$acp_pool_wrong_signer_test" -- --exact
          acp_pool_malformed_head_test=pool::tests::lazy_metadata_lookup_newer_malformed_trusted_head_shadows_older_valid
          require_exact_test buzz-acp "$acp_pool_malformed_head_test" normal
          cargo test --locked -p buzz-acp "$acp_pool_malformed_head_test" -- --exact
          relay_reconciliation_matcher_test=handlers::side_effects::tests::channel_reconciliation_matcher_rejects_wrong_signer_or_stale_regular_metadata
          require_exact_test buzz-relay "$relay_reconciliation_matcher_test" normal
          cargo test --locked -p buzz-relay "$relay_reconciliation_matcher_test" -- --exact
          relay_missing_members_repair_test=handlers::side_effects::tests::channel_reconciliation_repairs_missing_members_snapshot_with_valid_metadata
          require_exact_test buzz-relay "$relay_missing_members_repair_test" ignored
          cargo test --locked -p buzz-relay "$relay_missing_members_repair_test" -- --ignored --exact --test-threads=1
          admin_missing_members_repair_test=tests::reconcile_channels_repairs_missing_members_snapshot_with_valid_metadata
          require_exact_test buzz-admin "$admin_missing_members_repair_test" ignored
          cargo test --locked -p buzz-admin "$admin_missing_members_repair_test" -- --ignored --exact --test-threads=1
          db_duplicate_participants_test=dm::tests::create_dm_rejects_duplicate_participants_before_opening_transaction
          require_exact_test buzz-db "$db_duplicate_participants_test" normal
          cargo test --locked -p buzz-db "$db_duplicate_participants_test" -- --exact
          db_migration_contract_test=migration::tests::immutable_dm_migration_contract_is_embedded
          require_exact_test buzz-db "$db_migration_contract_test" normal
          cargo test --locked -p buzz-db "$db_migration_contract_test" -- --exact
          acp_setup_stale_add_test=setup_mode::tests::setup_membership_stale_add_cannot_override_current_removal_snapshot
          require_exact_test buzz-acp "$acp_setup_stale_add_test" normal
          cargo test --locked -p buzz-acp "$acp_setup_stale_add_test" -- --exact
          acp_setup_stale_remove_test=setup_mode::tests::setup_membership_stale_remove_cannot_override_current_member_snapshot
          require_exact_test buzz-acp "$acp_setup_stale_remove_test" normal
          cargo test --locked -p buzz-acp "$acp_setup_stale_remove_test" -- --exact
          acp_readd_subscription_test=relay::tests::verified_member_requires_ensure_subscribe_despite_stale_outer_tracking
          require_exact_test buzz-acp "$acp_readd_subscription_test" normal
          cargo test --locked -p buzz-acp "$acp_readd_subscription_test" -- --exact
          acp_membership_retry_cap_test=relay::tests::membership_unknown_retry_is_bounded_and_distinct_readd_remains_processable
          require_exact_test buzz-acp "$acp_membership_retry_cap_test" normal
          cargo test --locked -p buzz-acp "$acp_membership_retry_cap_test" -- --exact
          acp_readd_background_repair_test=relay::tests::readd_ensure_subscribe_repairs_closed_drop_despite_stale_outer_tracking
          require_exact_test buzz-acp "$acp_readd_background_repair_test" normal
          cargo test --locked -p buzz-acp "$acp_readd_background_repair_test" -- --exact
          acp_exhausted_remove_policy_test=relay::tests::exhausted_remove_fails_closed_but_add_waits_for_distinct_repair
          require_exact_test buzz-acp "$acp_exhausted_remove_policy_test" normal
          cargo test --locked -p buzz-acp "$acp_exhausted_remove_policy_test" -- --exact
          acp_membership_removal_cleanup_test=membership_removal_cleanup_tests::authoritative_nonmember_and_exhausted_remove_share_full_cleanup_path
          require_exact_test buzz-acp "$acp_membership_removal_cleanup_test" normal
          cargo test --locked -p buzz-acp "$acp_membership_removal_cleanup_test" -- --exact
          acp_setup_exhausted_remove_test=setup_mode::tests::setup_exhausted_remove_fails_closed_through_unsubscribe_path
          require_exact_test buzz-acp "$acp_setup_exhausted_remove_test" normal
          cargo test --locked -p buzz-acp "$acp_setup_exhausted_remove_test" -- --exact

  source-proof:
    name: Trusted exact-source result seal
    if: github.event_name == 'workflow_dispatch' && needs.source-tests.result == 'success'
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
      BASH_ENV: ""
      CONFIRMATION: ${{ inputs.confirmation }}
      ENV: ""
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      IMAGE_NAME: ${{ inputs.image_name }}
      REF_PROTECTED: ${{ github.ref_protected }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - name: Checkout only the protected Gate 1 verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean source-proof invocation
        id: identity
        env:
          SOURCE_TESTS_RESULT: ${{ needs.source-tests.result }}
        run: |
          set -euo pipefail
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REPOSITORY" == "justinharkelroad/buzz" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "justinharkelroad/buzz/.github/workflows/personal-relay-gate1.yml@refs/heads/main" ]]
          [[ "$REF_PROTECTED" == "true" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$SOURCE_TESTS_RESULT" == "success" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_NAME" =~ ^ghcr\.io/justinharkelroad/[a-z0-9._-]+$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$APPROVAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIRMATION" == "ISSUE_PERSONAL_RELAY_GATE1_RECEIPT" ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          echo "artifact_name=personal-relay-gate1-source-tests-${SOURCE_SHA}-${GITHUB_RUN_ID}-1" >> "$GITHUB_OUTPUT"

      - name: Fetch and validate GitHub-controlled source-test result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          proof_dir=/tmp/personal-relay-gate1-source-proof
          install -d -m 0700 "$proof_dir"
          gh api --hostname github.com \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1" \
            > /tmp/personal-relay-gate1-source-run.raw.json
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg workflow_sha "$GITHUB_SHA" '
              .id == $run_id
              and .run_attempt == 1
              and .event == "workflow_dispatch"
              and .head_sha == $workflow_sha
              and .head_branch == "main"
              and .path == ".github/workflows/personal-relay-gate1.yml"
              and .repository.full_name == "justinharkelroad/buzz"
